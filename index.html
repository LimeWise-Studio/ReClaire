<script>
  (() => {
    'use strict';

    // --- Configuration ---
    let API_BASE = localStorage.getItem('reclaire_api_base') || 'https://reclaire-api.onrender.com';
    const SUPABASE_URL = 'https://lbraefssokojulyfmmjd.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxicmFlZnNzb2tvanVseWZtbWpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMjQyODksImV4cCI6MjEwMzYwMDI4OX0.e_jmB4jS_-cwKAraZpspPhEW_K4l2mbhhPZAlgN_y1E';
    let supabaseClient = null;
    if (typeof supabase !== 'undefined' && SUPABASE_URL && SUPABASE_ANON_KEY) {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    // --- State ---
    const state = {
      screen: 'landing',          // 'landing' | 'app'
      authMode: 'login',          // 'login' | 'register'
      page: 'playground',         // 'playground' | 'batch' | 'usage' | 'settings'
      theme: localStorage.getItem('reclaire_theme') || 'light',
      user: null,
      apiKey: localStorage.getItem('reclaire_api_key') || '',
      tokenBalance: 0,

      // Playground
      mode: 'scrape',             // 'scrape' | 'map' | 'crawl'
      url: '',
      formats: ['markdown'],
      question: '',
      loading: false,
      result: null,

      // Batch
      batchUrls: [],
      batchRunning: false,
      batchId: null,
      batchResult: null,

      // Usage
      usageLogs: [],
    };

    // --- Utilities ---
    const $ = (s, r = document) => r.querySelector(s);
    const $$ = (s, r = document) => [...r.querySelectorAll(s)];
    const esc = v => String(v ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    const logoImg = (c = '') => `<img class="${c}" src="reclaire-logo.svg" alt="ReClaire logo" onerror="this.style.visibility='hidden'">`;
    const initials = n => (n || 'User').split(/\s+/).map(x => x[0]).join('').slice(0, 2).toUpperCase();

    function notify(title, msg) {
      const el = document.createElement('div');
      el.className = 'toast';
      el.innerHTML = `<strong>${esc(title)}</strong><span>${esc(msg)}</span>`;
      $('#toastStack').appendChild(el);
      setTimeout(() => el.remove(), 4300);
    }

    function setTheme(t) {
      state.theme = t;
      document.body.dataset.theme = t;
      localStorage.setItem('reclaire_theme', t);
      const meta = document.querySelector('meta[name=theme-color]');
      if (meta) meta.setAttribute('content', t === 'dark' ? '#0b0b0b' : '#f7f7f5');
    }

    function headers() {
      return state.apiKey
        ? { 'X-API-Key': state.apiKey, 'Content-Type': 'application/json' }
        : { 'Content-Type': 'application/json' };
    }

    async function api(path, opt = {}) {
      const r = await fetch(API_BASE + path, { ...opt, headers: { ...headers(), ...(opt.headers || {}) } });
      let d = {};
      try { d = await r.json(); } catch {}
      if (!r.ok) throw Error(d.detail || d.message || `Request failed (${r.status})`);
      return d;
    }

    async function loadAccount() {
      try {
        const data = await api('/auth/me');
        state.tokenBalance = data.tokens_remaining || 0;
        return true;
      } catch {
        return false;
      }
    }

    // --- Auth ---
    async function handleAuth() {
      const email = $('#authEmail')?.value?.trim();
      const password = $('#authPassword')?.value;
      const username = $('#authUsername')?.value?.trim();
      if (!email || !password) { notify('Missing fields', 'Email and password required.'); return; }
      try {
        let data;
        if (state.authMode === 'register') {
          data = await api('/auth/register', {
            method: 'POST',
            body: JSON.stringify({ email, password, username })
          });
        } else {
          data = await api('/auth/login', {
            method: 'POST',
            body: JSON.stringify({ email, password })
          });
        }
        state.apiKey = data.api_key;
        localStorage.setItem('reclaire_api_key', data.api_key);
        state.user = data.user;
        state.tokenBalance = data.tokens_remaining || 0;
        state.screen = 'app';
        state.authMode = null; // close modal
        notify('Success', state.authMode === 'register' ? 'Account created!' : 'Welcome back!');
        render();
      } catch (e) {
        notify('Auth failed', e.message);
      }
    }

    async function logout() {
      try {
        await api('/auth/logout', { method: 'POST' });
      } catch {}
      state.apiKey = '';
      localStorage.removeItem('reclaire_api_key');
      state.user = null;
      state.screen = 'landing';
      render();
    }

    // --- Execute ---
    async function execute() {
      if (state.loading) return;
      const url = state.url.trim();
      if (!url) { notify('URL required', 'Enter a valid URL.'); return; }
      if (state.mode === 'scrape' && state.formats.includes('questions') && !state.question.trim()) {
        notify('Question required', 'Enter a question for Q&A.');
        return;
      }

      state.loading = true;
      state.result = null;
      render();

      try {
        let data;
        if (state.mode === 'scrape') {
          data = await api('/v1/scrape', {
            method: 'POST',
            body: JSON.stringify({
              url,
              formats: state.formats,
              user_question: state.question || null,
              use_js_fallback: true,
              only_main_content: true,
              remove_tags: ['script', 'style', 'nav', 'footer', 'header', 'aside', 'form', 'iframe', 'noscript']
            })
          });
        } else if (state.mode === 'map') {
          data = await api('/v1/map', {
            method: 'POST',
            body: JSON.stringify({ url, limit: 100, include_subdomains: false })
          });
        } else { // crawl
          data = await api('/v1/crawl', {
            method: 'POST',
            body: JSON.stringify({
              url,
              limit: 5,
              scrape_options: {
                url,
                formats: state.formats,
                user_question: state.question || null,
                use_js_fallback: true,
                only_main_content: true
              }
            })
          });
        }
        state.result = data;
        if (data.tokens_remaining !== undefined) state.tokenBalance = data.tokens_remaining;
        await loadAccount(); // refresh balance
        notify('Complete', `${data.tokens_deducted || 1} token(s) used.`);
      } catch (e) {
        state.result = { error: e.message };
        notify('Request failed', e.message);
      } finally {
        state.loading = false;
        render();
      }
    }

    // --- Render functions ---
    function render() {
      const app = $('#app');
      if (!app) return;

      if (state.screen === 'landing') {
        app.innerHTML = renderLanding();
        attachLandingEvents();
        return;
      }

      // App view
      app.innerHTML = `
        <div class="app">
          ${renderTopbar()}
          <div class="body-wrap">
            ${renderSidebar()}
            <div class="main">
              ${renderPage()}
            </div>
          </div>
        </div>
      `;
      attachAppEvents();
    }

    function renderTopbar() {
      const name = state.user?.name || state.user?.email || 'User';
      return `
        <div class="topbar">
          <div class="brand">
            ${logoImg('')}
            <span>ReClaire</span>
          </div>
          <div class="spacer"></div>
          <div class="top-right">
            <span class="muted" style="font-size:12px;">${state.tokenBalance} tokens</span>
            <div class="account-badge">
              <div class="account-avatar">${initials(name)}</div>
              <span class="account-name">${esc(name)}</span>
              <button class="icon-btn" style="width:28px;height:28px;border-radius:50%;background:transparent;border:0;" onclick="window.__logout()">✕</button>
            </div>
            <button class="icon-btn" onclick="window.__toggleTheme()">${state.theme === 'dark' ? '☀️' : '🌙'}</button>
          </div>
        </div>
      `;
    }

    function renderSidebar() {
      const items = [
        { id: 'playground', label: 'Scrape', icon: '🔍' },
        { id: 'batch', label: 'Batch', icon: '📦' },
        { id: 'usage', label: 'Usage', icon: '📊' },
        { id: 'settings', label: 'Settings', icon: '⚙️' },
      ];
      return `
        <div class="sidebar">
          ${items.map(it => `
            <div class="nav-item ${state.page === it.id ? 'active' : ''}" data-page="${it.id}">
              <span class="icon">${it.icon}</span> ${it.label}
            </div>
          `).join('')}
          <div class="bottom">
            <div class="nav-item" onclick="window.__logout()">
              <span class="icon">🚪</span> Logout
            </div>
          </div>
        </div>
      `;
    }

    function renderPage() {
      switch (state.page) {
        case 'playground': return renderPlayground();
        case 'batch': return renderBatch();
        case 'usage': return renderUsage();
        case 'settings': return renderSettings();
        default: return '<p>Page not found.</p>';
      }
    }

    function renderPlayground() {
      const modes = ['scrape', 'map', 'crawl'];
      const formatOptions = ['markdown', 'html', 'raw_html', 'summary', 'questions', 'json'];
      const isQuestions = state.formats.includes('questions');

      return `
        <div class="page">
          <div class="page-header">
            <h2>Web Intelligence</h2>
          </div>
          <div class="mode-tabs">
            ${modes.map(m => `<button class="mode-tab ${state.mode === m ? 'active' : ''}" data-mode="${m}">${m.charAt(0).toUpperCase()+m.slice(1)}</button>`).join('')}
          </div>
          <div class="url-row">
            <input class="input url-input" id="urlInput" placeholder="Enter URL (e.g. https://example.com)" value="${esc(state.url)}">
          </div>
          <div class="format-row">
            ${formatOptions.map(f => `
              <span class="format-tag ${state.formats.includes(f) ? 'selected' : ''}" data-format="${f}">${f.replace('_',' ').toUpperCase()}</span>
            `).join('')}
          </div>
          ${isQuestions ? `
            <div class="question-row">
              <input class="input question-input" id="questionInput" placeholder="Your question about the page" value="${esc(state.question)}">
            </div>
          ` : ''}
          <div class="execute-row">
            <div class="execute">
              <button class="btn primary" id="executeBtn" ${state.loading ? 'disabled' : ''}>
                ${state.loading ? '<span class="spinner"></span>' : 'Execute'}
              </button>
            </div>
            <span class="muted" style="font-size:12px;">Cost: ~${state.mode === 'scrape' ? (state.formats.includes('summary')?4:1) : state.mode === 'map' ? 1 : 5} tokens</span>
          </div>

          ${state.result ? `
            <div class="result-area">
              <div class="result-header">
                <span>Result</span>
                <span class="muted">${state.result.tokens_deducted ? state.result.tokens_deducted + ' tokens' : ''}</span>
              </div>
              <div class="result-body">
                ${state.result.error ? `<div class="error">❌ ${esc(state.result.error)}</div>` :
                  state.mode === 'map' ? 
                    `<div>Found ${state.result.links_count || 0} links:</div><ul>${(state.result.links || []).map(l => `<li>${esc(l)}</li>`).join('')}</ul>` :
                    state.result.markdown ? 
                      `<div style="white-space:pre-wrap;">${esc(state.result.markdown)}</div>` :
                      state.result.data ? 
                        `<div>${state.result.data.map(d => `<div><strong>${esc(d.url)}</strong> ${d.status}</div>`).join('')}</div>` :
                        `<pre>${esc(JSON.stringify(state.result, null, 2))}</pre>`
                }
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderBatch() {
      return `
        <div class="page">
          <h2>Batch Scrape</h2>
          <div class="batch-input">
            <textarea class="textarea" id="batchUrls" placeholder="Enter URLs, one per line" rows="5">${state.batchUrls.join('\n')}</textarea>
            <div class="flex mt-8">
              <button class="btn primary" id="batchStartBtn" ${state.batchRunning ? 'disabled' : ''}>
                ${state.batchRunning ? 'Running...' : 'Start Batch'}
              </button>
              ${state.batchId ? `<a class="btn" href="${API_BASE}/v1/batch-scrape/${state.batchId}/download" target="_blank">Download ZIP</a>` : ''}
            </div>
          </div>
          ${state.batchResult ? `
            <div class="result-area mt-8">
              <div class="result-header">Batch Results</div>
              <div class="result-body">
                ${state.batchResult.rows.map(r => `<div>${r.index+1}. ${esc(r.url)} — ${r.status} ${r.error ? '❌ '+esc(r.error) : '✅'}</div>`).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderUsage() {
      return `
        <div class="page">
          <h2>Usage Logs</h2>
          <p class="muted">Last 100 entries</p>
          <div style="border:1px solid var(--border);border-radius:var(--radius);overflow:auto;max-height:400px;">
            <table style="width:100%;border-collapse:collapse;font-size:13px;">
              <thead><tr style="border-bottom:1px solid var(--border);"><th style="padding:8px 12px;text-align:left;">Endpoint</th><th style="padding:8px 12px;text-align:right;">Tokens</th><th style="padding:8px 12px;text-align:right;">Time</th></tr></thead>
              <tbody>
                ${(state.usageLogs || []).map(log => `
                  <tr style="border-bottom:1px solid var(--border2);">
                    <td style="padding:8px 12px;">${esc(log.endpoint)}</td>
                    <td style="padding:8px 12px;text-align:right;">${log.tokens_deducted}</td>
                    <td style="padding:8px 12px;text-align:right;font-size:11px;color:var(--muted);">${new Date(log.created_at).toLocaleString()}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderSettings() {
      return `
        <div class="page">
          <h2>Settings</h2>
          <div class="flex gap-sm">
            <label>API Base URL:</label>
            <input class="input" id="apiBaseInput" value="${esc(API_BASE)}" style="max-width:300px;">
            <button class="btn" onclick="window.__saveApiBase()">Save</button>
          </div>
          <div class="mt-8">
            <button class="btn ghost" onclick="window.__logout()">Logout</button>
            <button class="btn ghost" style="color:var(--danger);" onclick="window.__deleteAccount()">Delete Account</button>
          </div>
        </div>
      `;
    }

    // --- Landing & Auth Modal ---
    function renderLanding() {
      return `
        <div class="public-shell">
          <nav class="public-nav">
            <div class="brand-word">${logoImg('brand-logo')} ReClaire</div>
            <div>
              <button class="btn ghost" onclick="window.__showAuth('login')">Sign in</button>
              <button class="btn primary" onclick="window.__showAuth('register')">Get started</button>
            </div>
          </nav>
          <div class="landing">
            <div class="hero">
              ${logoImg('hero-logo')}
              <h1>Web Intelligence</h1>
              <p>Scrape, map, and crawl websites with LLM-powered extraction. Clean Markdown, Q&A, structured JSON — all via one API.</p>
              <div class="hero-actions">
                <button class="btn primary" onclick="window.__showAuth('register')">Start free →</button>
                <button class="btn ghost" onclick="window.__showAuth('login')">Sign in</button>
              </div>
            </div>
            <div class="section">
              <div class="section-head"><h2>Features</h2></div>
              <div class="feature-grid">
                <div class="feature"><div class="feature-icon">📄</div><h3>Markdown & HTML</h3><p>Clean, readable content with optional raw HTML.</p></div>
                <div class="feature"><div class="feature-icon">🧠</div><h3>LLM Summaries</h3><p>Auto-generated summaries and Q&A with your context.</p></div>
                <div class="feature"><div class="feature-icon">🗺️</div><h3>Site Mapping</h3><p>Discover all pages on a domain with one request.</p></div>
                <div class="feature"><div class="feature-icon">📦</div><h3>Batch Scraping</h3><p>Scrape up to 10 URLs in a single job, download ZIP.</p></div>
                <div class="feature"><div class="feature-icon">🔐</div><h3>Token Economy</h3><p>Pay only for what you use. Grant tokens for testing.</p></div>
                <div class="feature"><div class="feature-icon">⚡</div><h3>JS Rendering</h3><p>Playwright fallback for dynamic content.</p></div>
              </div>
            </div>
          </div>
          <div class="public-footer">
            <span>© 2026 ReClaire</span>
            <span>Built with ❤️</span>
          </div>
        </div>
        ${state.authMode ? renderAuthModal() : ''}
      `;
    }

    function renderAuthModal() {
      const isLogin = state.authMode === 'login';
      return `
        <div class="auth-overlay" id="authOverlay">
          <div class="auth-card">
            <h2>${isLogin ? 'Sign in' : 'Create account'}</h2>
            <input class="input" id="authEmail" type="email" placeholder="Email">
            <input class="input" id="authPassword" type="password" placeholder="Password" minlength="8">
            ${!isLogin ? `<input class="input" id="authUsername" placeholder="Username (optional)">` : ''}
            <button class="btn primary" id="authSubmit">${isLogin ? 'Sign in' : 'Register'}</button>
            <div class="toggle-link">
              ${isLogin ? "Don't have an account? " : "Already have an account? "}
              <a onclick="window.__toggleAuthMode()">${isLogin ? 'Register' : 'Sign in'}</a>
            </div>
            <button class="btn ghost" style="margin-top:8px;" onclick="window.__closeAuth()">Close</button>
          </div>
        </div>
      `;
    }

    // --- Event attachment ---
    function attachLandingEvents() {
      // Auth modal events are inline, but we need to handle overlay click
      const overlay = $('#authOverlay');
      if (overlay) {
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) {
            state.authMode = null;
            render();
          }
        });
      }
      // Auth submit
      const submitBtn = $('#authSubmit');
      if (submitBtn) submitBtn.addEventListener('click', handleAuth);
      // Enter key on password field
      const pwd = $('#authPassword');
      if (pwd) pwd.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleAuth(); });
    }

    function attachAppEvents() {
      // Sidebar navigation
      $$('.sidebar .nav-item[data-page]').forEach(el => {
        el.addEventListener('click', () => {
          const page = el.dataset.page;
          state.page = page;
          if (page === 'usage') fetchUsage();
          render();
        });
      });

      // Mode tabs
      $$('.mode-tab').forEach(el => {
        el.addEventListener('click', () => {
          state.mode = el.dataset.mode;
          render();
        });
      });

      // Format tags
      $$('.format-tag').forEach(el => {
        el.addEventListener('click', () => {
          const fmt = el.dataset.format;
          if (state.formats.includes(fmt)) {
            state.formats = state.formats.filter(f => f !== fmt);
          } else {
            state.formats.push(fmt);
          }
          render();
        });
      });

      // URL input
      const urlInput = $('#urlInput');
      if (urlInput) {
        urlInput.addEventListener('input', (e) => { state.url = e.target.value; });
        urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') execute(); });
      }

      // Question input
      const qInput = $('#questionInput');
      if (qInput) {
        qInput.addEventListener('input', (e) => { state.question = e.target.value; });
        qInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') execute(); });
      }

      // Execute button
      const execBtn = $('#executeBtn');
      if (execBtn) execBtn.addEventListener('click', execute);

      // Batch start
      const batchStart = $('#batchStartBtn');
      if (batchStart) {
        batchStart.addEventListener('click', async () => {
          const ta = $('#batchUrls');
          if (!ta) return;
          const urls = ta.value.split('\n').map(s => s.trim()).filter(Boolean);
          if (urls.length === 0) { notify('No URLs', 'Enter at least one URL.'); return; }
          state.batchRunning = true;
          render();
          try {
            const data = await api('/v1/batch-scrape', {
              method: 'POST',
              body: JSON.stringify({
                urls,
                formats: state.formats,
                use_js_fallback: true,
                only_main_content: true
              })
            });
            state.batchId = data.batch_id;
            state.batchResult = data;
            notify('Batch started', `${data.total} URLs submitted.`);
          } catch (e) {
            notify('Batch failed', e.message);
          } finally {
            state.batchRunning = false;
            render();
          }
        });
      }
    }

    // --- Expose global functions for inline onclick ---
    window.__toggleTheme = () => {
      setTheme(state.theme === 'dark' ? 'light' : 'dark');
      render();
    };

    window.__logout = logout;

    window.__showAuth = (mode) => {
      state.authMode = mode;
      render();
    };

    window.__closeAuth = () => {
      state.authMode = null;
      render();
    };

    window.__toggleAuthMode = () => {
      state.authMode = state.authMode === 'login' ? 'register' : 'login';
      render();
    };

    window.__saveApiBase = () => {
      const input = $('#apiBaseInput');
      if (input) {
        localStorage.setItem('reclaire_api_base', input.value);
        API_BASE = input.value;
        notify('Saved', 'API base updated.');
      }
    };

    window.__deleteAccount = async () => {
      if (!confirm('Are you sure you want to delete your account? This is irreversible.')) return;
      try {
        await api('/auth/me', { method: 'DELETE' });
        notify('Account deleted', 'Your account has been removed.');
        logout();
      } catch (e) {
        notify('Deletion failed', e.message);
      }
    };

    // --- Fetch usage ---
    async function fetchUsage() {
      try {
        const data = await api('/v1/usage');
        state.usageLogs = data.logs || [];
        render();
      } catch {}
    }

    // --- Supabase auth listener (keeps your existing one) ---
    if (supabaseClient) {
      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session && session.user) {
          state.user = {
            name: session.user.user_metadata.full_name || session.user.email,
            email: session.user.email,
            avatar: session.user.user_metadata.avatar_url
          };
          state.screen = 'app';
          state.page = 'playground';
          if (window.location.hash.includes('access_token')) {
            window.history.replaceState(null, '', window.location.pathname);
          }
          // also load account for token balance
          loadAccount().then(() => render());
        }
      });
    }

    // --- Bootstrap ---
    (async () => {
      setTheme(state.theme);
      if (state.apiKey) {
        const ok = await loadAccount();
        if (ok) {
          state.screen = 'app';
          // if we have a valid key, attempt to get user info from /auth/me (already done)
          // also fetch usage if page is usage (but we'll do that on navigation)
        } else {
          localStorage.removeItem('reclaire_api_key');
          state.apiKey = '';
        }
      }
      render();
    })();

  })();
</script>
