const modes=[{id:'scrape',label:'Scrape',icon:icons.scrape},{id:'crawl',label:'Crawl',icon:icons.crawl},{id:'map',label:'Map',icon:icons.map}];
const formats=[{id:'markdown',label:'Markdown',desc:'Clean readable page content'},{id:'html',label:'HTML',desc:'Clean extracted HTML'},{id:'raw_html',label:'Raw HTML',desc:'Original fetched document'},{id:'summary',label:'Summary',desc:'Concise AI overview'},{id:'questions',label:'Q&A',desc:'Answer a question from the page'},{id:'json',label:'Structured JSON',desc:'Schema-driven AI extraction'}];
const urlHints=['developer.mozilla.org/en-US/docs/Web/JavaScript','fastapi.tiangolo.com','supabase.com/docs','www.python.org/about/gettingstarted/'];
const questionHints=['What is this page about?','What are the key points on this page?','Who is this page intended for?','What are the main facts I should know?'];
function logoImg(cls=''){return `<img class="${cls}" src="reclaire-logo.svg" alt="ReClaire logo" onerror="this.style.visibility='hidden'">`}
function initials(n){return(n||'User').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function safeUrl(u){try{const n=(u||'').trim().replace(/^https?:\/\//i,'');return n?new URL('https://'+n).toString():null}catch{return null}}
function renderMd(src=''){let s=esc(src);s=s.replace(/^###\s+(.+)$/gm,'<h3>$1</h3>').replace(/^##\s+(.+)$/gm,'<h2>$1</h2>').replace(/^#\s+(.+)$/gm,'<h2>$1</h2>');s=s.replace(/^\s*[-*]\s+(.+)$/gm,'<li>$1</li>');s=s.replace(/(<li>[\s\S]*?<\/li>)(?!<li>)/g,'$1');s=s.replace(/(<li>.*?<\/li>)/gs,'<ul>$1</ul>');s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');s=s.replace(/`([^`]+)`/g,'<code>$1</code>');s=s.split(/\n{2,}/).map(x=>x.match(/^<h[23]>/)?x:`<p>${x.replace(/\n/g,'<br>')}</p>`).join('');return s}
function notify(t,x){const st=$('#toastStack'),e=document.createElement('div');e.className='toast';e.innerHTML=`<strong>${esc(t)}</strong><span>${esc(x)}</span>`;st.appendChild(e);setTimeout(()=>e.remove(),4300)}
function setTheme(t){state.theme=t;document.body.dataset.theme=t;localStorage.setItem('reclaire_theme',t);$('meta[name=theme-color]').setAttribute('content',t==='dark'?'#0b0b0b':'#f7f7f5')}
function headers(){const tok=localStorage.getItem('reclaire_token');return tok?{Authorization:`Bearer ${tok}`,'Content-Type':'application/json'}:{'Content-Type':'application/json'}}
async function api(path,opt={}){const res=await fetch(API_BASE+path,{...opt,headers:{...headers(),...(opt.headers||{})}});let d={};try{d=await res.json()}catch{}if(!res.ok)throw new Error(d.detail||d.message||`Request failed (${res.status})`);return d}
async function loadMe(){try{const d=await api('/auth/me');state.user=d.user;state.recentTransactions=d.recent_transactions||[];return true}catch{state.user=null;return false}}
async function login(identifier,password){const d=await api('/auth/login',{method:'POST',body:JSON.stringify({username_or_email:identifier,password})});localStorage.setItem('reclaire_token',d.access_token);state.user=d.user;state.screen='app';state.page='playground';render();await loadMe();notify('Welcome back',`Signed in as ${state.user?.username||'user'}.`)}
async function register(username,email,password){const d=await api('/auth/register',{method:'POST',body:JSON.stringify({username,email,password})});localStorage.setItem('reclaire_token',d.access_token);state.user=d.user;state.screen='app';state.page='playground';render();await loadMe();notify('Account created','Your account is ready.')}
function logout(){localStorage.removeItem('reclaire_token');state.user=null;state.recentTransactions=[];state.screen='landing';state.sidebarOpen=false;render()}
function openPage(p){state.page=p;state.sidebarOpen=false;state.notificationsOpen=false;state.dropdown=null;state.formatDrawer=false;state.batchOpen=false;if(p!=='playground')state.result=null;render()}
function toggleSidebar(){state.sidebarOpen=!state.sidebarOpen;state.notificationsOpen=false;render()}
function selectedLabel(){return state.formats.length===1?(formats.find(x=>x.id===state.formats[0])?.label||state.formats[0]):`${state.formats.length} formats selected`}
function actionLabel(){if(state.mode==='map')return'Map site';if(state.mode==='crawl')return'Start crawl';if(state.formats.includes('questions'))return'Answer question';if(state.formats.includes('summary'))return'Generate summary';return'Scrape page'}
function renderTopbar(){const u=state.user||{username:'Guest',tokens:0};const sideRight=state.sidebarSide==='right';return `<header class="topbar"><div class="top-left">${!sideRight?`<button class="icon-btn" id="sidebarBtn" title="Open navigation">${icons.menu}</button>`:''}${logoImg('top-logo')}<div class="account-chip"><div class="avatar">${esc(initials(u.username))}</div><span class="account-name">${esc(u.username||'Guest')}</span></div></div><div class="top-center">${logoImg('top-logo')}</div><div class="top-right"><span class="token-mini">${Number(u.tokens??0)} tokens</span><button class="icon-btn" id="notificationBtn" title="Notifications">${icons.bell}</button>${sideRight?`<button class="icon-btn" id="sidebarBtn" title="Open navigation">${icons.menu}</button>`:''}</div></header>`}
function navItem(page,label,icon,active){return `<button class="nav-item ${active?'active':''}" data-page="${page}">${icon}<span>${label}</span></button>`}
function renderSidebar(){const a=state.page;return `<aside class="sidebar ${state.sidebarSide==='right'?'right':''} ${state.sidebarOpen?'open':''}" id="sidebar"><div class="sidebar-top"><button class="upgrade" data-action="upgrade">Upgrade plan</button><button class="support-btn" data-action="support">Support</button></div><div class="profile-box"><div class="avatar">${esc(initials(state.user?.username))}</div><div class="profile-meta"><strong>${esc(state.user?.username||'User')}</strong><span>${esc(state.user?.email||'Account')}</span></div></div><nav><div class="nav-group"><div class="nav-title">Workspace</div>${navItem('playground','Scrape',icons.scrape,a==='playground')}${navItem('map','Map',icons.map,a==='map')}${navItem('crawl','Crawl',icons.crawl,a==='crawl')}</div><div class="nav-group"><div class="nav-title">Account</div>${navItem('activity','Activity logs',icons.activity,a==='activity')}${navItem('usage','Usage',icons.usage,a==='usage')}${navItem('api','API keys',icons.key,a==='api')}${navItem('settings','Settings',icons.settings,a==='settings')}</div><button class="nav-item logout" data-action="logout">${icons.logout}<span>Log out</span></button></nav></aside><div class="sidebar-overlay ${state.sidebarOpen?'show':''}" id="sidebarOverlay"></div>`}
function renderNotifications(){if(!state.notificationsOpen)return'';const tx=state.recentTransactions||[];return `<div class="floating-panel"><div class="floating-head"><strong>Notifications</strong><button class="icon-btn" style="width:30px;height:30px" data-action="close-overlays">×</button></div><div class="notification-list">${tx.length?tx.slice(0,5).map(x=>`<div class="notification"><i class="notification-dot"></i><div><strong>${esc(x.action||'Token activity')}</strong><span>${x.amount>0?'+':''}${esc(x.amount)} tokens</span></div></div>`).join(''):`<div class="notification"><i class="notification-dot" style="opacity:.25"></i><div><strong>No recent activity</strong><span>Your notifications will appear here.</span></div></div>`}</div></div>`}
function renderLanding(){return `<div class="public-shell"><nav class="public-nav"><div class="brand-word">${logoImg('brand-logo')}<span>ReClaire</span></div><div style="display:flex;gap:8px"><button class="btn ghost" data-screen="auth" data-auth-mode="login">Sign in</button><button class="btn primary" data-screen="auth" data-auth-mode="register">Get started</button></div></nav><main class="landing"><section class="hero">${logoImg('hero-logo')}<div class="eyebrow">Web intelligence engine</div><h1>Understand the web, faster.</h1><p>ReClaire turns public web pages into clean Markdown, extracted HTML, site maps, crawled content and AI-powered answers — through one focused workflow.</p><div class="hero-actions"><button class="btn primary" data-screen="auth" data-auth-mode="register">Start building</button><button class="btn" data-screen="auth" data-auth-mode="login">Sign in</button></div></section><section class="section"><div class="section-head"><h2>One engine. Three core operations.</h2><span class="muted">Built around URL → process → useful output.</span></div><div class="feature-grid">${feature('Scrape','Fetch a page, remove unwanted elements and convert its main content into clean Markdown.',icons.scrape)}${feature('Crawl','Discover same-domain links and process several pages concurrently with controlled limits.',icons.crawl)}${feature('Map','Discover reachable links on a target domain without manually navigating the site.',icons.map)}${feature('Dynamic pages','Use Playwright as a JavaScript fallback when standard HTTP fetching is not enough.',icons.scrape)}${feature('AI transformations','Generate concise summaries, answer questions from page content, or extract schema-driven JSON with Gemini.',icons.file)}${feature('Token ledger','Every protected operation is authenticated and metered against the user token balance.',icons.usage)}</div></section><section class="section"><div class="section-head"><h2>Designed for useful output.</h2><span class="muted">Clean results instead of noisy browser chrome.</span></div><div class="examples">${example('Markdown','# Page title\n\n## Main content\nClean, readable page content ready for downstream use.')}${example('Structured JSON','{\n  "summary": "…",\n  "key_facts": ["…"]\n}')}${example('Site map','https://example.com/\nhttps://example.com/docs\nhttps://example.com/about')}${example('AI answer','Question\nWhat is this page about?\n\nAnswer\nA focused answer grounded in the extracted page content.')}</div></section></main><footer class="public-footer"><span>ReClaire · Web intelligence engine</span><span>FastAPI · Playwright · Gemini · Supabase</span></footer></div>`}
function feature(t,d,i){return `<article class="feature"><div class="feature-icon">${i}</div><h3>${t}</h3><p>${d}</p></article>`}function example(t,c){return `<article class="example"><div class="example-head">${esc(t)}</div><div class="example-code">${esc(c)}</div></article>`}
function renderAuth(mode='login'){const reg=mode==='register';return `<div class="auth-screen"><section class="auth-card">${logoImg('auth-logo')}<h1>${reg?'Create your account':'Sign in'}</h1><p class="sub">${reg?'Start with your ReClaire workspace.':'Welcome back to ReClaire.'}</p><form id="authForm">${reg?`<div class="auth-field"><label>Username</label><input class="input" name="username" autocomplete="username" required placeholder="your name"></div><div class="auth-field"><label>Email address</label><input class="input" name="email" type="email" autocomplete="email" required placeholder="you@example.com"></div>`:`<div class="auth-field"><label>Username or email</label><input class="input" name="identifier" autocomplete="username" required placeholder="username or email"></div>`}<div class="auth-field"><label>Password</label><input class="input" name="password" type="password" autocomplete="${reg?'new-password':'current-password'}" required placeholder="Enter your password"></div>${!reg?`<div class="auth-links"><span></span><a href="#" data-action="forgot">Forgot password?</a></div>`:''}<button class="btn primary" type="submit" style="width:100%">${reg?'Create account':'Login'}</button></form><div class="auth-divider">or</div><div class="social-grid"><button class="social-btn" data-action="oauth" data-provider="google"><svg class="oauth-logo" viewBox="0 0 24 24" aria-label="Google"><path fill="#4285F4" d="M21.35 12.27c0-.72-.06-1.42-.18-2.09H12v3.96h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.26Z"/><path fill="#34A853" d="M12 21.5c2.64 0 4.86-.87 6.48-2.36l-3.14-2.45c-.87.58-1.98.92-3.34.92-2.56 0-4.73-1.73-5.51-4.06H3.25V16.1A9.78 9.78 0 0 0 12 21.5Z"/><path fill="#FBBC05" d="M6.49 13.55A5.87 5.87 0 0 1 6.18 12c0-.54.11-1.06.31-1.55V8H3.25A9.76 9.76 0 0 0 2.2 12c0 1.57.38 3.06 1.05 4.37l3.24-2.82Z"/><path fill="#EA4335" d="M12 6.39c1.44 0 2.73.5 3.75 1.48l2.81-2.81C16.85 3.42 14.64 2.5 12 2.5a9.78 9.78 0 0 0-8.75 5.5l3.24 2.95C7.27 8.12 9.44 6.39 12 6.39Z"/></svg>Google</button><button class="social-btn" data-action="oauth" data-provider="github"><svg class="oauth-logo" viewBox="0 0 24 24" aria-label="GitHub"><path fill="currentColor" d="M12 .5A11.5 11.5 0 0 0 8.36 22.4c.58.1.79-.25.79-.56v-2.18c-3.23.7-3.91-1.56-3.91-1.56-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.58-.29-5.29-1.29-5.29-5.74 0-1.27.45-2.31 1.19-3.12-.12-.29-.52-1.48.11-3.08 0 0 .97-.31 3.18 1.19a11.06 11.06 0 0 1 5.79 0c2.21-1.5 3.18-1.19 3.18-1.19.63 1.6.23 2.79.11 3.08.74.81 1.19 1.85 1.19 3.12 0 4.46-2.71 5.45-5.3 5.74.42.36.78 1.07.78 2.16v3.2c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg>GitHub</button></div><div class="auth-switch">${reg?`Already have an account? <button data-auth-mode="login">Sign in</button>`:`New user? <button data-auth-mode="register">Create an account</button>`}</div><div class="legal">By continuing, you agree to ReClaire's Terms of Service and Privacy Policy.</div></section></div>`}
function renderPlayground(){const q=state.formats.includes('questions');return `<div class="playground"><div class="playground-inner"><section class="main-brand">${logoImg('')}<h1>Turn URLs into useful data.</h1><p>Choose an operation, enter a URL, select the output you need, then execute. The question field appears whenever Q&A is selected.</p></section><section class="input-panel"><div class="input-label">Input</div><div class="input-row"><button class="custom-select" data-dropdown="mode"><span style="display:flex;align-items:center;gap:8px">${modes.find(m=>m.id===state.mode).icon}${modes.find(m=>m.id===state.mode).label}</span>${icons.chevron}</button><div class="url-shell"><span class="url-prefix">https://</span><input id="urlInput" class="url-input" value="${esc(state.url.replace(/^https?:\/\//i,''))}" placeholder="Enter a website URL"></div>${state.mode==='map'?`<button class="execute" data-action="execute">Map site</button>`:`<button class="format-trigger" data-action="open-format">${icons.file}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(selectedLabel())}</span>${icons.chevron}</button>`}</div>${q?`<div class="question-wrap"><input id="questionInput" class="question-input" value="${esc(state.question)}" placeholder="Ask a question about this page"></div>`:''}<div class="panel-foot"><span>${state.mode==='map'?'Discover links on the target domain.':state.mode==='crawl'?'Crawl same-domain pages.':'Select one or more supported output formats.'}</span><span class="multi-count">${state.mode!=='map'&&state.formats.length>1?`${state.formats.length} selected`:''}</span></div>${state.mode!=='map'?`<button class="execute" style="margin-top:8px" data-action="execute">${actionLabel()}</button>`:''}<button class="batch-trigger" data-action="toggle-batch">${state.batchOpen?'Close batch scrape':'Batch scrape'}</button>${state.batchOpen?renderBatch():''}</section><div class="output-area">${renderResult()}</div>${renderRecent()}</div></div>${state.formatDrawer?renderFormatDrawer():''}${state.dropdown==='mode'?renderModeDropdown():''}`}
function renderModeDropdown(){return `<div class="dropdown-menu" id="modeDropdown">${modes.map(m=>`<button class="dropdown-option ${state.mode===m.id?'active':''}" data-mode="${m.id}"><span style="display:flex;align-items:center;gap:8px">${m.icon}${m.label}</span>${state.mode===m.id?icons.check:''}</button>`).join('')}</div>`}
function renderFormatDrawer(){return `<div class="format-drawer"><div class="format-head"><div><strong>Choose output format</strong><div class="muted" style="font-size:10px">Only formats implemented by the supplied backend are shown.</div></div><button class="icon-btn" style="width:34px;height:34px" data-action="close-format">×</button></div><div class="format-grid">${formats.map(f=>`<button class="format-card ${state.formats.includes(f.id)?'selected':''}" data-format="${f.id}"><strong>${esc(f.label)}</strong><small>${esc(f.desc)}</small><div class="wire"><i></i><i></i><i></i></div>${state.formats.includes(f.id)?`<span style="position:absolute;right:9px;top:9px;color:var(--accent)">${icons.check}</span>`:''}</button>`).join('')}</div></div>`}
function renderResult(){if(state.loading)return`<div class="output-empty"><div><div style="font-weight:750;color:var(--text)">Processing request</div><div style="margin-top:5px">ReClaire is fetching and transforming the page.</div></div></div>`;if(!state.result)return`<div class="output-empty"><div><strong style="display:block;color:var(--text);margin-bottom:5px">Your output will appear here.</strong><span>Run a scrape, crawl or map operation to see the result.</span></div></div>`;if(state.result.error)return`<div class="result-card"><div class="result-head"><strong>Request error</strong></div><div class="result-body">${esc(state.result.error)}</div></div>`;return state.mode==='map'?renderMapResult(state.result):state.mode==='crawl'?renderCrawlResult(state.result):renderScrapeResult(state.result)}
function outputActions(md){if(!md)return'';return `<div class="result-actions"><button class="btn" data-action="download-md">${icons.download} Download .md file</button><button class="btn" data-action="copy-md">${icons.copy} Copy Markdown</button><button class="btn" data-action="copy-output">${icons.copy} Copy output</button></div>`}
function renderScrapeResult(r){const blocks=[];if(r.summary)blocks.push(`<div class="result-card"><div class="result-head"><strong>AI summary</strong><span class="muted">${esc(r.url||'')}</span></div><div class="result-body ai-output">${renderMd(r.summary)}</div>${outputActions(r.summary)}</div>`);if(r.answer)blocks.push(`<div class="result-card"><div class="result-head"><strong>AI answer</strong><span class="muted">Q&A</span></div><div class="result-body ai-output">${renderMd(r.answer)}</div>${outputActions(r.answer)}</div>`);if(r.markdown)blocks.push(`<div class="result-card"><div class="result-head"><strong>Markdown</strong><span class="muted">${esc(r.url||'')}</span></div><div class="result-body"><pre class="code-box">${esc(r.markdown)}</pre>${outputActions(r.markdown)}</div></div>`);if(r.html)blocks.push(`<div class="result-card"><div class="result-head"><strong>HTML</strong></div><div class="result-body"><pre class="code-box">${esc(r.html)}</pre>${outputActions(r.html)}</div></div>`);if(r.raw_html)blocks.push(`<div class="result-card"><div class="result-head"><strong>Raw HTML</strong></div><div class="result-body"><pre class="code-box">${esc(r.raw_html)}</pre>${outputActions(r.raw_html)}</div></div>`);if(r.json)blocks.push(`<div class="result-card"><div class="result-head"><strong>Structured JSON</strong></div><div class="result-body"><pre class="code-box">${esc(JSON.stringify(r.json,null,2))}</pre>${outputActions(JSON.stringify(r.json,null,2))}</div></div>`);if(!blocks.length)blocks.push(`<div class="result-card"><div class="result-head"><strong>Result</strong></div><div class="result-body"><pre class="code-box">${esc(JSON.stringify(r,null,2))}</pre>${outputActions(JSON.stringify(r,null,2))}</div></div>`);return `<div style="display:grid;gap:12px">${blocks.join('')}</div>`}
function renderMapResult(r){const text=(r.links||[]).join('\n');return `<div class="result-card"><div class="result-head"><strong>Site map</strong><span class="muted">${(r.links||[]).length} links</span></div><div class="result-body"><pre class="code-box">${esc(text||'No links found.')}</pre>${outputActions(text)}</div></div>`}
function renderCrawlResult(r){const rows=(r.data||[]).map(x=>`<div class="recent-item"><div class="task"><strong>${esc(x.url||'Page')}</strong><span>${esc(x.status||'')}</span></div><span class="pill">${esc(x.status||'')}</span></div>`).join('');const md=(r.data||[]).filter(x=>x.status==='success').map(x=>`# ${x.url}\n\n${x.markdown||''}`).join('\n\n');return `<div class="result-card"><div class="result-head"><strong>Crawl complete</strong><span class="muted">${(r.data||[]).length} pages</span></div><div class="result-body"><div style="display:grid;gap:7px">${rows||'No pages returned.'}</div>${outputActions(md)}</div></div>`}
function renderRecent(){const tx=state.recentTransactions||[];if(!tx.length)return'';return `<section class="recent"><h3>Recent activity</h3><div class="recent-list">${tx.slice(0,5).map(x=>`<div class="recent-item"><div class="task"><strong>${esc(x.action||'Activity')}</strong><span>${esc(new Date(x.timestamp).toLocaleString())}</span></div><span class="cost">${x.amount>0?'+':''}${esc(x.amount)} tokens</span></div>`).join('')}</div></section>`}
function renderBatch(){if(!state.batchRows.length)state.batchRows=Array.from({length:3},()=>({url:'',status:'idle',markdown:''}));return `<div class="batch-panel"><div class="batch-head"><div><h3>Batch scrape</h3><div class="batch-meta">Up to 10 URLs · Markdown only · output is hidden after completion</div></div><button class="btn primary" data-action="start-batch" ${state.batchRunning?'disabled':''}>${state.batchRunning?'Scraping…':'Start scrape'}</button></div><div class="batch-rows">${state.batchRows.map((r,i)=>`<div class="batch-row"><span class="batch-num">${String(i+1).padStart(2,'0')}</span><input class="input batch-url" data-batch-index="${i}" value="${esc(r.url)}" placeholder="https://example.com/page"><span class="batch-status" title="${r.status==='done'?'Complete':r.status==='error'?'Failed':'Waiting'}">${r.status==='done'?icons.check:r.status==='error'?'×':''}</span></div>`).join('')}</div><div class="batch-actions"><span class="batch-note">${state.batchRunning?`${state.batchDone}/${state.batchRows.filter(x=>x.url.trim()).length} complete`:'Enter only the rows you need.'}</span><button class="btn batch-download" data-action="download-batch" ${state.batchRows.some(x=>x.status==='done')?'':'disabled'}>${icons.download} Download batch Markdown</button></div></div>`}
async function execute(){if(state.loading)return;const valid=safeUrl(state.url);if(!valid){notify('URL required','Enter a valid website URL.');return}if(state.formats.includes('questions')&&!state.question.trim()){notify('Question required','Enter a question for the Q&A format.');return}state.url=valid;state.loading=true;state.result=null;render();try{let d;if(state.mode==='scrape')d=await api('/v1/scrape',{method:'POST',body:JSON.stringify({url:state.url,formats:state.formats,user_question:state.formats.includes('questions')?state.question:null,use_js_fallback:true,only_main_content:true})});else if(state.mode==='map')d=await api('/v1/map',{method:'POST',body:JSON.stringify({url:state.url,limit:100,include_subdomains:false})});else d=await api('/v1/crawl',{method:'POST',body:JSON.stringify({url:state.url,limit:5,scrape_options:{url:state.url,formats:state.formats,user_question:state.question||null,use_js_fallback:true,only_main_content:true}})});state.result=d;await loadMe();notify('Complete',`${d.tokens_deducted||1} token(s) used.`)}catch(e){state.result={error:e.message};notify('Request failed',e.message)}finally{state.loading=false;render()}}
async function batchScrape(){if(state.batchRunning)return;const rows=state.batchRows.filter(x=>x.url.trim());if(!rows.length){notify('URLs required','Add at least one URL to the batch.');return}state.batchRunning=true;state.batchDone=0;state.batchRows.forEach(x=>x.status=x.url.trim()?'idle':'idle');render();for(const row of state.batchRows){if(!row.url.trim())continue;const valid=safeUrl(row.url);if(!valid){row.status='error';render();continue}try{const d=await api('/v1/scrape',{method:'POST',body:JSON.stringify({url:valid,formats:['markdown'],use_js_fallback:true,only_main_content:true})});row.status='done';row.markdown=d.markdown||'';state.batchDone++;await loadMe()}catch{row.status='error'}render()}state.batchRunning=false;render();notify('Batch complete',`${state.batchDone} page(s) scraped successfully.`)}
function downloadText(name,text,type='text/markdown'){const blob=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function currentOutput(){const r=state.result;if(!r)return'';if(r.markdown)return r.markdown;if(r.summary)return r.summary;if(r.answer)return r.answer;if(r.json)return JSON.stringify(r.json,null,2);if(r.html)return r.html;if(r.raw_html)return r.raw_html;if(r.links)return r.links.join('\n');return JSON.stringify(r,null,2)}
function downloadBatch(){const done=state.batchRows.filter(x=>x.status==='done');if(!done.length)return;/* ZIP is intentionally generated without a third-party library; use the browser CompressionStream when available, otherwise download a single combined Markdown file. */if(!window.CompressionStream){downloadText('reclaire-batch.md',done.map((x,i)=>`# Batch item ${i+1}\n\n${x.url}\n\n${x.markdown}`).join('\n\n---\n\n'));notify('ZIP unavailable','This browser does not expose CompressionStream. A combined Markdown file was downloaded instead.');return}notify('Batch ready','Your browser supports compression, but a ZIP writer is not bundled in this frontend. Use the backend or add a ZIP library for true .zip packaging.')}
function renderActivity(){const tx=state.recentTransactions||[];return `<div class="page"><div class="page-inner"><header class="page-header"><div class="eyebrow">Account</div><h1>Activity logs</h1><p>Recent token ledger activity returned by the authenticated backend session.</p></header><div class="table-wrap"><table><thead><tr><th>Action</th><th>Tokens</th><th>Timestamp</th></tr></thead><tbody>${tx.length?tx.map(x=>`<tr><td>${esc(x.action||'Activity')}</td><td style="font-weight:850;color:${x.amount<0?'var(--gold)':'var(--success)'}">${x.amount>0?'+':''}${esc(x.amount)}</td><td>${esc(new Date(x.timestamp).toLocaleString())}</td></tr>`).join(''):`<tr><td colspan="3" class="muted">No recent transactions returned.</td></tr>`}</tbody></table></div></div></div>`}
function renderUsage(){const t=Number(state.user?.tokens||0);return `<div class="page"><div class="page-inner"><header class="page-header"><div class="eyebrow">Account</div><h1>Usage</h1><p>Your token account and the cost model currently implemented by the supplied backend.</p></header><div class="stats"><div class="stat"><span>Available tokens</span><strong>${t}</strong></div><div class="stat"><span>Account</span><strong style="font-size:20px">${esc(state.user?.username||'—')}</strong></div><div class="stat"><span>Session</span><strong style="font-size:20px">Active</strong></div></div><section class="settings-card"><h3>Token costs</h3><p>The frontend displays these costs as guidance. The server remains the source of truth for deductions.</p><div class="usage-costs"><div class="cost-card"><strong>Map</strong><span>1 token</span></div><div class="cost-card"><strong>Crawl</strong><span>per crawled URL</span></div><div class="cost-card"><strong>Scrape with JS fallback</strong><span>3 base + AI</span></div><div class="cost-card"><strong>Summary / Q&A / JSON</strong><span>+2 each</span></div></div><button class="btn" style="margin-top:12px" data-action="grant-demo">Grant 50 test tokens</button><div class="muted" style="font-size:10px;margin-top:8px">The supplied backend does not currently expose a 50-token grant endpoint, so this button will not pretend to change the server balance.</div></section></div></div>`}
function renderApi(){return `<div class="page"><div class="page-inner"><header class="page-header"><div class="eyebrow">Account</div><h1>API keys</h1><p>Connection settings for the ReClaire API.</p></header><section class="settings-card"><h3>Backend connection</h3><p>Requests from this frontend use the API base below and the authenticated bearer token.</p><div style="display:flex;gap:8px"><input id="apiBaseInput" class="input" value="${esc(API_BASE)}"><button class="btn primary" data-action="save-api-base">Save</button></div><p style="margin-top:12px">The supplied backend does not expose API-key creation, listing or revocation endpoints.</p></section></div></div>`}
function renderSettings(){const dark=state.theme==='dark';return `<div class="page"><div class="page-inner"><header class="page-header"><div class="eyebrow">Account</div><h1>Settings</h1><p>Appearance and navigation preferences are stored locally in this browser.</p></header><div class="settings-grid"><section class="settings-card"><h3>Appearance</h3><p>Theme changes snap instantly.</p><div class="setting-row"><span>Theme</span><div class="segmented"><button class="${!dark?'active':''}" data-theme-set="light">${icons.sun} Light</button><button class="${dark?'active':''}" data-theme-set="dark">${icons.moon} Dark</button></div></div></section><section class="settings-card"><h3>Navigation</h3><p>Choose which side contains the persistent navigation panel.</p><div class="setting-row"><span>Sidebar side</span><div class="segmented"><button class="${state.sidebarSide==='left'?'active':''}" data-side-set="left">Left</button><button class="${state.sidebarSide==='right'?'active':''}" data-side-set="right">Right</button></div></div></section><section class="settings-card"><h3>Workspace behavior</h3><p>The sidebar and main interface have independent scroll containers.</p><div class="setting-row"><span>Independent scrolling</span><strong>Enabled</strong></div><div class="setting-row"><span>Input typing hints</span><strong>Enabled</strong></div></section><section class="settings-card"><h3>Account</h3><p>${esc(state.user?.email||'No email returned by the backend.')}</p><div class="setting-row"><span>Username</span><strong>${esc(state.user?.username||'—')}</strong></div><div class="setting-row"><span>Token balance</span><strong>${Number(state.user?.tokens||0)}</strong></div></section></div></div></div>`}
function renderPage(){if(state.page==='playground'||state.page==='map'||state.page==='crawl'){if(state.page!=='playground')state.mode=state.page;return renderPlayground()}if(state.page==='activity')return renderActivity();if(state.page==='usage')return renderUsage();if(state.page==='api')return renderApi();if(state.page==='settings')return renderSettings();return renderPlayground()}
function renderApp(){return `<div class="app-shell">${renderTopbar()}<div class="workspace">${renderSidebar()}<main class="main">${renderPage()}${renderNotifications()}</main></div></div>`}
function render(){document.body.dataset.theme=state.theme;const app=$('#app');if(state.screen==='landing')app.innerHTML=renderLanding();else if(state.screen==='auth')app.innerHTML=renderAuth(state.authMode);else app.innerHTML=renderApp();bind();if(state.screen==='app')startTypingHints()}
function startTypingHints(){state.animatedTimers.forEach(clearTimeout);state.animatedTimers=[];const inputs=$$('.url-input, .question-input');const targets=[];const u=$('#urlInput'),q=$('#questionInput');if(u)targets.push({el:u,list:urlHints});if(q)targets.push({el:q,list:questionHints});targets.forEach(({el,list})=>{if(el.value)return;let index=0,i=0,del=false;const tick=()=>{if(!document.body.contains(el)||el.value)return;const target=list[index%list.length];if(!del){i++;el.placeholder=target.slice(0,i);if(i>=target.length){del=true;state.animatedTimers.push(setTimeout(tick,2000));return}}else{i--;el.placeholder=target.slice(0,i);if(i<=0){del=false;index++;state.animatedTimers.push(setTimeout(tick,500));return}}state.animatedTimers.push(setTimeout(tick,del?35:45))};state.animatedTimers.push(setTimeout(tick,600))})}
function bind(){
$$('[data-screen]').forEach(b=>b.onclick=()=>{state.screen=b.dataset.screen;state.authMode=b.dataset.authMode||'login';render()});$$('[data-auth-mode]').forEach(b=>b.onclick=()=>{state.screen='auth';state.authMode=b.dataset.authMode;render()});
const af=$('#authForm');if(af)af.onsubmit=async e=>{e.preventDefault();const f=new FormData(af);try{if(state.authMode==='register')await register(f.get('username'),f.get('email'),f.get('password'));else await login(f.get('identifier'),f.get('password'))}catch(x){notify('Authentication failed',x.message)}};
$$('[data-action=oauth]').forEach(b=>b.onclick=()=>notify('OAuth not configured',`${b.dataset.provider} OAuth endpoints are not present in the supplied backend.`));$$('[data-action=forgot]').forEach(b=>b.onclick=e=>{e.preventDefault();notify('Password reset unavailable','The supplied backend does not expose a password-reset endpoint.')});
$$('[data-page]').forEach(b=>b.onclick=()=>openPage(b.dataset.page));$('#sidebarBtn')?.addEventListener('click',toggleSidebar);$('#sidebarOverlay')?.addEventListener('click',()=>{state.sidebarOpen=false;render()});$('#notificationBtn')?.addEventListener('click',()=>{state.notificationsOpen=!state.notificationsOpen;state.sidebarOpen=false;render()});$$('[data-action=close-overlays]').forEach(b=>b.onclick=()=>{state.notificationsOpen=false;render()});$$('[data-action=logout]').forEach(b=>b.onclick=logout);$$('[data-action=support]').forEach(b=>b.onclick=()=>notify('Support','Connect your support destination when a support endpoint is available.'));$$('[data-action=upgrade]').forEach(b=>b.onclick=()=>notify('Plans','Billing is not implemented by the supplied backend.'));
$('#urlInput')?.addEventListener('input',e=>state.url=e.target.value);$('#questionInput')?.addEventListener('input',e=>state.question=e.target.value);$('[data-dropdown=mode]')?.addEventListener('click',()=>{state.dropdown=state.dropdown==='mode'?null:'mode';render();if(state.dropdown)setTimeout(positionDropdown,0)});$$('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;state.dropdown=null;if(state.mode==='map')state.formats=['markdown'];render()});$('[data-action=open-format]')?.addEventListener('click',()=>{state.formatDrawer=true;state.dropdown=null;render()});$('[data-action=close-format]')?.addEventListener('click',()=>{state.formatDrawer=false;render()});$$('[data-format]').forEach(b=>b.onclick=()=>{const id=b.dataset.format;if(state.formats.includes(id)){if(state.formats.length>1)state.formats=state.formats.filter(x=>x!==id)}else state.formats.push(id);render()});$$('[data-action=execute]').forEach(b=>b.onclick=execute);$('[data-action=toggle-batch]')?.addEventListener('click',()=>{state.batchOpen=!state.batchOpen;render()});$$('.batch-url').forEach(b=>b.oninput=()=>{state.batchRows[Number(b.dataset.batchIndex)].url=b.value});$('[data-action=start-batch]')?.addEventListener('click',batchScrape);$('[data-action=download-batch]')?.addEventListener('click',downloadBatch);
$$('[data-action=download-md]').forEach(b=>b.onclick=()=>downloadText('reclaire-output.md',currentOutput()));$$('[data-action=copy-md]').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(currentOutput());notify('Copied','Markdown copied to clipboard.')});$$('[data-action=copy-output]').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText(currentOutput());notify('Copied','Output copied to clipboard.')});
$$('[data-theme-set]').forEach(b=>b.onclick=()=>{setTheme(b.dataset.themeSet);render()});$$('[data-side-set]').forEach(b=>b.onclick=()=>{state.sidebarSide=b.dataset.sideSet;localStorage.setItem('reclaire_sidebar_side',state.sidebarSide);state.sidebarOpen=false;render()});$('[data-action=save-api-base]')?.addEventListener('click',async()=>{API_BASE=($('#apiBaseInput')?.value||'').trim().replace(/\/+$/,'');localStorage.setItem('reclaire_api_base',API_BASE);notify('Saved','API base updated.');if(state.user)await loadMe();render()});$('[data-action=grant-demo]')?.addEventListener('click',()=>notify('Backend endpoint required','The supplied main.py has no secure 50-token grant endpoint. This cannot be implemented safely in frontend-only code.'));
document.addEventListener('click',outside,{once:true})}
function positionDropdown(){const t=$('.custom-select'),m=$('#modeDropdown');if(!t||!m)return;const r=t.getBoundingClientRect();m.style.left=Math.min(r.left,innerWidth-m.offsetWidth-10)+'px';m.style.top=Math.min(r.bottom+7,innerHeight-m.offsetHeight-10)+'px'}function outside(e){if(state.dropdown&&!e.target.closest('.custom-select')&&!e.target.closest('#modeDropdown')){state.dropdown=null;render()}}
(async()=>{setTheme(state.theme);if(localStorage.getItem('reclaire_token')){if(await loadMe())state.screen='app';else localStorage.removeItem('reclaire_token')}render()})();
})();
</script>
</body>
</html>
