<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0A0F" />
  <title>ReClaire — Web Intelligence Engine</title>

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #F8F9FA;
      --surface: #FFFFFF;
      --surface-2: #F2F3F5;
      --surface-3: #E9EBEF;
      --text: #0F1115;
      --text-2: #414650;
      --muted: #64748B;
      --border: #DDE1E7;
      --border-strong: #C9CED8;
      --accent: #6366F1;
      --accent-2: #7C3AED;
      --accent-soft: rgba(99,102,241,.10);
      --success: #0A8935;
      --danger: #C62828;
      --gold: #B77A00;
      --gold-soft: rgba(239,208,110,.20);
      --shadow: 0 12px 40px rgba(15,17,21,.08);
      --topbar: 68px;
      --sidebar: 276px;
      --radius: 16px;
      --radius-sm: 11px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    [data-theme="dark"] {
      --bg: #0B0A0F;
      --surface: #16141F;
      --surface-2: #211E2B;
      --surface-3: #292532;
      --text: #F4F4F6;
      --text-2: #D5D6DC;
      --muted: #9297A4;
      --border: #302D3A;
      --border-strong: #45404F;
      --accent: #8B5CF6;
      --accent-2: #A78BFA;
      --accent-soft: rgba(139,92,246,.13);
      --success: #42C76D;
      --danger: #FF7070;
      --gold: #EFD09E;
      --gold-soft: rgba(239,208,110,.13);
      --shadow: 0 18px 55px rgba(0,0,0,.28);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.55;
      overflow: hidden;
    }
    button, input, textarea { font: inherit; }
    button { border: 0; cursor: pointer; color: inherit; }
    a { color: inherit; text-decoration: none; }
    svg { display: block; }

    /* ---------- Shared ---------- */
    .hidden { display: none !important; }
    .muted { color: var(--muted); }
    .eyebrow {
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .serif { font-family: "Playfair Display", Georgia, serif; }
    .mono { font-family: var(--mono); }
    .btn {
      min-height: 42px;
      padding: 0 16px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-weight: 700;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }
    .btn:hover { border-color: var(--border-strong); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
    .btn.primary:hover { filter: brightness(1.04); }
    .btn.ghost { background: transparent; }
    .btn.danger { color: var(--danger); }
    .icon-btn {
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 11px;
      display: grid;
      place-items: center;
      transition: background .16s ease, border-color .16s ease, transform .16s ease;
    }
    .icon-btn:hover { background: var(--surface-2); border-color: var(--border-strong); transform: translateY(-1px); }
    .input {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: var(--surface);
      color: var(--text);
    }
    .input:focus, textarea.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    textarea.input { min-height: 110px; padding: 13px 14px; resize: vertical; }
    .pill {
      border: 1px solid var(--border);
      background: var(--surface-2);
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-2);
    }

    /* ---------- Auth / Landing ---------- */
    .public-shell {
      height: 100dvh;
      overflow: auto;
      background: var(--bg);
    }
    .public-nav {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 28px;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }
    .brand-word {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: -.03em;
    }
    .landing {
      max-width: 1160px;
      margin: 0 auto;
      padding: 72px 28px 100px;
    }
    .hero {
      text-align: center;
      max-width: 850px;
      margin: 0 auto;
    }
    .hero-logo {
      width: 86px;
      height: 86px;
      object-fit: contain;
      margin: 0 auto 30px;
    }
    .hero h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(52px, 8vw, 92px);
      line-height: .98;
      letter-spacing: -.055em;
      margin: 0 0 28px;
      font-weight: 600;
    }
    .hero .lead {
      max-width: 690px;
      margin: 0 auto;
      font-size: clamp(16px, 2vw, 19px);
      color: var(--text-2);
    }
    .hero-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 32px 0 74px;
      flex-wrap: wrap;
    }
    .feature-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 42px;
    }
    .feature-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 22px;
      min-height: 175px;
    }
    .feature-card h3 { margin: 16px 0 7px; font-size: 15px; }
    .feature-card p { margin: 0; color: var(--muted); font-size: 13px; }
    .feature-icon {
      width: 38px; height: 38px; border-radius: 10px;
      display: grid; place-items: center; background: var(--accent-soft); color: var(--accent);
    }
    .examples {
      margin-top: 84px;
    }
    .section-title {
      display: flex; align-items: end; justify-content: space-between; gap: 20px;
      margin-bottom: 18px;
    }
    .section-title h2 { margin: 0; font-size: 25px; letter-spacing: -.035em; }
    .example-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .example-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 15px;
      overflow: hidden;
    }
    .example-top {
      padding: 15px 17px;
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .example-top strong { font-size: 13px; }
    .example-code {
      padding: 18px;
      background: var(--surface-2);
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-2);
      white-space: pre-wrap;
      min-height: 135px;
    }
    .public-footer {
      border-top: 1px solid var(--border);
      max-width: 1160px;
      margin: 0 auto;
      padding: 24px 28px 45px;
      color: var(--muted);
      font-size: 12px;
      display: flex; justify-content: space-between; gap: 20px;
    }

    .auth-screen {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      overflow: auto;
    }
    .auth-card {
      width: min(460px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 38px;
      box-shadow: var(--shadow);
    }
    .auth-logo { width: 54px; height: 54px; object-fit: contain; margin: 0 auto 28px; display: block; }
    .auth-card h1 { margin: 0; font-size: 30px; letter-spacing: -.045em; }
    .auth-card .sub { margin: 7px 0 28px; color: var(--muted); }
    .auth-field { margin: 14px 0; }
    .auth-field label { display: block; margin-bottom: 7px; font-size: 12px; font-weight: 700; color: var(--text-2); }
    .auth-links { display: flex; justify-content: space-between; margin: 12px 0 18px; font-size: 12px; }
    .auth-links a { color: var(--accent); font-weight: 700; }
    .auth-divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; margin: 22px 0; }
    .auth-divider:before, .auth-divider:after { content:""; height: 1px; background: var(--border); flex: 1; }
    .social-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .social-btn {
      min-height: 46px; border-radius: 11px; border: 1px solid var(--border);
      background: var(--surface); display: flex; align-items: center; justify-content: center; gap: 9px;
      font-weight: 700;
    }
    .social-btn:hover { background: var(--surface-2); }
    .auth-switch { text-align: center; margin-top: 24px; color: var(--muted); font-size: 12px; }
    .auth-switch button { background: none; color: var(--accent); font-weight: 800; }
    .legal { margin-top: 30px; color: var(--muted); font-size: 10px; text-align: center; }

    /* ---------- App shell ---------- */
    .app-shell { height: 100dvh; display: flex; flex-direction: column; }
    .topbar {
      flex: 0 0 var(--topbar);
      height: var(--topbar);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 18px;
      z-index: 40;
    }
    .top-left, .top-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .top-right { justify-content: flex-end; }
    .top-center { display: flex; justify-content: center; }
    .top-logo { width: 31px; height: 31px; object-fit: contain; }
    .account-chip {
      display: flex; align-items: center; gap: 9px;
      padding: 5px 9px 5px 5px; border: 1px solid var(--border); border-radius: 999px;
      background: var(--surface);
      min-width: 0;
    }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      display: grid; place-items: center; flex: 0 0 auto;
      background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 800;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .account-name { max-width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
    .token-mini {
      font-size: 11px; color: var(--gold);
      background: var(--gold-soft); border: 1px solid rgba(239,208,110,.35);
      border-radius: 999px; padding: 5px 9px; font-weight: 800;
    }

    .workspace { min-height: 0; flex: 1; display: flex; position: relative; }
    .sidebar {
      width: var(--sidebar);
      flex: 0 0 var(--sidebar);
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      overflow-x: hidden;
      padding: 14px 12px 22px;
      overscroll-behavior: contain;
      z-index: 35;
      transition: transform .22s ease;
    }
    .sidebar.right { order: 3; border-right: 0; border-left: 1px solid var(--border); }
    .sidebar-overlay {
      display: none;
      position: fixed; inset: var(--topbar) 0 0 0;
      background: rgba(0,0,0,.35); z-index: 30;
    }
    .sidebar-top { padding: 3px 4px 14px; }
    .upgrade {
      width: 100%; min-height: 44px; border-radius: 10px; background: var(--accent);
      color: white; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .support-btn {
      width: 100%; min-height: 40px; margin-top: 8px; border-radius: 10px; background: var(--surface-2);
      border: 1px solid var(--border); font-weight: 700; color: var(--text-2);
    }
    .profile-box {
      border: 1px solid var(--border); border-radius: 12px; padding: 11px; margin: 10px 0 18px;
      background: var(--surface-2);
      display: flex; align-items: center; gap: 10px;
    }
    .profile-meta { min-width: 0; }
    .profile-meta strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .profile-meta span { display: block; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nav-group { margin: 17px 0; }
    .nav-title { padding: 0 9px 7px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .nav-item {
      width: 100%; min-height: 38px; padding: 0 10px; border-radius: 9px; background: transparent;
      display: flex; align-items: center; gap: 10px; text-align: left; color: var(--text-2);
      margin: 2px 0; font-weight: 600;
    }
    .nav-item:hover { background: var(--surface-2); color: var(--text); }
    .nav-item.active { background: var(--accent-soft); color: var(--accent); }
    .nav-item .nav-icon { width: 18px; height: 18px; flex: 0 0 auto; }
    .logout { margin-top: 20px; color: var(--danger); }

    .main {
      min-width: 0;
      min-height: 0;
      flex: 1;
      overflow: hidden;
      position: relative;
      background: var(--bg);
    }
    .page {
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 34px 34px 70px;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }
    .page-inner { max-width: 1100px; margin: 0 auto; }
    .page-header { margin-bottom: 28px; }
    .page-header h1 { margin: 0; font-size: 28px; letter-spacing: -.045em; }
    .page-header p { margin: 7px 0 0; color: var(--muted); }

    /* ---------- Main playground ---------- */
    .playground {
      height: 100%;
      overflow-y: auto;
      padding: 55px 26px 80px;
      overscroll-behavior: contain;
    }
    .playground-inner { width: min(880px, 100%); margin: 0 auto; }
    .main-brand { text-align: center; }
    .main-brand img { width: 66px; height: 66px; object-fit: contain; margin: 0 auto 18px; }
    .main-brand h1 { font-family: "Playfair Display", Georgia, serif; margin: 0; font-size: 44px; letter-spacing: -.04em; font-weight: 600; }
    .main-brand p { max-width: 590px; margin: 12px auto 34px; color: var(--muted); font-size: 14px; }

    .input-panel {
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 9px;
      box-shadow: var(--shadow);
    }
    .input-row { display: grid; grid-template-columns: 1fr 2fr auto; gap: 8px; align-items: center; }
    .input-row.qa { grid-template-columns: 1fr 2fr; }
    .custom-select, .format-trigger, .url-shell, .search-format-trigger {
      min-height: 48px; border: 1px solid var(--border); border-radius: 11px; background: var(--surface-2);
    }
    .custom-select, .format-trigger, .search-format-trigger {
      position: relative; display: flex; align-items: center; justify-content: space-between;
      padding: 0 13px; cursor: pointer; font-weight: 700; text-align: left;
    }
    .custom-select:hover, .format-trigger:hover, .search-format-trigger:hover { border-color: var(--border-strong); }
    .url-shell { display: flex; align-items: center; overflow: hidden; background: var(--surface-2); }
    .url-prefix { color: var(--muted); padding-left: 13px; font-family: var(--mono); font-size: 12px; }
    .url-input {
      min-width: 0; flex: 1; height: 46px; border: 0; outline: 0; background: transparent; color: var(--text); padding: 0 11px 0 2px;
    }
    .question-wrap { margin-top: 8px; }
    .question-input { width: 100%; height: 44px; border: 1px solid var(--border); border-radius: 11px; background: var(--surface-2); color: var(--text); padding: 0 13px; outline: none; }
    .question-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .execute {
      min-height: 48px; border-radius: 11px; background: var(--accent); color: white; padding: 0 18px;
      font-weight: 800; white-space: nowrap;
    }
    .execute:disabled { opacity: .55; cursor: wait; }
    .panel-foot {
      margin-top: 8px; display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 2px 4px 1px;
    }
    .panel-hint { color: var(--muted); font-size: 11px; }
    .multi-count { color: var(--accent); font-weight: 800; font-size: 11px; }

    .search-mode-row {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 8px;
    }
    .search-mode-btn {
      min-height: 42px; border: 1px solid var(--border); background: var(--surface-2); border-radius: 10px; font-weight: 700;
    }
    .search-mode-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

    .output-area { margin-top: 36px; }
    .output-empty {
      border: 1px dashed var(--border-strong); border-radius: 15px; min-height: 210px;
      display: grid; place-items: center; text-align: center; padding: 30px; color: var(--muted);
      background: rgba(255,255,255,.2);
    }
    [data-theme="dark"] .output-empty { background: rgba(0,0,0,.08); }
    .result-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 15px; overflow: hidden;
    }
    .result-head {
      padding: 13px 15px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .result-head strong { font-size: 13px; }
    .result-body { padding: 20px; }
    .result-body.code { background: var(--surface-2); font-family: var(--mono); white-space: pre-wrap; font-size: 12px; overflow: auto; }
    .markdown-output { color: var(--text-2); }
    .markdown-output h1, .markdown-output h2, .markdown-output h3 { color: var(--text); letter-spacing: -.03em; line-height: 1.2; }
    .markdown-output h2 { margin-top: 22px; font-size: 21px; }
    .markdown-output h3 { margin-top: 18px; font-size: 16px; }
    .markdown-output strong { color: var(--text); }
    .markdown-output ul { padding-left: 20px; }
    .plain-ai {
      padding: 3px 0;
      max-width: 850px;
    }
    .image-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
    .image-item { aspect-ratio: 1/1; border: 1px solid var(--border); border-radius: 11px; overflow: hidden; background: var(--surface-2); position: relative; }
    .image-item img { width: 100%; height: 100%; object-fit: cover; }
    .image-item figcaption { position: absolute; left: 6px; right: 6px; bottom: 6px; background: rgba(0,0,0,.58); color: white; font-size: 9px; padding: 4px 6px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-profile { display: grid; gap: 20px; }
    .brand-hero { display: flex; align-items: center; gap: 16px; }
    .brand-logo-preview { width: 68px; height: 68px; border-radius: 14px; border: 1px solid var(--border); object-fit: contain; background: var(--surface-2); padding: 8px; }
    .brand-title { font-size: 22px; font-weight: 800; letter-spacing: -.035em; }
    .brand-domain { color: var(--muted); font-family: var(--mono); font-size: 12px; }
    .brand-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .brand-field { padding: 13px; border: 1px solid var(--border); border-radius: 11px; background: var(--surface-2); }
    .brand-field label { display: block; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 800; margin-bottom: 5px; }
    .json-pre { overflow: auto; margin: 0; font-family: var(--mono); font-size: 12px; line-height: 1.7; }

    .recent { margin-top: 34px; }
    .recent h3 { margin: 0 0 10px; font-size: 13px; }
    .recent-list { display: grid; gap: 7px; }
    .recent-item {
      border: 1px solid var(--border); background: var(--surface); border-radius: 11px; padding: 11px 13px;
      display: flex; justify-content: space-between; gap: 12px; align-items: center;
    }
    .recent-item .task { min-width: 0; }
    .recent-item .task strong { display: block; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .recent-item .task span { display: block; font-size: 10px; color: var(--muted); margin-top: 2px; }
    .cost { color: var(--gold); font-weight: 800; white-space: nowrap; }

    /* ---------- Menus / overlays ---------- */
    .floating-panel {
      position: fixed;
      top: calc(var(--topbar) + 9px);
      right: 14px;
      width: min(350px, calc(100vw - 28px));
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      z-index: 60;
      overflow: hidden;
      animation: panelIn .18s ease both;
    }
    .floating-panel.left { left: 14px; right: auto; }
    .floating-head { padding: 13px 15px; border-bottom: 1px solid var(--border); display:flex; align-items:center; justify-content:space-between; }
    .floating-head strong { font-size: 13px; }
    .notification-list { max-height: 360px; overflow: auto; }
    .notification {
      padding: 13px 15px; border-bottom: 1px solid var(--border); display:flex; gap:10px;
    }
    .notification:last-child { border-bottom: 0; }
    .notification-dot { width: 8px; height: 8px; border-radius:50%; background:var(--accent); margin-top:6px; flex:0 0 auto; }
    .notification strong { display:block; font-size:12px; }
    .notification span { display:block; color:var(--muted); font-size:11px; margin-top:2px; }
    .toast-stack { position: fixed; right: 16px; bottom: 16px; z-index: 100; display: grid; gap: 8px; width: min(350px, calc(100vw - 32px)); }
    .toast {
      background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent);
      border-radius: 11px; padding: 12px 13px; box-shadow: var(--shadow); animation: toastIn .22s ease both;
    }
    .toast strong { display:block; font-size:12px; }
    .toast span { display:block; color:var(--muted); font-size:11px; margin-top:2px; }

    .dropdown-menu {
      position: fixed;
      min-width: 210px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      z-index: 70;
      padding: 5px;
      animation: panelIn .15s ease both;
    }
    .dropdown-option {
      width: 100%; min-height: 39px; border-radius: 8px; background: transparent; padding: 0 10px;
      display:flex; align-items:center; justify-content:space-between; gap:10px; text-align:left;
    }
    .dropdown-option:hover { background: var(--surface-2); }
    .dropdown-option.active { color: var(--accent); font-weight:800; background: var(--accent-soft); }

    .format-drawer {
      position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
      width: min(820px, calc(100vw - 28px)); max-height: min(70dvh, 520px);
      background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
      box-shadow: var(--shadow); z-index: 65; animation: drawerIn .2s ease both; overflow: auto;
      padding: 15px;
    }
    .format-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
    .format-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; }
    .format-card {
      border:1px solid var(--border); border-radius:12px; background:var(--surface-2); padding:12px; text-align:left;
      min-height:118px; position:relative; cursor:pointer;
    }
    .format-card.selected { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft) inset; }
    .format-card strong { display:block; font-size:12px; }
    .format-card small { color:var(--muted); display:block; margin-top:3px; line-height:1.35; }
    .wire { margin-top:10px; height:43px; border:1px solid var(--border); border-radius:7px; padding:6px; display:flex; flex-direction:column; gap:4px; }
    .wire i { display:block; height:4px; background:var(--border-strong); border-radius:3px; }
    .wire i:nth-child(2) { width:72%; }
    .wire i:nth-child(3) { width:52%; }

    /* ---------- Settings / account pages ---------- */
    .settings-grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    .settings-card { border:1px solid var(--border); background:var(--surface); border-radius:15px; padding:18px; }
    .settings-card h3 { margin:0 0 5px; font-size:14px; }
    .settings-card p { margin:0 0 15px; color:var(--muted); font-size:12px; }
    .setting-row { min-height:48px; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:15px; }
    .setting-row:first-of-type { border-top:0; }
    .segmented { display:flex; border:1px solid var(--border); border-radius:9px; padding:3px; background:var(--surface-2); }
    .segmented button { padding:7px 10px; border-radius:7px; background:transparent; font-size:11px; font-weight:800; }
    .segmented button.active { background:var(--surface); box-shadow:0 1px 3px rgba(0,0,0,.08); color:var(--accent); }
    .switch { width:45px; height:25px; border-radius:999px; background:var(--surface-3); border:1px solid var(--border); position:relative; }
    .switch:after { content:""; width:19px; height:19px; border-radius:50%; background:var(--surface); position:absolute; top:2px; left:2px; transition:left .16s ease; box-shadow:0 1px 3px rgba(0,0,0,.18); }
    .switch.on { background:var(--accent); border-color:var(--accent); }
    .switch.on:after { left:22px; }

    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px; }
    .stat { background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:16px; }
    .stat span { display:block; color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.08em; font-weight:800; }
    .stat strong { display:block; font-size:25px; margin-top:5px; letter-spacing:-.04em; }
    .table-wrap { background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:auto; }
    table { width:100%; border-collapse:collapse; min-width:620px; }
    th, td { padding:12px 14px; border-bottom:1px solid var(--border); text-align:left; font-size:12px; }
    th { color:var(--muted); font-size:10px; text-transform:uppercase; letter-spacing:.07em; }
    tr:last-child td { border-bottom:0; }
    .api-box { display:flex; gap:8px; }
    .api-box input { flex:1; min-width:0; }

    /* ---------- Clara ---------- */
    .clara-page { height:100%; display:flex; flex-direction:column; }
    .clara-chat {
      flex:1; min-height:0; overflow:auto; padding:50px 24px 145px;
      overscroll-behavior:contain;
    }
    .clara-inner { width:min(840px,100%); margin:0 auto; }
    .clara-greeting { min-height:55dvh; display:grid; place-items:center; text-align:center; }
    .clara-greeting h1 { font-family:"Playfair Display",Georgia,serif; font-size:38px; margin:0 0 10px; }
    .clara-greeting p { margin:0; color:var(--muted); }
    .messages { display:grid; gap:18px; }
    .message { display:flex; gap:11px; max-width:800px; }
    .message.user { margin-left:auto; flex-direction:row-reverse; }
    .message-bubble { padding:12px 14px; border-radius:14px; border:1px solid var(--border); background:var(--surface); line-height:1.65; }
    .message.user .message-bubble { background:var(--accent-soft); border-color:transparent; }
    .loading-dots { display:flex; gap:5px; padding:5px 2px; }
    .loading-dots i { width:6px; height:6px; background:var(--muted); border-radius:50%; animation:dot 1s infinite ease-in-out; }
    .loading-dots i:nth-child(2) { animation-delay:.13s; }
    .loading-dots i:nth-child(3) { animation-delay:.26s; }
    .clara-composer {
      position:absolute; left:50%; bottom:18px; transform:translateX(-50%);
      width:min(820px,calc(100% - 34px)); background:var(--surface); border:1px solid var(--border);
      border-radius:18px; box-shadow:var(--shadow); padding:8px;
    }
    .composer-top { display:flex; justify-content:flex-end; padding:0 4px 5px; }
    .composer-text { display:flex; align-items:end; gap:8px; }
    .composer-text textarea { flex:1; min-height:45px; max-height:150px; border:0; outline:0; resize:none; background:transparent; color:var(--text); padding:10px 8px; }
    .send-circle { width:42px; height:42px; border-radius:50%; background:var(--accent); color:white; display:grid; place-items:center; flex:0 0 auto; }
    .send-circle:disabled { opacity:.5; }

    /* ---------- Animations ---------- */
    @keyframes panelIn { from { opacity:0; transform:translateY(-5px) scale(.985); } to { opacity:1; transform:none; } }
    @keyframes drawerIn { from { opacity:0; transform:translate(-50%, 14px); } to { opacity:1; transform:translate(-50%, 0); } }
    @keyframes toastIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    @keyframes dot { 0%,100%{ transform:translateY(0); opacity:.45 } 50%{ transform:translateY(-4px); opacity:1 } }

    /* ---------- Responsive ---------- */
    @media (max-width: 1050px) {
      :root { --sidebar: 250px; }
      .page { padding: 28px 22px 60px; }
      .feature-grid { grid-template-columns:repeat(2,1fr); }
      .format-grid { grid-template-columns:repeat(2,1fr); }
    }
    @media (max-width: 800px) {
      body { font-size:13px; }
      .topbar { grid-template-columns:1fr auto 1fr; padding:0 10px; }
      .account-name { max-width:100px; }
      .token-mini { display:none; }
      .sidebar {
        position:fixed; top:var(--topbar); bottom:0; left:0; transform:translateX(-105%);
        width:min(300px, 88vw); box-shadow:var(--shadow);
      }
      .sidebar.right { left:auto; right:0; transform:translateX(105%); }
      .sidebar.open { transform:translateX(0); }
      .sidebar-overlay.show { display:block; }
      .workspace { overflow:hidden; }
      .input-row { grid-template-columns:1fr; }
      .input-row.qa { grid-template-columns:1fr; }
      .execute { width:100%; }
      .main-brand h1 { font-size:37px; }
      .playground { padding:38px 15px 70px; }
      .image-grid { grid-template-columns:repeat(2,1fr); }
      .brand-grid, .settings-grid { grid-template-columns:1fr; }
      .stats { grid-template-columns:1fr; }
      .landing { padding-top:45px; }
      .hero h1 { font-size:55px; }
      .example-grid { grid-template-columns:1fr; }
    }
    @media (max-width: 520px) {
      .top-center { display:none; }
      .topbar { grid-template-columns:1fr auto; }
      .top-right { gap:6px; }
      .top-left { gap:6px; }
      .account-chip { padding-right:6px; }
      .account-name { max-width:85px; }
      .public-nav { padding:0 16px; }
      .landing { padding-left:16px; padding-right:16px; }
      .feature-grid { grid-template-columns:1fr; }
      .auth-card { padding:27px 20px; border-radius:18px; }
      .social-grid { grid-template-columns:1fr; }
      .hero-logo { width:72px; height:72px; }
      .hero h1 { font-size:49px; }
      .hero-actions .btn { width:100%; }
      .section-title { display:block; }
      .section-title .muted { margin-top:5px; }
      .format-drawer { bottom:0; border-radius:18px 18px 0 0; width:100%; max-height:76dvh; }
      .format-grid { grid-template-columns:1fr 1fr; }
      .clara-greeting h1 { font-size:32px; }
      .clara-composer { bottom:10px; width:calc(100% - 18px); }
      .page { padding:24px 15px 55px; }
    }
  </style>
</head>

<body data-theme="dark">
<div id="app"></div>
<div id="toastStack" class="toast-stack"></div>

<script>
(() => {
  "use strict";

  const API_BASE = localStorage.getItem("reclaire_api_base") || "http://localhost:8000";
  const state = {
    screen: "landing",
    page: "playground",
    theme: localStorage.getItem("reclaire_theme") || "dark",
    sidebarSide: localStorage.getItem("reclaire_sidebar_side") || "left",
    sidebarOpen: false,
    notificationsOpen: false,
    dropdown: null,
    formatDrawer: false,
    mode: "scrape",
    formats: ["summary"],
    searchFormat: "web",
    question: "",
    url: "",
    user: null,
    recentTransactions: [],
    result: null,
    loading: false,
    claraMessages: [],
    claraLoading: false,
    claraFormat: localStorage.getItem("reclaire_clara_format") || "chat",
    animatedTimers: []
  };

  const $ = (s, root=document) => root.querySelector(s);
  const $$ = (s, root=document) => [...root.querySelectorAll(s)];

  const icons = {
    logoFallback: `<span style="font-weight:900;font-size:18px">R</span>`,
    menu: `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h10"/></svg>`,
    bell: `<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>`,
    home: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M9 21v-6h6v6"/></svg>`,
    scrape: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16M4 9h10M4 13h16M4 17h8"/><path d="m17 15 4 4m0-4-4 4"/></svg>`,
    search: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 5 5"/></svg>`,
    map: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5 9 3l6 2 5-2v16l-5 2-6-2-5 2Z"/><path d="M9 3v16M15 5v16"/></svg>`,
    crawl: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2.3 2.3 3.4 5 3.4 8s-1.1 5.7-3.4 8c-2.3-2.3-3.4-5-3.4-8S9.7 6.3 12 4Z"/></svg>`,
    agent: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v3M5.6 6.2l2.1 2.1M18.4 6.2l-2.1 2.1"/><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M8.5 12h.01M15.5 12h.01M9 15h6"/></svg>`,
    activity: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5M4 19h16"/><path d="m7 15 3-4 3 2 5-7"/></svg>`,
    usage: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5M4 19h16"/><path d="M7 16v-3M12 16V8M17 16v-6"/></svg>`,
    key: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="15" r="4"/><path d="m11 12 8-8 2 2-2 2 2 2-3 3-2-2-2 2"/></svg>`,
    settings: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 8.5A3.5 3.5 0 1 0 12 15.5 3.5 3.5 0 0 0 12 8.5Z"/><path d="m19.4 15 .1.1-1.7 2.9-.2-.1a3 3 0 0 0-4.2 1.1V19h-3.4v-.2a3 3 0 0 0-4.2-1.1l-.2.1-1.7-2.9.1-.1a3 3 0 0 0 0-5l-.1-.1 1.7-2.9.2.1a3 3 0 0 0 4.2-1.1V5h3.4v.2a3 3 0 0 0 4.2 1.1l.2-.1 1.7 2.9-.1.1a3 3 0 0 0 0 5Z"/></svg>`,
    logout: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h5"/><path d="m14 8 4 4-4 4M8 12h10"/></svg>`,
    chevron: `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 9 5 5 5-5"/></svg>`,
    file: `<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5"/></svg>`,
    arrow: `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M6 11l6-6 6 6"/></svg>`,
    check: `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m5 12 4 4L19 6"/></svg>`,
    copy: `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>`,
    sun: `<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>`,
    moon: `<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 15.2A8.5 8.5 0 0 1 8.8 4a8.5 8.5 0 1 0 11.2 11.2Z"/></svg>`,
    external: `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 5h5v5M19 5l-8 8"/><path d="M19 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>`
  };

  const modes = [
    {id:"scrape", label:"Scrape", icon:icons.scrape},
    {id:"crawl", label:"Crawl", icon:icons.crawl},
    {id:"map", label:"Map", icon:icons.map},
    {id:"search", label:"Search", icon:icons.search}
  ];

  const formats = [
    {id:"summary", label:"Summary", desc:"Concise AI overview"},
    {id:"questions", label:"Q&A", desc:"Ask about the page"},
    {id:"markdown", label:"Main content", desc:"Clean Markdown"},
    {id:"images", label:"Images", desc:"Image URLs + metadata"},
    {id:"html", label:"HTML", desc:"Clean HTML"},
    {id:"raw_html", label:"Raw HTML", desc:"Original document"},
    {id:"links", label:"Links", desc:"Extract page links"},
    {id:"screenshot", label:"Screenshot", desc:"Full-page capture"},
    {id:"json", label:"Structured JSON", desc:"Schema-driven extraction"},
    {id:"branding", label:"Branding", desc:"Brand profile + assets"},
    {id:"highlights", label:"Highlights", desc:"Key points"},
    {id:"questions", label:"Questions", desc:"AI answer to your question"}
  ];

  function logoImg(cls="") {
    return `<img class="${cls}" src="reclaire-logo.svg" alt="ReClaire logo" onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<span class="logo-fallback">${icons.logoFallback}</span>')">`;
  }

  function initials(name) {
    return (name || "User").split(/\s+/).map(x => x[0]).join("").slice(0,2).toUpperCase();
  }

  function escapeHtml(value="") {
    return String(value).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  }

  // Lightweight Markdown renderer for AI output; deliberately avoids showing raw ** markers.
  function renderMarkdown(md="") {
    let s = escapeHtml(md);
    s = s.replace(/^### (.+)$/gm, "<h3>$1</h3>");
    s = s.replace(/^## (.+)$/gm, "<h2>$1</h2>");
    s = s.replace(/^# (.+)$/gm, "<h2>$1</h2>");
    s = s.replace(/^\s*[-*]\s+(.+)$/gm, "<li>$1</li>");
    s = s.replace(/(<li>.*<\/li>)/gs, "<ul>$1</ul>");
    s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/\n{2,}/g, "</p><p>");
    s = "<p>" + s + "</p>";
    s = s.replace(/<p>\s*(<h[23]>)/g, "$1").replace(/(<\/h[23]>)\s*<\/p>/g, "$1");
    return s;
  }

  function notify(title, text) {
    const stack = $("#toastStack");
    const el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = `<strong>${escapeHtml(title)}</strong><span>${escapeHtml(text)}</span>`;
    stack.appendChild(el);
    setTimeout(() => el.remove(), 4200);
  }

  function setTheme(theme) {
    state.theme = theme;
    document.body.dataset.theme = theme;
    localStorage.setItem("reclaire_theme", theme);
    document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#0B0A0F" : "#F8F9FA");
  }

  function authHeaders() {
    const token = localStorage.getItem("reclaire_token");
    return token ? { Authorization: `Bearer ${token}`, "Content-Type": "application/json" } : {"Content-Type":"application/json"};
  }

  async function api(path, options={}) {
    const headers = {...authHeaders(), ...(options.headers || {})};
    const response = await fetch(API_BASE + path, {...options, headers});
    let data = {};
    try { data = await response.json(); } catch (_) {}
    if (!response.ok) {
      const message = data.detail || data.message || `Request failed (${response.status})`;
      throw new Error(message);
    }
    return data;
  }

  async function loadMe() {
    try {
      const data = await api("/auth/me");
      state.user = data.user;
      state.recentTransactions = data.recent_transactions || [];
      return true;
    } catch (_) {
      localStorage.removeItem("reclaire_token");
      state.user = null;
      return false;
    }
  }

  async function login(identifier, password) {
    const data = await api("/auth/login", {
      method:"POST",
      body: JSON.stringify({username_or_email:identifier, password})
    });
    localStorage.setItem("reclaire_token", data.access_token);
    state.user = data.user;
    state.recentTransactions = [];
    state.screen = "app";
    state.page = "playground";
    render();
    await loadMe();
    notify("Welcome back", `Signed in as ${state.user.username}.`);
  }

  async function register(username, email, password) {
    const data = await api("/auth/register", {
      method:"POST",
      body: JSON.stringify({username, email, password})
    });
    localStorage.setItem("reclaire_token", data.access_token);
    state.user = data.user;
    state.screen = "app";
    state.page = "playground";
    state.recentTransactions = [{amount:100, action:"Registration Bonus", timestamp:new Date().toISOString()}];
    render();
    notify("Congratulations!", "You have received 100 tokens.");
  }

  function logout() {
    localStorage.removeItem("reclaire_token");
    state.user = null;
    state.recentTransactions = [];
    state.screen = "landing";
    state.page = "playground";
    state.sidebarOpen = false;
    render();
  }

  function openPage(page) {
    state.page = page;
    state.sidebarOpen = false;
    state.notificationsOpen = false;
    state.dropdown = null;
    state.formatDrawer = false;
    if (page !== "playground") state.result = null;
    render();
  }

  function toggleSidebar() {
    state.sidebarOpen = !state.sidebarOpen;
    state.notificationsOpen = false;
    render();
  }

  function closeOverlays() {
    state.notificationsOpen = false;
    state.dropdown = null;
    state.formatDrawer = false;
    render();
  }

  function selectedFormatsLabel() {
    if (state.formats.length === 1) {
      return formats.find(f => f.id === state.formats[0])?.label || state.formats[0];
    }
    return `${state.formats.length} formats selected`;
  }

  function actionLabel() {
    if (state.mode === "map") return "Map";
    if (state.mode === "search") return `Search ${state.searchFormat}`;
    if (state.formats.length > 1) {
      return ({scrape:"Start scraping",crawl:"Start crawling"})[state.mode] || "Run";
    }
    const id = state.formats[0];

    return labels[id] || "Run";
  }

  function validateUrl(url) {
    const raw = (url || "").trim();
    if (!raw) return null;
    try {
      const normalized = raw.startsWith("http://") || raw.startsWith("https://") ? raw : "https://" + raw;
      const u = new URL(normalized);
      return u.toString();
    } catch (_) { return null; }
  }

  async function execute() {
    if (state.loading) return;
    if (state.mode !== "search") {
      const valid = validateUrl(state.url);
      if (!valid) { notify("URL required", "Enter a valid URL, for example example.com/article."); return; }
      state.url = valid;
    }
    if (state.mode === "search" && !state.url.trim()) { notify("Search query required", "Enter a search query."); return; }
    if (state.formats.includes("questions") && !state.question.trim()) { notify("Question required", "Enter the question you want ReClaire to answer."); return; }

    state.loading = true;
    state.result = null;
    render();

    try {
      let data;
      if (state.mode === "scrape") {
        data = await api("/scrape", {
          method:"POST",
          body: JSON.stringify({
            url: state.url,
            formats: state.formats,
            user_question: state.formats.includes("questions") ? state.question : null,
            use_js_fallback: true,
            only_main_content: true,
            web_augmented_qa: true
          })
        });
      } else if (state.mode === "map") {
        data = await api("/map", {
          method:"POST",
          body: JSON.stringify({url:state.url,limit:100,include_subdomains:false})
        });
      } else if (state.mode === "crawl") {
        data = await api("/crawl", {
          method:"POST",
          body: JSON.stringify({
            url:state.url,
            limit:5,
            scrape_options:{url:state.url,formats:state.formats,user_question:state.question || null,use_js_fallback:true,only_main_content:true,web_augmented_qa:true}
          })
        });
      } else {
        data = await api("/search", {
          method:"POST",
          body: JSON.stringify({query:state.url,limit:10,category:state.searchFormat})
        });
      }
      state.result = data;
      await loadMe();
      notify("Complete", `${data.tokens_deducted || 1} token(s) used.`);
    } catch (e) {
      state.result = {error:e.message};
      notify("Request failed", e.message);
    } finally {
      state.loading = false;
      render();
    }
  }

  function renderPage() {
    if (state.page === "playground" || ["search","map","crawl"].includes(state.page)) {
      if (["search","map","crawl"].includes(state.page)) state.mode = state.page;
      return renderPlayground();
    }
    if (state.page === "clara") return renderClara();
    if (state.page === "activity") return renderActivity();
    if (state.page === "usage") return renderUsage();
    if (state.page === "api") return renderApi();
    if (state.page === "settings") return renderSettings();
    return renderPlayground();
  }

    const txs = state.recentTransactions || [];
    return `<div class="page"><div class="page-inner">
      <header class="page-header"><div class="eyebrow">Account</div><h1>Activity logs</h1><p>Recent token ledger activity returned by the ReClaire backend.</p></header>
      <div class="table-wrap"><table><thead><tr><th>Action</th><th>Tokens</th><th>Timestamp</th></tr></thead><tbody>
        ${txs.length ? txs.map(tx=>`<tr><td>${escapeHtml(tx.action)}</td><td style="font-weight:800;color:${tx.amount<0?"var(--gold)":"var(--success)"}">${tx.amount>0?"+":""}${tx.amount}</td><td>${escapeHtml(new Date(tx.timestamp).toLocaleString())}</td></tr>`).join("") : `<tr><td colspan="3" class="muted">No recent transactions returned.</td></tr>`}
      </tbody></table></div>
      <p class="muted" style="font-size:11px;margin-top:10px">The current backend exposes the latest 10 token transactions through <span class="mono">/auth/me</span>.</p>
    </div></div>`;
  }

  function renderUsage() {
    const tokens = Number(state.user?.tokens || 0);
    return `<div class="page"><div class="page-inner">
      <header class="page-header"><div class="eyebrow">Account</div><h1>Usage</h1><p>Your ReClaire token account and the current free-plan balance.</p></header>
      <div class="stats">
        <div class="stat"><span>Available tokens</span><strong>${tokens}</strong></div>
        <div class="stat"><span>Plan</span><strong style="font-size:20px">Free</strong></div>
        <div class="stat"><span>Refill</span><strong style="font-size:20px">Not enabled</strong></div>
      </div>
      <div class="settings-card"><h3>Monthly refill</h3><p>The supplied backend currently grants 100 tokens on registration, but does not implement a monthly refill endpoint or refill date. This UI therefore does not invent a refill date.</p><button class="btn" data-action="topup-demo">Token top-up</button></div>
    </div></div>`;
  }

  function renderApi() {
    return `<div class="page"><div class="page-inner">
      <header class="page-header"><div class="eyebrow">Account</div><h1>API keys</h1><p>Manage credentials for using ReClaire from your own tools and workspaces.</p></header>
      <div class="settings-card">
        <h3>API access</h3>
        <p>The current backend does not expose an API-key creation/list/revoke endpoint. The interface is ready for it, but no fake key is generated here.</p>
        <div class="api-box"><input class="input" value="API key endpoint not configured" disabled><button class="btn" disabled>Create key</button></div>
      </div>
    </div></div>`;
  }

  function renderSettings() {
    const dark = state.theme === "dark";
    return `<div class="page"><div class="page-inner">
      <header class="page-header"><div class="eyebrow">Account</div><h1>Settings</h1><p>Keep the workspace comfortable across desktop, tablet and phone.</p></header>
      <div class="settings-grid">
        <section class="settings-card"><h3>Appearance</h3><p>Theme changes are instant — no transition.</p>
          <div class="setting-row"><span>Theme</span><div class="segmented">
            <button class="${!dark?"active":""}" data-theme-set="light">${icons.sun} Light</button>
            <button class="${dark?"active":""}" data-theme-set="dark">${icons.moon} Dark</button>
          </div></div>
        </section>
        <section class="settings-card"><h3>Navigation</h3><p>Choose where the persistent side panel lives.</p>
          <div class="setting-row"><span>Side panel</span><div class="segmented">
            <button class="${state.sidebarSide==="left"?"active":""}" data-side-set="left">Left</button>
            <button class="${state.sidebarSide==="right"?"active":""}" data-side-set="right">Right</button>
          </div></div>
        </section>
        <section class="settings-card"><h3>Workspace behavior</h3><p>Independent scrolling is enabled for the sidebar and main interface.</p>
          <div class="setting-row"><span>Independent scrolling</span><button class="switch on" aria-label="enabled"></button></div>
          <div class="setting-row"><span>Animated input hints</span><button class="switch on" aria-label="enabled"></button></div>
        </section>
        <section class="settings-card"><h3>Account</h3><p>${escapeHtml(state.user?.email || "No email returned by the current login response.")}</p>
          <div class="setting-row"><span>Username</span><strong>${escapeHtml(state.user?.username || "—")}</strong></div>
          <div class="setting-row"><span>Token balance</span><strong>${Number(state.user?.tokens||0)}</strong></div>
        </section>
      </div>
    </div></div>`;
  }

  function renderClara() {
    const msgs = state.claraMessages;
    return `<div class="clara-page">
      <div class="clara-chat" id="claraChat">
        <div class="clara-inner">
          ${!msgs.length ? `<div class="clara-greeting"><div><div class="eyebrow">Research preview</div><h1>Hello, I'm Clara.</h1><p>Ask me to research, reason over pages, or turn gathered information into useful output.</p></div></div>` : `<div class="messages">${msgs.map(m=>renderClaraMessage(m)).join("")}${state.claraLoading ? `<div class="message"><div class="avatar">C</div><div class="message-bubble"><div class="loading-dots"><i></i><i></i><i></i></div></div></div>`:""}</div>`}
        </div>
      </div>
      <div class="clara-composer">
        <div class="composer-top"><div class="segmented">
          <button class="${state.claraFormat==="json"?"active":""}" data-clara-format="json">JSON</button>
          <button class="${state.claraFormat==="csv"?"active":""}" data-clara-format="csv">CSV</button>
          <button class="${state.claraFormat==="chat"?"active":""}" data-clara-format="chat">Chat</button>
        </div></div>
        <div class="composer-text"><textarea id="claraInput" placeholder="Ask Clara anything…"></textarea><button class="send-circle" id="claraSend" title="Send">${icons.arrow}</button></div>
      </div>
    </div>`;
  }

  function renderClaraMessage(m) {
    if (m.role === "user") return `<div class="message user"><div class="avatar">${escapeHtml(initials(state.user?.username))}</div><div class="message-bubble">${escapeHtml(m.content)}</div></div>`;
    if (m.format === "json") return `<div class="message"><div class="avatar">C</div><div class="message-bubble"><pre class="json-pre">${escapeHtml(JSON.stringify(m.content,null,2))}</pre></div></div>`;
    return `<div class="message"><div class="avatar">C</div><div class="message-bubble markdown-output">${renderMarkdown(m.content || "")}</div></div>`;
  }

  async function sendClara() {
    const input = $("#claraInput");
    if (!input || !input.value.trim() || state.claraLoading) return;
    const prompt = input.value.trim();
    state.claraMessages.push({role:"user",content:prompt});
    input.value = "";
    state.claraLoading = true;
    render();
    try {
      const data = await api("/agent", {
        method:"POST",
        body: JSON.stringify({
          prompt,
          output_format: state.claraFormat,
          chat_history: state.claraMessages.slice(-7).map(m=>({role:m.role,content:typeof m.content==="string"?m.content:JSON.stringify(m.content)}))
        })
      });
      state.claraMessages.push({role:"assistant",content:data.message ?? data.data,format:data.format});
      await loadMe();
    } catch(e) {
      state.claraMessages.push({role:"assistant",content:`I couldn't complete that request: ${e.message}`});
    } finally {
      state.claraLoading = false;
      render();
    }
  }

  function render() {
    document.body.dataset.theme = state.theme;
    const app = $("#app");
    if (state.screen === "landing") app.innerHTML = renderLanding();
    else if (state.screen === "auth") app.innerHTML = renderAuth(state.authMode || "login");
    else app.innerHTML = renderApp();

    bindEvents();
    if (state.screen === "app") startInputAnimation();
    if (state.page === "clara" && !state.claraLoading) {
      const chat = $("#claraChat");
      if (chat) chat.scrollTop = chat.scrollHeight;
    }
  }

  function startInputAnimation() {
    state.animatedTimers.forEach(clearTimeout);
    state.animatedTimers = [];
    const inputs = $$(".url-input, .question-input, #claraInput");
    const placeholders = {
      ".url-input": state.mode === "search" ? "Search the web for…" : "example.com/article",
      ".question-input": "What is this page about?",
      "#claraInput": "Research a topic or ask Clara a question…"
    };
    inputs.forEach(el => {
      if (el.dataset.animated === "1") return;
      el.dataset.animated = "1";
      const key = Object.keys(placeholders).find(k=>el.matches(k));
      if (!key) return;
      const target = placeholders[key];
      if (el.value) return;
      let i=0, deleting=false;
      const tick = () => {
        if (!document.body.contains(el) || el.value) return;
        if (!deleting) {
          i++;
          el.placeholder = target.slice(0,i);
          if (i >= target.length) {
            deleting = true;
            state.animatedTimers.push(setTimeout(tick, 2000));
            return;
          }
        } else {
          i--;
          el.placeholder = target.slice(0,i);
          if (i <= 0) {
            deleting = false;
            state.animatedTimers.push(setTimeout(tick, 550));
            return;
          }
        }
        state.animatedTimers.push(setTimeout(tick, deleting ? 38 : 48));
      };
      state.animatedTimers.push(setTimeout(tick, 600));
    });
  }

  function positionDropdown() {
    const trigger = $(".custom-select");
    const menu = $("#modeDropdown");
    if (!trigger || !menu) return;
    const r = trigger.getBoundingClientRect();
    menu.style.left = `${Math.min(r.left, window.innerWidth - menu.offsetWidth - 10)}px`;
    menu.style.top = `${Math.min(r.bottom + 7, window.innerHeight - menu.offsetHeight - 10)}px`;
  }

  function bindEvents() {
    // Landing/auth navigation
    $$("[data-screen]").forEach(btn => btn.addEventListener("click", e => {
      state.screen = btn.dataset.screen;
      state.authMode = btn.dataset.authMode || "login";
      render();
    }));
    $$("[data-auth-mode]").forEach(btn => btn.addEventListener("click", e => {
      state.screen = "auth";
      state.authMode = btn.dataset.authMode;
      render();
    }));

    const authForm = $("#authForm");
    if (authForm) authForm.addEventListener("submit", async e => {
      e.preventDefault();
      const fd = new FormData(authForm);
      const submit = $("button[type=submit]", authForm);
      submit.disabled = true;
      try {
        if (state.authMode === "register") await register(fd.get("username"),fd.get("email"),fd.get("password"));
        else await login(fd.get("identifier"),fd.get("password"));
      } catch (err) {
        notify("Authentication failed", err.message);
      } finally { submit.disabled = false; }
    });

    $$("[data-action='oauth']").forEach(btn => btn.addEventListener("click", () => notify("OAuth not configured", `${btn.dataset.provider} sign-in needs OAuth endpoints on the backend.`)));
    $$("[data-action='forgot']").forEach(btn => btn.addEventListener("click", e => {e.preventDefault(); notify("Password reset", "A password-reset endpoint is not present in the supplied backend yet.");}));

    // App nav
    $$("[data-page]").forEach(btn => btn.addEventListener("click", () => openPage(btn.dataset.page)));
    $("#sidebarBtn")?.addEventListener("click", toggleSidebar);
    $("#sidebarOverlay")?.addEventListener("click", () => {state.sidebarOpen=false;render();});
    $("#notificationBtn")?.addEventListener("click", () => {state.notificationsOpen=!state.notificationsOpen;state.sidebarOpen=false;render();});
    $$("[data-action='close-overlays']").forEach(b=>b.addEventListener("click",closeOverlays));
    $$("[data-action='logout']").forEach(b=>b.addEventListener("click",logout));
    $$("[data-action='support']").forEach(b=>b.addEventListener("click",()=>notify("Support","Connect your support destination here when the support backend is ready.")));
    $$("[data-action='upgrade']").forEach(b=>b.addEventListener("click",()=>notify("Plans","Billing is not implemented by the supplied backend yet.")));

    // Playground
    $("#urlInput")?.addEventListener("input", e => {state.url = e.target.value;});
    $("#questionInput")?.addEventListener("input", e => {state.question = e.target.value;});
    $("[data-dropdown='mode']")?.addEventListener("click", e => {state.dropdown = state.dropdown==="mode" ? null : "mode";render(); if(state.dropdown==="mode") setTimeout(positionDropdown,0);});
    $$("[data-mode]").forEach(btn=>btn.addEventListener("click",()=>{state.mode=btn.dataset.mode;state.dropdown=null;if(state.mode==="map")state.formats=["markdown"];render();}));
    $("[data-action='open-format']")?.addEventListener("click",()=>{state.formatDrawer=true;state.dropdown=null;render();});
    $("[data-action='close-format']")?.addEventListener("click",()=>{state.formatDrawer=false;render();});
    $$("[data-format]").forEach(btn=>btn.addEventListener("click",()=>{
      const id=btn.dataset.format;
      if (state.formats.includes(id)) {
        if (state.formats.length > 1) state.formats = state.formats.filter(x=>x!==id);
      } else state.formats.push(id);
      render();
    }));
    $$("[data-search-format]").forEach(btn=>btn.addEventListener("click",()=>{state.searchFormat=btn.dataset.searchFormat;render();}));
    $$("[data-action='execute']").forEach(btn=>btn.addEventListener("click",execute));

    // Settings
    $$("[data-theme-set]").forEach(btn=>btn.addEventListener("click",()=>{setTheme(btn.dataset.themeSet);render();}));
    $$("[data-side-set]").forEach(btn=>btn.addEventListener("click",()=>{state.sidebarSide=btn.dataset.sideSet;localStorage.setItem("reclaire_sidebar_side",state.sidebarSide);state.sidebarOpen=false;render();}));
    $$("[data-action='topup-demo']").forEach(btn=>btn.addEventListener("click",()=>notify("Top-up unavailable","The supplied backend exposes /auth/topup, but no payment flow. Use the backend endpoint only with a trusted amount source.")));

    // Clara
    $$("[data-clara-format]").forEach(btn=>btn.addEventListener("click",()=>{state.claraFormat=btn.dataset.claraFormat;localStorage.setItem("reclaire_clara_format",state.claraFormat);render();}));
    $("#claraSend")?.addEventListener("click",sendClara);
    $("#claraInput")?.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendClara();}});

    // Close dropdown by outside click
    document.addEventListener("click", outsideHandler, {once:true});
  }

  function outsideHandler(e) {
    if (!state.dropdown) return;
    if (!e.target.closest(".custom-select") && !e.target.closest("#modeDropdown")) {
      state.dropdown=null;
      render();
    }
  }

  // Restore auth session on first load.
  (async function boot() {
    setTheme(state.theme);
    const token = localStorage.getItem("reclaire_token");
    if (token) {
      const ok = await loadMe();
      if (ok) state.screen = "app";
    }
    render();
  })();

})();
</script>
</body>
</html>
