<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <title>ReClaire — Web Intelligence Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* All styles remain as in your original file – we keep them unchanged for consistency */
    :root {
      --bg: #f7f7f5;
      --surface: #fff;
      --surface2: #f0f0ed;
      --surface3: #e6e6e1;
      --text: #0b0b0b;
      --text2: #303030;
      --muted: #707070;
      --border: #deded8;
      --border2: #bdbdb5;
      --accent: #111;
      --accentSoft: #ecece8;
      --gold: #8b6a22;
      --goldSoft: #f4ecd7;
      --success: #16703b;
      --danger: #b3261e;
      --shadow: 0 18px 55px rgba(0,0,0,.08);
      --topbar: 66px;
      --sidebar: 270px;
      --radius: 16px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    [data-theme="dark"] {
      --bg: #0b0b0b;
      --surface: #141414;
      --surface2: #1b1b1b;
      --surface3: #242424;
      --text: #fff;
      --text2: #dedede;
      --muted: #9b9b9b;
      --border: #303030;
      --border2: #494949;
      --accent: #EFD09E;
      --accentSoft: rgba(239,208,158,.12);
      --gold: #EFD09E;
      --goldSoft: rgba(239,208,158,.12);
      --success: #68c892;
      --danger: #ff8078;
      --shadow: 0 22px 65px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }
    html { height: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.55 'Ubuntu', ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    button, input, textarea { font: inherit; }
    button { border: 0; color: inherit; cursor: pointer; }
    a { text-decoration: none; color: inherit; }
    svg { display: block; }
    .hidden { display: none !important; }
    .mono { font-family: var(--mono); }
    .muted { color: var(--muted); }

    .btn {
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-weight: 750;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }
    .btn:hover { transform: translateY(-1px); border-color: var(--border2); }
    .btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .btn.ghost { background: transparent; }
    .icon-btn {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      display: grid;
      place-items: center;
    }
    .icon-btn:hover { background: var(--surface2); }
    
    .input {
      width: 100%;
      height: 46px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      outline: 0;
      padding: 0 13px;
    }
    .input:focus, .question-input:focus, .url-input:focus, .textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accentSoft);
    }
    .textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      outline: 0;
      padding: 12px 13px;
      resize: vertical;
      min-height: 100px;
    }

    /* Layout */
    .app { height: 100%; display: flex; flex-direction: column; overflow: hidden; }
    .topbar {
      height: var(--topbar);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      padding: 0 18px;
      gap: 14px;
      flex-shrink: 0;
    }
    .topbar .brand { display: flex; align-items: center; gap: 10px; font-weight: 850; letter-spacing: -.035em; }
    .topbar .brand img { width: 30px; height: 30px; object-fit: contain; filter: brightness(0); }
    [data-theme="dark"] .topbar .brand img { filter: brightness(0) invert(1); }
    .topbar .spacer { flex: 1; }
    .topbar .top-right { display: flex; align-items: center; gap: 10px; }
    .account-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 3px 12px 3px 3px;
      background: var(--surface);
    }
    .account-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--accentSoft);
      display: grid; place-items: center;
      font-weight: 700; font-size: 13px; color: var(--accent);
    }
    .account-name { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .body-wrap { display: flex; flex: 1; overflow: hidden; }
    .sidebar {
      width: var(--sidebar);
      border-right: 1px solid var(--border);
      background: var(--surface);
      padding: 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
      overflow-y: auto;
    }
    .sidebar .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      border-radius: 10px;
      color: var(--text2);
      font-weight: 500;
      transition: background .15s, color .15s;
    }
    .sidebar .nav-item:hover { background: var(--surface2); color: var(--text); }
    .sidebar .nav-item.active { background: var(--accentSoft); color: var(--accent); }
    .sidebar .nav-item .icon { width: 20px; text-align: center; }
    .sidebar .bottom { margin-top: auto; border-top: 1px solid var(--border); padding-top: 12px; }

    .main {
      flex: 1;
      overflow-y: auto;
      padding: 30px 32px 60px;
      background: var(--bg);
    }
    .page { max-width: 1000px; margin: auto; animation: panelIn .25s ease; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .page-header h2 { margin: 0; font-size: 26px; letter-spacing: -.04em; }

    /* Playground */
    .url-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .url-row .url-input { flex: 1; min-width: 200px; }
    .mode-tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--border); margin-bottom: 16px; padding-bottom: 4px; }
    .mode-tab {
      padding: 6px 16px;
      border-radius: 8px;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      border: 1px solid transparent;
    }
    .mode-tab.active { background: var(--surface); border-color: var(--border); color: var(--text); }
    .format-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .format-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    .format-tag.selected { background: var(--accentSoft); border-color: var(--accent); }
    .question-row { margin-bottom: 12px; }
    .execute-row { display: flex; gap: 12px; align-items: center; margin-top: 8px; }
    .execute .btn { min-width: 120px; }

    .result-area {
      margin-top: 30px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
    }
    .result-header {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      background: var(--surface2);
    }
    .result-body {
      padding: 18px;
      max-height: 500px;
      overflow: auto;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .result-body .error { color: var(--danger); }

    /* Auth */
    .auth-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.25);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
    }
    .auth-card {
      background: var(--surface);
      border-radius: 24px;
      padding: 40px 36px;
      max-width: 420px;
      width: 90%;
      box-shadow: var(--shadow);
    }
    .auth-card h2 { margin-top: 0; font-size: 28px; letter-spacing: -.04em; }
    .auth-card .input { margin-bottom: 12px; }
    .auth-card .btn { width: 100%; margin-top: 8px; }
    .auth-card .toggle-link { margin-top: 14px; text-align: center; color: var(--muted); font-size: 13px; }
    .auth-card .toggle-link a { color: var(--accent); font-weight: 600; cursor: pointer; }

    /* Toast */
    .toast-stack {
      position: fixed; bottom: 20px; right: 20px; z-index: 9999;
      display: flex; flex-direction: column; gap: 8px; max-width: 380px;
    }
    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 18px;
      box-shadow: var(--shadow);
      animation: toastIn .2s ease;
    }
    .toast strong { display: block; margin-bottom: 2px; }

    /* Responsive overrides */
    @media(max-width: 800px) {
      .sidebar { display: none; }
      .main { padding: 20px 16px 60px; }
      .url-row { flex-direction: column; }
      .execute-row { flex-wrap: wrap; }
    }
    @media(max-width: 520px) {
      .topbar .brand span { display: none; }
      .auth-card { padding: 28px 18px; }
    }

    /* Misc */
    .flex { display: flex; align-items: center; gap: 8px; }
    .gap-sm { gap: 6px; }
    .mt-8 { margin-top: 8px; }
    .mb-8 { margin-bottom: 8px; }
    .w-full { width: 100%; }
    .text-center { text-align: center; }
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes panelIn { from { opacity: 0; transform: translateY(-5px) scale(.985); } to { opacity: 1; transform: none; } }
    @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body data-theme="light">
  <div id="app"></div>
  <div id="toastStack" class="toast-stack"></div>

  <script>
    (() => {
      'use strict';

      // --- Configuration ---
      const API_BASE = localStorage.getItem('reclaire_api_base') || 'https://reclaire-api.onrender.com';
      const SUPABASE_URL = 'https://lbraefssokojulyfmmjd.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxicmFlZnNzb2tvanVseWZtbWpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMjQyODksImV4cCI6MjEwMzYwMDI4OX0.e_jmB4jS_-cwKAraZpspPhEW_K4l2mbhhPZAlgN_y1E';

      let supabaseClient = null;
      if (typeof supabase !== 'undefined' && SUPABASE_URL && SUPABASE_ANON_KEY) {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }

      // --- State ---
      const state = {
        screen: 'landing', // 'landing' | 'app'
        authMode: 'login', // 'login' | 'register'
        page: 'playground', // 'playground' | 'batch' | 'settings' | 'usage'
        theme: localStorage.getItem('reclaire_theme') || 'light',
        sidebarOpen: false,
        user: null,
        apiKey: localStorage.getItem('reclaire_api_key') || '',
        tokenBalance: 0,

        // Playground
        mode: 'scrape', // 'scrape' | 'map' | 'crawl'
        url: '',
        formats: ['markdown'],
        question: '',
        loading: false,
        result: null,

        // Batch
        batchUrls: [],
        batchRunning: false,
        batchId: null,
        batchResult: null,

        // Usage
        usageLogs: [],
      };

      // --- Utilities ---
      const $ = (s, r = document) => r.querySelector(s);
      const $$ = (s, r = document) => [...r.querySelectorAll(s)];
      const esc = v => String(v ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
      const logoImg = (c = '') => `<img class="${c}" src="reclaire-logo.svg" alt="ReClaire logo" onerror="this.style.visibility='hidden'">`;
      const initials = n => (n || 'User').split(/\s+/).map(x => x[0]).join('').slice(0, 2).toUpperCase();

      function notify(title, msg) {
        const el = document.createElement('div');
        el.className = 'toast';
        el.innerHTML = `<strong>${esc(title)}</strong><span>${esc(msg)}</span>`;
        $('#toastStack').appendChild(el);
        setTimeout(() => el.remove(), 4300);
      }

      function setTheme(t) {
        state.theme = t;
        document.body.dataset.theme = t;
        localStorage.setItem('reclaire_theme', t);
        const meta = document.querySelector('meta[name=theme-color]');
        if (meta) meta.setAttribute('content', t === 'dark' ? '#0b0b0b' : '#f7f7f5');
      }

      function headers() {
        return state.apiKey
          ? { 'X-API-Key': state.apiKey, 'Content-Type': 'application/json' }
          : { 'Content-Type': 'application/json' };
      }

      async function api(path, opt = {}) {
        const r = await fetch(API_BASE + path, { ...opt, headers: { ...headers(), ...(opt.headers || {}) } });
        let d = {};
        try { d = await r.json(); } catch {}
        if (!r.ok) throw Error(d.detail || d.message || `Request failed (${r.status})`);
        return d;
      }

      async function loadAccount() {
        try {
          const data = await api('/auth/me');
          state.tokenBalance = data.tokens_remaining || 0;
          return true;
        } catch {
          return false;
        }
      }

      // --- Auth ---
      async function handleAuth() {
        const email = $('#authEmail').value.trim();
        const password = $('#authPassword').value;
        const username = $('#authUsername')?.value?.trim();
        if (!email || !password) { notify('Missing fields', 'Email and password required.'); return; }
        try {
          let data;
          if (state.authMode === 'register') {
            data = await api('/auth/register', {
              method: 'POST',
              body: JSON.stringify({ email, password, username })
            });
          } else {
            data = await api('/auth/login', {
              method: 'POST',
              body: JSON.stringify({ email, password })
            });
          }
          state.apiKey = data.api_key;
          localStorage.setItem('reclaire_api_key', data.api_key);
          state.user = data.user;
          state.tokenBalance = data.tokens_remaining || 0;
          state.screen = 'app';
          notify('Success', state.authMode === 'register' ? 'Account created!' : 'Welcome back!');
          render();
        } catch (e) {
          notify('Auth failed', e.message);
        }
      }

      async function logout() {
        try {
          await api('/auth/logout', { method: 'POST' });
        } catch {}
        state.apiKey = '';
        localStorage.removeItem('reclaire_api_key');
        state.user = null;
        state.screen = 'landing';
        render();
      }

      // --- Execute ---
      async function execute() {
        if (state.loading) return;
        const url = state.url.trim();
        if (!url) { notify('URL required', 'Enter a valid URL.'); return; }
        if (state.mode === 'scrape' && state.formats.includes('questions') && !state.question.trim()) {
          notify('Question required', 'Enter a question for Q&A.');
          return;
        }

        state.loading = true;
        state.result = null;
        render();

        try {
          let data;
          if (state.mode === 'scrape') {
            data = await api('/v1/scrape', {
              method: 'POST',
              body: JSON.stringify({
                url,
                formats: state.formats,
                user_question: state.question || null,
                use_js_fallback: true,
                only_main_content: true,
                remove_tags: ['script', 'style', 'nav', 'footer', 'header', 'aside', 'form', 'iframe', 'noscript']
              })
            });
          } else if (state.mode === 'map') {
            data = await api('/v1/map', {
              method: 'POST',
              body: JSON.stringify({ url, limit: 100, include_subdomains: false })
            });
          } else { // crawl
            data = await api('/v1/crawl', {
              method: 'POST',
              body: JSON.stringify({
                url,
                limit: 5,
                scrape_options: {
                  url,
                  formats: state.formats,
                  user_question: state.question || null,
                  use_js_fallback: true,
                  only_main_content: true
                }
              })
            });
          }
          state.result = data;
          if (data.tokens_remaining !== undefined) state.tokenBalance = data.tokens_remaining;
          await loadAccount(); // refresh balance
          notify('Complete', `${data.tokens_deducted || 1} token(s) used.`);
        } catch (e) {
          state.result = { error: e.message };
          notify('Request failed', e.message);
        } finally {
          state.loading = false;
          render();
        }
      }

      // --- Render ---
      function render() {
        const app = $('#app');
        if (!app) return;

        if (state.screen === 'landing') {
          app.innerHTML = renderLanding();
          attachLandingEvents();
          return;
        }

        // App view
        app.innerHTML = `
          <div class="app">
            ${renderTopbar()}
            <div class="body-wrap">
              ${renderSidebar()}
              <div class="main">
                ${renderPage()}
              </div>
            </div>
          </div>
        `;
        attachAppEvents();
      }

      function renderTopbar() {
        const avatar = state.user?.avatar || '';
        const name = state.user?.name || state.user?.email || 'User';
        return `
          <div class="topbar">
            <div class="brand">
              ${logoImg('')}
              <span>ReClaire</span>
            </div>
            <div class="spacer"></div>
            <div class="top-right">
              <span class="muted" style="font-size:12px;">${state.tokenBalance} tokens</span>
              <div class="account-badge">
                <div class="account-avatar">${avatar ? `<img src="${esc(avatar)}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : initials(name)}</div>
                <span class="account-name">${esc(name)}</span>
                <button class="icon-btn" style="width:28px;height:28px;border-radius:50%;background:transparent;border:0;" onclick="window.__logout()">✕</button>
              </div>
              <button class="icon-btn" onclick="window.__toggleTheme()">${state.theme === 'dark' ? '☀️' : '🌙'}</button>
            </div>
          </div>
        `;
      }

      function renderSidebar() {
        const items = [
          { id: 'playground', label: 'Scrape', icon: '🔍' },
          { id: 'batch', label: 'Batch', icon: '📦' },
          { id: 'usage', label: 'Usage', icon: '📊' },
          { id: 'settings', label: 'Settings', icon: '⚙️' },
        ];
        return `
          <div class="sidebar">
            ${items.map(it => `
              <div class="nav-item ${state.page === it.id ? 'active' : ''}" data-page="${it.id}">
                <span class="icon">${it.icon}</span> ${it.label}
              </div>
            `).join('')}
            <div class="bottom">
              <div class="nav-item" onclick="window.__logout()">
                <span class="icon">🚪</span> Logout
              </div>
            </div>
          </div>
        `;
      }

      function renderPage() {
        switch (state.page) {
          case 'playground': return renderPlayground();
          case 'batch': return renderBatch();
          case 'usage': return renderUsage();
          case 'settings': return renderSettings();
          default: return '<p>Page not found.</p>';
        }
      }

      function renderPlayground() {
        const modes = ['scrape', 'map', 'crawl'];
        const formatOptions = ['markdown', 'html', 'raw_html', 'summary', 'questions', 'json'];
        const isQuestions = state.formats.includes('questions');

        return `
          <div class="page">
            <div class="page-header">
              <h2>Web Intelligence</h2>
            </div>
            <div class="mode-tabs">
              ${modes.map(m => `<button class="mode-tab ${state.mode === m ? 'active' : ''}" data-mode="${m}">${m.charAt(0).toUpperCase()+m.slice(1)}</button>`).join('')}
            </div>
            <div class="url-row">
              <input class="input url-input" id="urlInput" placeholder="Enter URL (e.g. https://example.com)" value="${esc(state.url)}">
            </div>
            <div class="format-row">
              ${formatOptions.map(f => `
                <span class="format-tag ${state.formats.includes(f) ? 'selected' : ''}" data-format="${f}">${f.replace('_',' ').toUpperCase()}</span>
              `).join('')}
            </div>
            ${isQuestions ? `
              <div class="question-row">
                <input class="input question-input" id="questionInput" placeholder="Your question about the page" value="${esc(state.question)}">
              </div>
            ` : ''}
            <div class="execute-row">
              <div class="execute">
                <button class="btn primary" id="executeBtn" ${state.loading ? 'disabled' : ''}>
                  ${state.loading ? '<span class="spinner"></span>' : 'Execute'}
                </button>
              </div>
              <span class="muted" style="font-size:12px;">Cost: ~${state.mode === 'scrape' ? (state.formats.includes('summary')?4:1) : state.mode === 'map' ? 1 : 5} tokens</span>
            </div>

            ${state.result ? `
              <div class="result-area">
                <div class="result-header">
                  <span>Result</span>
                  <span class="muted">${state.result.tokens_deducted ? state.result.tokens_deducted + ' tokens' : ''}</span>
                </div>
                <div class="result-body">
                  ${state.result.error ? `<div class="error">❌ ${esc(state.result.error)}</div>` :
                    state.mode === 'map' ? 
                      `<div>Found ${state.result.links_count || 0} links:</div><ul>${(state.result.links || []).map(l => `<li>${esc(l)}</li>`).join('')}</ul>` :
                      state.result.markdown ? 
                        `<div style="white-space:pre-wrap;">${esc(state.result.markdown)}</div>` :
                        state.result.data ? 
                          `<div>${state.result.data.map(d => `<div><strong>${esc(d.url)}</strong> ${d.status}</div>`).join('')}</div>` :
                          `<pre>${esc(JSON.stringify(state.result, null, 2))}</pre>`
                  }
                </div>
              </div>
            ` : ''}
          </div>
        `;
      }

      function renderBatch() {
        return `
          <div class="page">
            <h2>Batch Scrape</h2>
            <div class="batch-input">
              <textarea class="textarea" id="batchUrls" placeholder="Enter URLs, one per line" rows="5">${state.batchUrls.join('\n')}</textarea>
              <div class="flex mt-8">
                <button class="btn primary" id="batchStartBtn" ${state.batchRunning ? 'disabled' : ''}>
                  ${state.batchRunning ? 'Running...' : 'Start Batch'}
                </button>
                ${state.batchId ? `<a class="btn" href="${API_BASE}/v1/batch-scrape/${state.batchId}/download" target="_blank">Download ZIP</a>` : ''}
              </div>
            </div>
            ${state.batchResult ? `
              <div class="result-area mt-8">
                <div class="result-header">Batch Results</div>
                <div class="result-body">
                  ${state.batchResult.rows.map(r => `<div>${r.index+1}. ${esc(r.url)} — ${r.status} ${r.error ? '❌ '+esc(r.error) : '✅'}</div>`).join('')}
                </div>
              </div>
            ` : ''}
          </div>
        `;
      }

      function renderUsage() {
        return `
          <div class="page">
            <h2>Usage Logs</h2>
            <p class="muted">Last 100 entries</p>
            <div style="border:1px solid var(--border);border-radius:var(--radius);overflow:auto;max-height:400px;">
              <table style="width:100%;border-collapse:collapse;font-size:13px;">
                <thead><tr style="border-bottom:1px solid var(--border);"><th style="padding:8px 12px;text-align:left;">Endpoint</th><th style="padding:8px 12px;text-align:right;">Tokens</th><th style="padding:8px 12px;text-align:right;">Time</th></tr></thead>
                <tbody>
                  ${(state.usageLogs || []).map(log => `
                    <tr style="border-bottom:1px solid var(--border2);">
                      <td style="padding:8px 12px;">${esc(log.endpoint)}</td>
                      <td style="padding:8px 12px;text-align:right;">${log.tokens_deducted}</td>
                      <td style="padding:8px 12px;text-align:right;font-size:11px;color:var(--muted);">${new Date(log.created_at).toLocaleString()}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      function renderSettings() {
        return `
          <div class="page">
            <h2>Settings</h2>
            <div class="flex gap-sm">
              <label>API Base URL:</label>
              <input class="input" id="apiBaseInput" value="${esc(API_BASE)}" style="max-width:300px;">
              <button class="btn" onclick="window.__saveApiBase()">Save</button>
            </div>
            <div class="mt-8">
              <button class="btn ghost" onclick="window.__logout()">Logout</button>
              <button class="btn ghost" style="color:var(--danger);" onclick="window.__deleteAccount()">Delete Account</button>
            </div>
          </div>
        `;
      }

      // --- Landing ---
      function renderLanding() {
        return `
          <div class="public-shell">
            <nav class="public-nav">
              <div class="brand-word">${logoImg('brand-logo')} ReClaire</div>
              <div>
                <button class="btn ghost" onclick="window.__showAuth('login')">Sign in</button>
                <button class="btn primary" onclick="window.__showAuth('register')">Get started</button>
              </div>
            </nav>
            <div class="landing">
              <div class="hero">
                ${logoImg('hero-logo')}
                <h1>Web Intelligence</h1>
                <p>Scrape, map, and crawl websites with LLM-powered extraction. Clean Markdown, Q&A, structured JSON — all via one API.</p>
                <div class="hero-actions">
                  <button class="btn primary" onclick="window.__showAuth('register')">Start free →</button>
                  <button class="btn ghost" onclick="window.__showAuth('login')">Sign in</button>
                </div>
              </div>
              <div class="section">
                <div class="section-head"><h2>Features</h2></div>
                <div class="feature-grid">
                  <div class="feature"><div class="feature-icon">📄</div><h3>Markdown & HTML</h3><p>Clean, readable content with optional raw HTML.</p></div>
                  <div class="feature"><div class="feature-icon">🧠</div><h3>LLM Summaries</h3><p>Auto-generated summaries and Q&A with your context.</p></div>
                  <div class="feature"><div class="feature-icon">🗺️</div><h3>Site Mapping</h3><p>Discover all pages on a domain with one request.</p></div>
                  <div class="feature"><div class="feature-icon">📦</div><h3>Batch Scraping</h3><p>Scrape up to 10 URLs in a single job, download ZIP.</p></div>
                  <div class="feature"><div class="feature-icon">🔐</div><h3>Token Economy</h3><p>Pay only for what you use. Grant tokens for testing.</p></div>
                  <div class="feature"><div class="feature-icon">⚡</div><h3>JS Rendering</h3><p>Playwright fallback for dynamic content.</p></div>
                </div>
              </div>
            </div>
            <div class="public-footer">
              <span>© 2026 ReClaire</span>
              <span>Built with ❤️</span>
            </div>
          </div>
          ${state.authMode ? renderAuthModal() : ''}
        `;
      }

      function renderAuthModal() {
        const isLogin = state.authMode === 'login';
        return `
          <div class="auth-overlay" id="authOverlay">
            <div class="auth-card">
              <h2>${isLogin ? 'Sign in' : 'Create account'}</h2>
              <input class="input" id="authEmail" type="email" placeholder="Email">
              <input class="input" id="authPassword" type="password" placeholder="Password" minlength="8">
              ${!isLogin ? `<input class="input" id="authUsername" placeholder="Username (optional)">` : ''}
              <button class="btn primary" id="authSubmit">${isLogin ? 'Sign in' : 'Register'}</button>
              <div class="toggle-link">
                ${isLogin ? "Don't have an account? " : "Already have an account? "}
                <a onclick="window.__toggleAuthMode()">${isLogin ? 'Register' : 'Sign in'}</a>
              </div>
              <button class="btn ghost" style="margin-top:8px;" onclick="window.__closeAuth()">Close</button>
            </div>
          </div>
        `;
      }

      // --- Event attachment ---
      function attachLandingEvents() {
        // auth buttons are inline with onclick
      }

      function attachAppEvents() {
        // Sidebar navigation
        $$('.sidebar .nav-item[data-page]').forEach(el => {
          el.onclick = () => {
            const page = el.dataset.page;
            state.page = page;
            // if switching to usage, fetch logs
            if (page === 'usage') fetchUsage();
            render();
          };
        });

        // Mode tabs
        $$('.mode-tab').forEach(el => {
          el.onclick = () => {
            state.mode = el.dataset.mode;
            render();
          };
        });

        // Format tags
        $$('.format-tag').forEach(el => {
          el.onclick = () => {
            const fmt = el.dataset.format;
            if (state.formats.includes(fmt)) {
              state.formats = state.formats.filter(f => f !== fmt);
            } else {
              state.formats.push(fmt);
            }
            render();
          };
        });

        // URL input
        const urlInput = $('#urlInput');
        if (urlInput) {
          urlInput.oninput = (e) => { state.url = e.target.value; };
          urlInput.onkeydown = (e) => { if (e.key === 'Enter') execute(); };
        }

        // Question input
        const qInput = $('#questionInput');
        if (qInput) {
          qInput.oninput = (e) => { state.question = e.target.value; };
          qInput.onkeydown = (e) => { if (e.key === 'Enter') execute(); };
        }

        // Execute button
        const execBtn = $('#executeBtn');
        if (execBtn) execBtn.onclick = execute;

        // Batch
        const batchStart = $('#batchStartBtn');
        if (batchStart) {
          batchStart.onclick = async () => {
            const ta = $('#batchUrls');
            if (!ta) return;
            const urls = ta.value.split('\n').map(s => s.trim()).filter(Boolean);
            if (urls.length === 0) { notify('No URLs', 'Enter at least one URL.'); return; }
            state.batchRunning = true;
            render();
            try {
              const data = await api('/v1/batch-scrape', {
                method: 'POST',
                body: JSON.stringify({
                  urls,
                  formats: state.formats,
                  use_js_fallback: true,
                  only_main_content: true
                })
              });
              state.batchId = data.batch_id;
              state.batchResult = data;
              notify('Batch started', `${data.total} URLs submitted.`);
            } catch (e) {
              notify('Batch failed', e.message);
            } finally {
              state.batchRunning = false;
              render();
            }
          };
        }

        // Settings: API base
        const apiBaseInput = $('#apiBaseInput');
        if (apiBaseInput) {
          apiBaseInput.onchange = () => {
            localStorage.setItem('reclaire_api_base', apiBaseInput.value);
            window.location.reload();
          };
        }
      }

      // --- Extra functions exposed to window ---
      window.__toggleTheme = () => {
        setTheme(state.theme === 'dark' ? 'light' : 'dark');
        render();
      };

      window.__logout = logout;

      window.__showAuth = (mode) => {
        state.authMode = mode;
        render();
      };

      window.__closeAuth = () => {
        state.authMode = null;
        render();
      };

      window.__toggleAuthMode = () => {
        state.authMode = state.authMode === 'login' ? 'register' : 'login';
        render();
      };

      window.__saveApiBase = () => {
        const input = $('#apiBaseInput');
        if (input) {
          localStorage.setItem('reclaire_api_base', input.value);
          notify('Saved', 'API base updated. Reloading...');
          setTimeout(() => window.location.reload(), 500);
        }
      };

      window.__deleteAccount = async () => {
        if (!confirm('Are you sure you want to delete your account? This is irreversible.')) return;
        try {
          await api('/auth/me', { method: 'DELETE' });
          notify('Account deleted', 'Your account has been removed.');
          logout();
        } catch (e) {
          notify('Deletion failed', e.message);
        }
      };

      // --- Fetch usage ---
      async function fetchUsage() {
        try {
          const data = await api('/v1/usage');
          state.usageLogs = data.logs || [];
          render();
        } catch {}
      }

      // --- Auth overlay events ---
      document.addEventListener('click', (e) => {
        if (e.target.id === 'authSubmit') {
          handleAuth();
        }
        if (e.target.id === 'authOverlay' && e.target === e.currentTarget) {
          state.authMode = null;
          render();
        }
      });

      // --- Initialization ---
      (async () => {
        setTheme(state.theme);
        if (state.apiKey) {
          const ok = await loadAccount();
          if (ok) {
            state.screen = 'app';
            // if we have a valid key, attempt to get user info from /auth/me (already done in loadAccount)
            // also fetch usage if page is usage
            if (state.page === 'usage') fetchUsage();
          } else {
            localStorage.removeItem('reclaire_api_key');
            state.apiKey = '';
          }
        }
        render();
      })();

    })();
  </script>
</body>
</html>
