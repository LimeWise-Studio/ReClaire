/* Public */
.public-shell{height:100dvh;overflow:auto;background:var(--bg);scroll-behavior:smooth}.public-nav{height:72px;max-width:1200px;margin:auto;padding:0 25px;display:flex;align-items:center;justify-content:space-between}.brand-word{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:-.035em}.brand-logo{width:34px;height:34px;object-fit:contain;filter:brightness(0)}[data-theme=dark] .brand-logo{filter:brightness(0) invert(1)}.landing{max-width:1120px;margin:auto;padding:80px 25px 100px}.hero{text-align:center;max-width:850px;margin:auto}.hero-logo{width:84px;height:84px;object-fit:contain;margin:0 auto 28px;filter:brightness(0)}[data-theme=dark] .hero-logo{filter:brightness(0) invert(1)}.hero h1{font:600 clamp(54px,8vw,92px)/.95 Georgia,serif;letter-spacing:-.065em;margin:0 0 24px}.hero p{max-width:680px;margin:auto;color:var(--text2);font-size:18px}.hero-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:30px 0 90px}.section{margin-top:90px}.section-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:18px}.section-head h2{margin:0;font-size:25px;letter-spacing:-.04em}.eyebrow{font-size:10px;font-weight:850;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin-bottom:7px}.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.feature{border:1px solid var(--border);background:var(--surface);border-radius:15px;padding:22px;min-height:175px;transition:transform .2s ease,border-color .2s ease}.feature:hover{transform:translateY(-3px);border-color:var(--border2)}.feature-icon{width:38px;height:38px;border-radius:10px;background:var(--accentSoft);color:var(--accent);display:grid;place-items:center}.feature h3{font-size:15px;margin:16px 0 7px}.feature p{margin:0;color:var(--muted);font-size:13px}.examples{display:grid;grid-template-columns:1fr 1fr;gap:12px}.example{border:1px solid var(--border);background:var(--surface);border-radius:15px;overflow:hidden}.example-head{padding:14px 16px;border-bottom:1px solid var(--border);font-weight:750}.example-code{min-height:125px;padding:17px;background:var(--surface2);font:12px/1.65 var(--mono);white-space:pre-wrap;color:var(--text2)}.public-footer{max-width:1120px;margin:auto;border-top:1px solid var(--border);padding:24px 25px 45px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:15px}
/* Auth */.auth-screen{height:100dvh;overflow:auto;display:grid;place-items:center;padding:25px}.auth-card{width:min(450px,100%);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:36px;box-shadow:var(--shadow)}.auth-logo{display:block;width:55px;height:55px;object-fit:contain;margin:0 auto 25px;filter:brightness(0)}[data-theme=dark] .auth-logo{filter:brightness(0) invert(1)}.auth-card h1{margin:0;font-size:29px;letter-spacing:-.05em}.auth-card .sub{margin:7px 0 26px;color:var(--muted)}.auth-field{margin:13px 0}.auth-field label{display:block;font-size:11px;font-weight:800;color:var(--text2);margin-bottom:7px}.auth-links{display:flex;justify-content:space-between;margin:10px 0 17px;font-size:11px}.auth-links a{color:var(--accent);font-weight:800}.auth-divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:11px;margin:21px 0}.auth-divider:before,.auth-divider:after{content:"";height:1px;background:var(--border);flex:1}.social-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.social-btn{min-height:46px;border:1px solid var(--border);border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;gap:9px;font-weight:750}.social-btn:hover{background:var(--surface2)}.oauth-logo{width:18px;height:18px}.auth-switch{text-align:center;color:var(--muted);font-size:11px;margin-top:22px}.auth-switch button{background:transparent;color:var(--accent);font-weight:850}.legal{text-align:center;color:var(--muted);font-size:9px;margin-top:27px}
/* App */.app-shell{height:100dvh;display:flex;flex-direction:column}.topbar{height:var(--topbar);flex:0 0 var(--topbar);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:50}.top-left,.top-right{display:flex;align-items:center;gap:9px;min-width:0}.account-chip{display:flex;align-items:center;gap:8px;padding:4px 9px 4px 4px;border:1px solid var(--border);border-radius:999px;background:var(--surface)}.avatar{width:29px;height:29px;border-radius:50%;background:var(--accentSoft);color:var(--accent);display:grid;place-items:center;font-size:10px;font-weight:850;overflow:hidden}.account-name{max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:750}.top-logo{width:31px;height:31px;object-fit:contain;filter:brightness(0)}[data-theme=dark] .top-logo{filter:brightness(0) invert(1)}.workspace{min-height:0;flex:1;display:flex;position:relative}.sidebar{width:var(--sidebar);flex:0 0 var(--sidebar);background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;overflow-x:hidden;padding:14px 12px 25px;overscroll-behavior:contain;z-index:40;scrollbar-gutter:stable;transition:transform .22s ease}.sidebar.right{order:3;border-right:0;border-left:1px solid var(--border)}.sidebar-overlay{display:none;position:fixed;inset:var(--topbar) 0 0;background:rgba(0,0,0,.38);z-index:30}.sidebar-top{padding:3px 4px 14px}.upgrade{width:100%;min-height:43px;border-radius:10px;background:var(--accent);color:var(--bg);font-weight:850}.support-btn{width:100%;min-height:40px;margin-top:8px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);font-weight:700;display: flex;align-items: center;justify-content: center;gap: 8px}.profile-box{border:1px solid var(--border);border-radius:12px;background:var(--surface2);padding:10px;margin:9px 0 17px;display:flex;align-items:center;gap:9px}.profile-meta{min-width:0}.profile-meta strong,.profile-meta span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.profile-meta span{color:var(--muted);font-size:10px}.nav-group{margin:17px 0}.nav-title{padding:0 9px 6px;color:var(--muted);font-size:9px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}.nav-item{width:100%;min-height:38px;padding:0 10px;border-radius:99px;background:transparent;display:flex;align-items:center;gap:10px;text-align:left;color:var(--text2);margin:2px 0;font-weight:650}.nav-item:hover{background:var(--surface2);color:var(--text)}.nav-item.active{background:var(--accentSoft);color:var(--accent)}.nav-icon{width:18px;height:18px;flex:0 0 auto}.logout{margin-top:20px;color:var(--danger)}.main{min-width:0;min-height:0;flex:1;overflow:hidden;background:var(--bg);position:relative}.page{height:100%;overflow-y:auto;overflow-x:hidden;padding:32px 32px 70px;overscroll-behavior:contain;scrollbar-gutter:stable}.page-inner{max-width:1080px;margin:auto}.page-header{margin-bottom:26px}.page-header h1{margin:0;font-size:28px;letter-spacing:-.05em}.page-header p{margin:7px 0 0;color:var(--muted)}

/* Account additions */
.auth-legal{margin-top:22px;text-align:center;color:var(--muted);font-size:10px;line-height:1.7}
.auth-legal a{color:var(--accent);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.icon-btn.has-unread{position:relative}
.icon-btn.has-unread::after{content:"";position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--danger);border:2px solid var(--surface)}
.survey-btn{position:relative}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.48);display:grid;place-items:center;padding:18px;z-index:120}
.modal-card{width:min(520px,100%);max-height:min(88dvh,720px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:22px}
.modal-card h2{margin:0;font-size:22px;letter-spacing:-.04em}
.modal-card p{color:var(--muted);font-size:12px}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:12px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.danger-zone{border-color:color-mix(in srgb,var(--danger) 35%,var(--border))}
.danger-zone h3{color:var(--danger)}
.legal-links{display:grid;gap:8px}
.legal-link{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:42px;padding:0 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);font-size:12px;font-weight:750}
.legal-link:hover{border-color:var(--border2)}
.referral-card{grid-column:1/-1}
.referral-row{display:flex;gap:8px;align-items:center}
.referral-display{flex:1;min-width:0;height:44px;padding:0 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);display:flex;align-items:center;overflow:hidden}
.referral-display code{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:12px var(--mono)}
.priority-value{color:var(--gold)}
.survey-question{margin-top:14px}
.survey-question label{display:block;font-size:11px;font-weight:800;margin-bottom:6px}
.survey-question .input,.survey-question .textarea{background:var(--surface2)}
.notification.unread{background:var(--accentSoft)}
@media(max-width:520px){
  .referral-row{align-items:stretch}
  .referral-row .btn{padding:0 12px}
  .modal-card{padding:18px}
}

/* Tables/settings */.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.settings-card{border:1px solid var(--border);background:var(--surface);border-radius:15px;padding:18px}.settings-card h3{margin:0 0 5px;font-size:14px}.settings-card p{margin:0 0 15px;color:var(--muted);font-size:12px}.setting-row{min-height:49px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:15px}.setting-row:first-of-type{border-top:0}.segmented{display:flex;border:1px solid var(--border);border-radius:9px;padding:3px;background:var(--surface2)}.segmented button{padding:7px 10px;border-radius:7px;background:transparent;font-size:11px;font-weight:850}.segmented button.active{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.08);color:var(--accent)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:13px}.stat{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:16px}.stat span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.09em;font-weight:850}.stat strong{display:block;font-size:22px;margin-top:4px;letter-spacing:-.03em}.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px}th,td{padding:12px 14px;border-bottom:1px solid var(--border);text-align:left;font-size:11px}th{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.08em}tr:last-child td{border-bottom:0}.usage-costs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.cost-card{padding:13px;border:1px solid var(--border);border-radius:10px;background:var(--surface2);display:flex;justify-content:space-between;gap:10px}.cost-card strong{font-size:12px}.cost-card span{font-weight:850;color:var(--gold)}
/* Menus */.dropdown-menu{position:fixed;min-width:215px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);z-index:70;padding:5px;animation:panelIn .15s ease both}.dropdown-option{width:100%;min-height:40px;border-radius:8px;background:transparent;padding:0 10px;display:flex;align-items:center;justify-content:space-between;text-align:left}.dropdown-option:hover{background:var(--surface2)}.dropdown-option.active{background:var(--accentSoft);color:var(--accent);font-weight:850}.format-drawer{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(760px,calc(100vw - 28px));max-height:min(70dvh,500px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:17px;box-shadow:var(--shadow);z-index:65;padding:15px;animation:drawerIn .2s ease both}.format-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}.format-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.format-card{border:1px solid var(--border);border-radius:11px;background:var(--surface2);padding:13px;text-align:left;min-height:112px;position:relative}.format-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accentSoft) inset}.format-card strong{display:block;font-size:12px}.format-card small{display:block;color:var(--muted);margin-top:3px;font-size:10px}.wire{margin-top:10px;height:38px;border:1px solid var(--border);border-radius:7px;padding:6px;display:flex;flex-direction:column;gap:4px}.wire i{height:4px;background:var(--border2);border-radius:3px}.wire i:nth-child(2){width:72%}.wire i:nth-child(3){width:52%}.floating-panel{position:fixed;top:calc(var(--topbar) + 9px);right:14px;width:min(340px,calc(100vw - 28px));background:var(--surface);border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow);z-index:60;overflow:hidden;animation:panelIn .18s ease both}.floating-head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;justif async function handleAuthCallback() {
  if (!supabaseClient) return;
  
  // Check if we have a hash with access_token (OAuth redirect)
  const hash = window.location.hash;
  if (hash && hash.includes('access_token')) {
    try {
      const params = new URLSearchParams(hash.substring(1));
      const accessToken = params.get('access_token');
      const refreshToken = params.get('refresh_token');
      
      if (accessToken) {
        // Set the session manually
        const { data, error } = await supabaseClient.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        });
        
        if (error) {
          console.error('Session error:', error);
          notify('Authentication error', error.message);
          return;
        }
        
        if (data && data.session) {
          const user = data.session.user;
          // Update state
          state.user = {
            name: user.user_metadata.full_name || user.email,
            username: localStorage.getItem('reclaire_username') || user.user_metadata.user_name || user.email?.split('@')[0] || '',
            email: user.email,
            avatar: user.user_metadata.avatar_url,
            id: user.id
          };
          state.screen = 'app';
          state.page = 'playground';
          
          // Clean up the URL
          window.history.replaceState(null, '', window.location.pathname);
          
          // Load account and render
          await loadAccount();
          render();
          notify('Welcome', `Signed in as ${state.user.username || state.user.email}`);
        }
      }
    } catch (e) {
      console.error('OAuth callback error:', e);
      notify('Authentication failed', e.message);
    }
  }
  
  // Also check for existing session (in case user is already logged in)
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session && session.user && !state.user) {
      state.user = {
        name: session.user.user_metadata.full_name || session.user.email,
        username: localStorage.getItem('reclaire_username') || session.user.user_metadata.user_name || session.user.email?.split('@')[0] || '',
        email: session.user.email,
        avatar: session.user.user_metadata.avatar_url,
        id: session.user.id
      };
      state.screen = 'app';
      state.page = 'playground';
      await loadAccount();
      render();
    }
  } catch (e) {
    console.error('Session check error:', e);
  }
}

      ...(state.user||{}),

async function auth(mode,f){
  const username=String(f.get('username')||'').trim();
  const referrerId=String(f.get('referrer_id')||'').trim()||new URLSearchParams(window.location.search).get('ref')||null;
  const body=JSON.stringify({
    email:f.get('email'),
    password:f.get('password'),
    ...(mode==='register'&&username?{username}:{}),
    ...(mode==='register'&&referrerId?{referrer_id:referrerId}:{})
  });
  const d=await api(`/auth/${mode}`,{method:'POST',body});
  state.apiKey=d.api_key;
  localStorage.setItem('reclaire_api_key',d.api_key);
  if(username)localStorage.setItem('reclaire_username',username);
  state.user={...d.user,username:d.user?.username||username||localStorage.getItem('reclaire_username')||'',tokens:Number(d.tokens_remaining||0),created_at:new Date().toISOString()};
  state.referralId=d.referral_id||d.user?.id||state.referralId||'';
  if(state.referralId)localStorage.setItem('reclaire_referral_id',state.referralId);
  state.screen='app';
  state.page='playground';
  render();
  await loadAccount();
  if(mode==='register'){
    addNotification('Welcome to ReClaire','You have received 100 tokens to get started.');
    notify('Account created','100 tokens have been added to your account.');
  }else{
    notify('Welcome back','You are signed in.');
  }
  render();
}

async function handleOAuth(provider) {
  if (supabaseClient) {
    const redirectUrl = window.location.origin + window.location.pathname;
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: provider,
      options: { 
        redirectTo: redirectUrl
      }
    });
    if (error) {
      notify('OAuth error', error.message);
      console.error('OAuth error:', error);
    }
  } else if (SUPABASE_URL) {
    const redirectUrl = encodeURIComponent(window.location.origin + window.location.pathname);
    window.location.href = `${SUPABASE_URL}/auth/v1/authorize?provider=${provider}&redirect_to=${redirectUrl}`;
  } else {
    notify('OAuth setup', `Configured provider: ${provider}. Set SUPABASE_URL in project environment.`);
  }
}

n','# Page title\n\n## Main content\nClean, readable page content.')}${example('Structured JSON','{\n  "summary": "…",\n  "key_facts": ["…"]\n}')}${example('Site map','https://example.com/\nhttps://example.com/docs\nhttps://example.com/about')}${example('AI answer','Question\nWhat is this page about?\n\nAnswer\nA focused answer grounded in page content.')}</div></section></main><footer class="public-footer"><span>ReClaire · Web intelligence engine</span><span>FastAPI · Playwright · Gemini · Supabase</span></footer></div>`}

function renderAuth(mode='login'){const reg=mode==='register';return `<div class="auth-screen"><section class="auth-card">${logoImg('auth-logo')}<h1>${reg?'Create your account':'Sign in'}</h1><p class="sub">${reg?'Start with your ReClaire workspace.':'Welcome back to ReClaire.'}</p><form id="authForm">${reg?`<div class="auth-field"><label>Username</label><input class="input" name="username" type="text" minlength="3" maxlength="50" autocomplete="username" required placeholder="Choose a username"></div>`:''}<div class="auth-field"><label>Email address</label><input class="input" name="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="auth-field"><label>Password</label><input class="input" name="password" type="password" autocomplete="${reg?'new-password':'current-password'}" required placeholder="Enter your password"></div>${!reg?`<div class="auth-links"><span></span><a href="#" data-action="forgot">Forgot password?</a></div>`:''}<button class="btn primary" type="submit" style="width:100%">${reg?'Create account':'Login'}</button></form><div class="auth-divider">or</div><div class="social-grid"><button class="social-btn" data-action="oauth" data-provider="google"><svg class="oauth-logo" viewBox="0 0 24 24" aria-label="Google"><path fill="#4285F4" d="M21.35 12.27c0-.72-.06-1.42-.18-2.09H12v3.96h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.26Z"/><path fill="#34A853" d="M12 21.5c2.64 0 4.86-.87 6.48-2.36l-3.14-2.45c-.87.58-1.98.92-3.34.92-2.56 0-4.73-1.73-5.51-4.06H3.25V16.1A9.78 9.78 0 0 0 12 21.5Z"/><path fill="#FBBC05" d="M6.49 13.55A5.87 5.87 0 0 1 6.18 12c0-.54.11-1.06.31-1.55V8H3.25A9.76 9.76 0 0 0 2.2 12c0 1.57.38 3.06 1.05 4.37l3.24-2.82Z"/><path fill="#EA4335" d="M12 6.39c1.44 0 2.73.5 3.75 1.48l2.81-2.81C16.85 3.42 14.64 2.5 12 2.5a9.78 9.78 0 0 0-8.75 5.5l3.24 2.95C7.27 8.12 9.44 6.39 12 6.39Z"/></svg>Google</button><button class="social-btn" data-action="oauth" data-provider="github"><svg class="oauth-logo" viewBox="0 0 24 24" aria-label="GitHub"><path fill="currentColor" d="M12 .5A11.5 11.5 0 0 0 8.36 22.4c.58.1.79-.25.79-.56v-2.18c-3.23.7-3.91-1.56-3.91-1.56-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.58-.29-5.29-1.29-5.29-5.74 0-1.27.45-2.31 1.19-3.12-.12-.29-.52-1.48.11-3.08 0 0 .97-.31 3.18 1.19a11.06 11.06 0 0 1 5.79 0c2.21-1.5 3.18-1.19 3.18-1.19.63 1.6.23 2.79.11 3.08.74.81.11 2.79.11 3.08.74.81 1.19 1.85 1.19 3.12 0 4.46-2.71 5.45-5.3 5.74.42.36.78 1.07.78 2.16v3.2c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg>GitHub</button></div><div class="auth-switch">${reg?`Already have an account? <button data-auth-mode="login">Sign in</button>`:`New user? <button data-auth-mode="register">Create an account</button>`}</div><div style="margin-top:18px;text-align:center"><button class="btn ghost" data-action="skip-auth" style="width:100%;color:var(--muted);font-size:12px">Skip sign in →</button></div><div class="auth-legal">By continuing, you agree to ReClaire's <a href="terms.html" target="_blank" rel="noopener">Terms of Service</a> and <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</div></section></div>`}
function renderPlayground(){const q=state.formats.includes('questions')&&state.mode==='scrape';const showFormat = state.mode!=='map';return `<div class="playground"><div class="playground-inner"><section class="main-brand">${logoImg('')}<h1>Turn URLs into useful data.</h1><p>Choose an operation, enter a URL, select the output you need, then execute.</p></section><section class="input-panel"><div class="input-label">Input</div><div class="input-row ${!showFormat?'no-format':''}"><button class="custom-select" data-dropdown="mode"><span style="display:flex;align-items:center;gap:8px">${modes.find(m=>m.id===state.mode).icon}${modes.find(m=>m.id===state.mode).label}</span>${icons.chevron}</button><div class="url-shell"><span class="url-prefix">https://</span><input id="urlInput" class="url-input" value="${esc(state.url.replace(/^https?:\/\//i,''))}" placeholder="Enter a website URL"></div>${showFormat?`<button class="format-trigger" data-action="open-format">${icons.file}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(selectedLabel())}</span>${icons.chevron}</button>`:''}</div>${q?`<div class="question-wrap"><input id="questionInput" class="question-input" value="${esc(state.question)}" placeholder="Ask a question about this page"></div>`:''}${state.mode==='scrape'?`<button class="batch-trigger" data-action="toggle-batch">${state.batchOpen?'Close batch scrape':'Batch scrape'}</button>${state.batchOpen?renderBatch():''}`:''}<div class="panel-foot"><span>${state.mode==='map'?'Discover links on the target domain.':state.mode==='crawl'?'Crawl same-domain pages.':'Select one or more supported output formats.'}</span><span class="multi-count">${state.mode!=='map'&&state.formats.length>1?`${state.formats.length} selected`:''}</span></div><button class="execute" style="margin-top:8px" data-action="execute">${actionLabel()}</button></section><div class="output-area">${renderResult()}</div>${renderRecent()}</div></div>${state.formatDrawer?renderFormatDrawer():''}${state.dropdown==='mode'?renderModeDropdown():''}`}
function renderModeDropdown(){return `<div class="dropdown-menu" id="modeDropdown">${modes.map(m=>`<button class="dropdown-option ${state.mode===m.id?'active':''}" data-mode="${m.id}"><span style="display:flex;align-items:center;gap:8px">${m.icon}${m.label}</span>${state.mode===m.id?icons.check:''}</button>`).join('')}</div>`}
function renderFormatDrawer(){return `<div class="format-drawer"><div class="format-head"><div><strong>Choose output format</strong><div class="muted" style="font-size:10px">Supported by the current backend.</div></div><button class="icon-btn" style="width:34px;height:34px" data-action="close-format">×</button></div><div class="format-grid">${formats.map(f=>`<button class="format-card ${state.formats.includes(f.id)?'selected':''}" data-format="${f.id}"><strong>${esc(f.label)}</strong><small>${esc(f.desc)}</small><div class="wire"><i></i><i></i><i></i></div>${state.formats.includes(f.id)?`<span style="position:absolute;right:9px;top:9px;color:var(--accent)">${icons.check}</span>`:''}</button>`).join('')}</div></div>`}
function renderResult(){if(state.loading)return`<div class="output-empty"><div><div style="font-weight:750;color:var(--text)">Processing request</div><div style="margin-top:5px">ReClaire is fetching and transforming the page.</div></div></div>`;if(!state.result)return`<div class="output-empty"><div><strong style="display:block;color:var(--text);margin-bottom:5px">Your output will appear here.</strong><span>Run a scrape, crawl or map operation to see the result.</span></div></div>`;if(state.result.error)return`<div class="result-card"><div class="result-head"><strong>Request error</strong></div><div class="result-body">${esc(state.result.error)}</div></div>`;return state.mode==='map'?renderMapResult(state.result):state.mode==='crawl'?renderCrawlResult(state.result):renderScrapeResult(state.result)}
function outputActions(text){if(!text)return'';return `<div class="result-actions"><button class="btn" data-action="download-md">${icons.download} Download .md file</button><button class="btn" data-action="copy-md">${icons.copy} Copy Markdown</button><button class="btn" data-action="copy-output">${icons.copy} Copy output</button></div>`}
function renderScrapeResult(r){const b=[];if(r.summary)b.push(`<div class="result-card"><div class="result-head"><strong>AI summary</strong><span class="muted">${esc(r.url||'')}</span></div><div class="result-body ai-output">${renderMd(r.summary)}${outputActions(r.summary)}</div></div>`);if(r.answer)b.push(`<div class="result-card"><div class="result-head"><strong>AI answer</strong><span class="muted">Q&A</span></div><div class="result-body ai-output">${renderMd(r.answer)}${outputActions(r.answer)}</div></div>`);if(r.markdown)b.push(`<div class="result-card"><div class="result-head"><strong>Markdown</strong><span class="muted">${esc(r.url||'')}</span></div><div class="result-body"><pre class="code-box">${esc(r.markdown)}</pre>${outputActions(r.markdown)}</div></div>`);if(r.html)b.push(`<div class="result-card"><div class="result-head"><strong>HTML</strong></div><div class="result-body"><pre class="code-box">${esc(r.html)}</pre>${outputActions(r.html)}</div></div>`);if(r.raw_html)b.push(`<div class="result-card"><div class="result-head"><strong>Raw HTML</strong></div><div class="result-body"><pre class="code-box">${esc(r.raw_html)}</pre>${outputActions(r.raw_html)}</div></div>`);if(r.json)b.push(`<div class="result-card"><div class="result-head"><strong>Structured JSON</strong></div><div class="result-body"><pre class="code-box">${esc(JSON.stringify(r.json,null,2))}</pre>${outputActions(JSON.stringify(r.json,null,2))}</div></div>`);return `<div style="display:grid;gap:12px">${b.join('')}</div>`}
function renderMapResult(r){const text=(r.links||[]).join('\n');return `<div class="result-card"><div class="result-head"><strong>Site map</strong><span class="muted">${(r.links||[]).length} links</span></div><div class="result-body"><pre class="code-box">${esc(text||'No links found.')}</pre>${outputActions(text)}</div></div>`}
function renderCrawlResult(r){const rows=(r.data||[]).map(x=>`<div class="recent-item"><div class="task"><strong>${esc(x.url||'Page')}</strong><span>${esc(x.status||'')}</span></div><span class="cost">${esc(x.status||'')}</span></div>`).join('');const md=(r.data||[]).filter(x=>x.status==='success').map(x=>`# ${x.url}\n\n${x.markdown||''}`).join('\n\n---\n\n');return `<div class="result-card"><div class="result-head"><strong>Crawl complete</strong><span class="muted">${(r.data||[]).length} pages</span></div><div class="result-body"><div style="display:grid;gap:7px">${rows||'No pages returned.'}</div>${outputActions(md)}</div></div>`}
function renderRecent(){const tx=state.logs||[];if(!tx.length)return'';return `<section class="recent"><h3>Recent activity</h3><div class="recent-list">${tx.slice(0,5).map(x=>`<div class="recent-item"><div class="task"><strong>${esc(x.endpoint||'Activity')}</strong><span>${esc(new Date(x.created_at).toLocaleString())}</span></div><span class="cost">-${Number(x.tokens_deducted||0)} tokens</span></div>`).join('')}</div></section>`}
function renderBatch(){if(!state.batchRows.length)state.batchRows=Array.from({length:10},()=>({url:'',status:'idle'}));return `<div class="batch-panel"><div class="batch-head"><div><h3>Batch scrape</h3><div class="batch-meta">Up to 10 URLs · Markdown only · results stay hidden</div></div><button class="btn primary" data-action="start-batch" ${state.batchRunning?'disabled':''}>${state.batchRunning?'Scraping…':'Start scrape'}</button></div><div class="batch-rows">${state.batchRows.map((r,i)=>`<div class="batch-row"><span class="batch-num">${String(i+1).padStart(2,'0')}</span><input class="input batch-url" data-batch-index="${i}" value="${esc(r.url)}" placeholder="https://example.com/page"><span class="batch-status" title="${r.status==='complete'?'Complete':r.status==='failed'?'Failed':'Waiting'}">${r.status==='complete'?icons.check:r.status==='failed'?'×':''}</span></div>`).join('')}</div><div class="batch-actions"><span class="batch-note">${state.batchRunning?'Submitting batch…':state.batchId?'Completed rows can be downloaded as a ZIP.':'Enter only the rows you need.'}</span><button class="btn batch-download" data-action="download-batch" ${state.batchId&&state.batchRows.some(x=>x.status==='complete')?'':'disabled'}>${icons.download} Download batch Markdown</button></div></div>`}
async function execute(){if(state.loading)return;const u=state.url.trim();if(!u){notify('URL required','Enter a valid website URL.');return}if(state.formats.includes('questions')&&state.mode==='scrape'&&!state.question.trim()){notify('Question required','Enter a question for the Q&A format.');return}state.loading=true;state.result=null;render();try{let d;if(state.mode==='scrape')d=await api('/v1/scrape',{method:'POST',body:JSON.stringify({url:u,formats:state.formats,user_question:state.question||null,use_js_fallback:true,only_main_content:true})});else if(state.mode==='map')d=await api('/v1/map',{method:'POST',body:JSON.stringify({url:u,limit:100,include_subdomains:false})});else d=await api('/v1/crawl',{method:'POST',body:JSON.stringify({url:u,limit:5,scrape_options:{url:u,formats:state.formats,user_question:state.question||null,use_js_fallback:true,only_main_content:true}})});state.result=d;await loadAccount();notify('Complete',`${d.tokens_deducted||1} token(s) used.`)}catch(e){state.result={error:e.message};notify('Request failed',e.message)}finally{state.loading=false;render()}}
async function batchScrape(){if(state.batchRunning)return;const active=state.batchRows.map((x,i)=>({x,i})).filter(o=>o.x.url.trim());const urls=active.map(o=>o.x.url.trim());if(!urls.length){notify('URLs required','Add at least one URL to the batch.');return}state.batchRunning=true;state.batchId=null;state.batchRows.forEach(x=>x.status=x.url.trim()?'idle':'idle');render();try{const d=await api('/v1/batch-scrape',{method:'POST',body:JSON.stringify({urls,formats:['markdown'],use_js_fallback:true,only_main_content:true})});state.batchId=d.batch_id;(d.rows||[]).forEach((r,i)=>{const pos=active[r.index??i]?.i;const row=state.batchRows[pos];if(row)row.status=r.status});await loadAccount();notify('Batch complete',`${d.completed} of ${d.total} page(s) scraped successfully.`)}catch(e){notify('Batch failed',e.message)}finally{state.batchRunning=false;render()}}
async function downloadBatch(){if(!state.batchId)return;try{const r=await fetch(API_BASE+`/v1/batch-scrape/${state.batchId}/download`,{headers:{'X-API-Key':state.apiKey}});if(!r.ok)throw Error((await r.json().catch(()=>({}))).detail||'Batch download failed.');const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`reclaire-batch-${state.batchId.slice(0,8)}.zip`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){notify('Download failed',e.message)}}
function downloadText(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/markdown'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function currentOutput(){const r=state.result;if(!r)return'';if(r.markdown)return r.markdown;if(r.summary)return r.summary;if(r.answer)return r.answer;if(r.json)return JSON.stringify(r.json,null,2);if(r.html)return r.html;if(r.raw_html)return r.raw_html;if(r.links)return r.links.join('\n');return JSON.stringify(r,null,2)}
function renderActivity(){return `<div class="page"><div class="page-inner"><header class="page-header"><div class="eyebrow">Account</div><h1>Activity logs</h1><p>Recent authenticated operations and token deductions.</p></header><div class="table-wrap"><table><thead><tr><th>Endpoint</th><th>Tokens</th><th>Timestamp</th></tr></thead><tbody>${state.logs.length?state.logs.map(x=>`<tr><td>${esc(x.endpoint)}</td><td style="font-weight:850;color:var(--gold)">${Number(x.tokens_deducted||0)}</td><td>${esc(new Date(x.created_at).toLocaleString())}</td></tr>`).join(''):`<tr><td colspan="3" class="muted">No activity yet.</td></tr>`}</tbody></table></div></div></div>`}

function renderApi(){
  const maskedKey = state.apiKey ? state.apiKey.slice(0, 3) + '••••••••••••••••' : 'No active key';
  return `<div class="page"><div class="page-inner"><header class="page-header"><div class="eyebrow">Account</div><h1>API keys</h1><p>Your active ReClaire API credential and backend cURL guides.</p></header><section class="settings-card"><h3>Active API key</h3><p>The backend issues one active key per account. Signing in again rotates it.</p><div style="display:flex;gap:8px"><input class="input mono" readonly value="${esc(maskedKey)}" id="apiKeyValue"><button class="btn" data-action="copy-key">${icons.copy} Copy Key</button></div></section><section class="settings-card" style="margin-top:12px"><h3>Backend connection</h3><p>Used by this frontend for API requests.</p><div style="display:flex;gap:8px"><input id="apiBaseInput" class="input" value="${esc(API_BASE)}"><button class="btn primary" data-action="save-api-base">Save</button></div></section><section class="settings-card" style="margin-top:12px"><h3>API Usage & Examples</h3><p>cURL snippets for sending backend API requests directly.</p><div class="curl-section"><div class="curl-title">1. Standard Static Scrape (1 token):</div><pre class="code-box">curl -X POST "${API_BASE}/v1/scrape" \\
  -H "Authorization: Bearer YOUR_RECLAIRE_API_KEY" \\
  -H "Content-Type: application/json" \\
  -d '{
    "url": "https://example.com"
  }'</pre></div><div class="curl-section"><div class="curl-title">2. Dynamic Scrape with Playwright Fallback (3 tokens):</div><pre class="code-box">curl -X POST "${API_BASE}/v1/scrape" \\
  -H "Authorization: Bearer YOUR_RECLAIRE_API_KEY" \\
  -H "Content-Type: application/json" \\
  -d '{
    "url": "https://example.com",
    "use_js_fallback": true
  }'</pre></div><div class="curl-section"><div class="curl-title">3. Scrape with AI Summary (+2 extra tokens):</div><pre class="code-box">curl -X POST "${API_BASE}/v1/scrape" \\
  -H "Authorization: Bearer YOUR_RECLAIRE_API_KEY" \\
  -H "Content-Type: application/json" \\
  -d '{
    "url": "https://example.com",
    "formats": ["markdown", "summary"]
  }'</pre></div><div class="curl-section"><div class="curl-title">4. Map Site Links ( /v1/map ) — (1 token)</div><pre class="code-box">curl -X POST "${API_BASE}/v1/map" \\
  -H "Authorization: Bearer YOUR_RECLAIRE_API_KEY" \\
  -H "Content-Type: application/json" \\
  -d '{
    "url": "https://example.com"
  }'</pre></div><div class="curl-section"><div class="curl-title">5. Crawl Entire Site ( /v1/crawl ) — (1 token per discovered page)</div><pre class="code-box">curl -X POST "${API_BASE}/v1/crawl" \\
  -H "Authorization: Bearer YOUR_RECLAIRE_API_KEY" \\
  -H "Content-Type: application/json" \\
  -d '{
    "url": "https://example.com",
    "max_depth": 2
  }'</pre></div></section></div></div>`
}
function renderSupport(){
  return `<div class="page"><div class="page-inner"><header class="page-header"><div class="eyebrow">Support</div><h1>Feedback & Help</h1><p>Send feedback or reach out directly to the ReClaire team.</p></header><section class="settings-card"><h3>Send Feedback</h3><p>Have questions, feature requests, or bugs? Let us know.</p><form id="supportForm"><div class="auth-field"><label>Your Email</label><input class="input" name="supportEmail" type="email" value="${esc(state.user?.email||'')}" required placeholder="you@example.com"></div><div class="auth-field"><label>Subject</label><input class="input" name="supportSubject" type="text" required placeholder="Feedback regarding..."></div><div class="auth-field"><label>Message</label><textarea class="textarea" name="supportMessage" required placeholder="Describe your experience or feedback..."></textarea></div><button class="btn primary" type="submit" style="margin-top:10px">Send via Email</button></form><div style="margin-top:20px;font-size:12px;" class="muted">Or contact us directly at <a href="mailto:reclaire.support@gmail.com" style="color:var(--accent);font-weight:700">reclaire.support@gmail.com</a></div></section></div></div>`;
}
function renderSettings(){
  const dark=state.theme==='dark';
  return `<div class="page"><div class="page-inner">
    <header class="page-header"><div class="eyebrow">Account</div><h1>Settings</h1><p>Appearance and navigation preferences are stored locally.</p></header>
    <div class="settings-grid">
      <section class="settings-card">
        <h3>Appearance</h3><p>Theme changes snap instantly.</p>
        <div class="setting-row"><span>Theme</span><div class="segmented"><button class="${!dark?'active':''}" data-theme-set="light">${icons.sun} Light</button><button class="${dark?'active':''}" data-theme-set="dark">${icons.moon} Dark</button></div></div>
      </section>
      <section class="settings-card">
        <h3>Navigation</h3><p>Choose the side containing persistent navigation.</p>
        <div class="setting-row"><span>Sidebar side</span><div class="segmented"><button class="${state.sidebarSide==='left'?'active':''}" data-side-set="left">Left</button><button class="${state.sidebarSide==='right'?'active':''}" data-side-set="right">Right</button></div></div>
      </section>
      <section class="settings-card">
        <h3>Workspace behavior</h3><p>Independent scroll containers keep navigation stable.</p>
        <div class="setting-row"><span>Independent scrolling</span><strong>Enabled</strong></div>
        <div class="setting-row"><span>Typing hints</span><strong>Enabled</strong></div>
      </section>
      <section class="settings-card">
        <h3>Account</h3><p>${esc(state.user?.email||'No email')}</p>
        <div class="setting-row"><span>Username</span><strong>${esc(state.user?.username||'—')}</strong></div>
        <div class="setting-row"><span>User ID</span><strong class="mono" style="font-size:9px">${esc(state.user?.id||'—')}</strong></div>
        <div class="setting-row"><span>Token balance</span><strong>${Number(state.user?.tokens||0)}</strong></div>
        <div class="setting-row"><span>Priority points</span><strong class="priority-value">${Number(state.priorityPoints||0)}</strong></div>
      </section>
      <section class="settings-card">
        <h3>Legal</h3><p>Review the documents governing use of ReClaire.</p>
        <div class="legal-links">
          <a class="legal-link" href="privacy.html" target="_blank" rel="noopener"><span>Privacy Policy</span>${icons.external}</a>
          <a class="legal-link" href="terms.html" target="_blank" rel="noopener"><span>Terms of Service</span>${icons.external}</a>
        </div>
      </section>
      <section class="settings-card danger-zone">
        <h3>Danger zone</h3><p>Permanently delete your ReClaire account and associated account data.</p>
        <button class="btn danger" data-action="delete-account">${icons.trash} Delete account</button>
      </section>
    </div>
  </div></div>`
}

function renderPage(){if(['playground','map','crawl'].includes(state.page)){if(state.page!=='playground')state.mode=state.page;return renderPlayground()}if(state.page==='support')return renderSupport();return state.page==='activity'?renderActivity():state.page==='usage'?renderUsage():state.page==='api'?renderApi():renderSettings()}
function renderNotifications(){
  if(!state.notificationsOpen)return'';
  const items=[...(state.notifications||[]),...(state.logs||[]).slice(0,5).map(x=>({title:x.endpoint||'Token activity',message:`${Number(x.tokens_deducted||0)} token(s) used`,created_at:x.created_at,read:true}))];
  return `<div class="floating-panel"><div class="floating-head"><strong>Notifications</strong><button class="icon-btn" style="width:30px;height:30px" data-action="close-overlays">×</button></div><div class="notification-list">${items.length?items.slice(0,10).map(x=>`<div class="notification ${x.read?'':'unread'}"><i class="notification-dot" style="${x.read?'opacity:.25':''}"></i><div><strong>${esc(x.title||'Notification')}</strong><span>${esc(x.message||'')}</span></div></div>`).join(''):`<div class="notification"><i class="notification-dot" style="opacity:.25"></i><div><strong>No notifications</strong><span>You are all caught up.</span></div></div>`}</div></div>`
}

function renderApp(){return `<div class="app-shell">${renderTopbar()}<div class="workspace">${renderSidebar()}<main class="main">${renderPage()}${renderNotifications()}</main></div>${renderSurveyModal()}${renderDeleteModal()}</div>`}
function render(){document.body.dataset.theme=state.theme;$('#app').innerHTML=state.screen==='landing'?renderLanding():state.screen==='auth'?renderAuth(state.authMode):renderApp();bind();if(state.screen==='app')startTypingHints()}
function startTypingHints(){state.animatedTimers.forEach(clearTimeout);state.animatedTimers=[];for(const {el,list} of [{el:$('#urlInput'),list:urlHints},{el:$('#questionInput'),list:questionHints}]){if(!el||el.value)continue;let n=0,i=0,del=false;const tick=()=>{if(!document.body.contains(el)||el.value)return;const target=list[n%list.length];if(!del){el.placeholder=target.slice(0,++i);if(i>=target.length){del=true;state.animatedTimers.push(setTimeout(tick,2000));return}}else{el.placeholder=target.slice(0,--i);if(i<=0){del=false;n++;state.animatedTimers.push(setTimeout(tick,500));return}}state.animatedTimers.push(setTimeout(tick,del?35:45))};state.animatedTimers.push(setTimeout(tick,600))}}
function bind(){
  $$('[data-screen]').forEach(b=>b.onclick=()=>{state.screen=b.dataset.screen;state.authMode=b.dataset.authMode||'login';render()});
  $$('[data-auth-mode]').forEach(b=>b.onclick=()=>{state.screen='auth';state.authMode=b.dataset.authMode;render()});
  const af=$('#authForm');
  if(af)af.onsubmit=async e=>{e.preventDefault();try{await auth(state.authMode,new FormData(af))}catch(x){notify('Authentication failed',x.message)}};
  const sf=$('#supportForm');
  if(sf)sf.onsubmit=e=>{e.preventDefault();const fd=new FormData(sf);const subj=encodeURIComponent(fd.get('supportSubject'));const msg=encodeURIComponent(fd.get('supportMessage'));window.location.href=`mailto:reclaire.support@gmail.com?subject=${subj}&body=${msg}`;notify('Feedback ready','Opening email client to send your message.')};
  $$('[data-action=oauth]').forEach(b=>b.onclick=()=>handleOAuth(b.dataset.provider));
  $$('[data-action=forgot]').forEach(b=>b.onclick=e=>{e.preventDefault();notify('Password reset unavailable','The current backend does not expose password reset yet.')});
  $$('[data-page]').forEach(b=>b.onclick=()=>openPage(b.dataset.page));
  $('#sidebarBtn')?.addEventListener('click',toggleSidebar);
  $('#sidebarOverlay')?.addEventListener('click',()=>{state.sidebarOpen=false;render()});
  $('#notificationBtn')?.addEventListener('click',()=>{state.notificationsOpen=!state.notificationsOpen;if(state.notificationsOpen)markNotificationsRead();render()});
  $('#surveyBtn')?.addEventListener('click',()=>{state.surveyOpen=true;state.notificationsOpen=false;render()});
  $$('[data-action=close-overlays]').forEach(b=>b.onclick=()=>{state.notificationsOpen=false;render()});
  $$('[data-action=logout]').forEach(b=>b.onclick=logout);
  $$('[data-action=skip-auth]').forEach(b=>b.onclick=()=>{state.screen='app';state.page='playground';state.user={username:'Guest',email:'guest@demo.local',tokens:9999,created_at:new Date().toISOString()};render();notify('Guest mode','You are browsing in preview mode. API calls require sign-in.')});
  $$('[data-action=support]').forEach(b=>b.onclick=()=>openPage('support'));
  $$('[data-action=upgrade]').forEach(b=>b.onclick=()=>notify('Plans','Billing is not implemented by the current backend.'));
  $('#urlInput')?.addEventListener('input',e=>state.url=e.target.value);
  $('#questionInput')?.addEventListener('input',e=>state.question=e.target.value);
  $('[data-dropdown=mode]')?.addEventListener('click',()=>{state.dropdown=state.dropdown==='mode'?null:'mode';render();if(state.dropdown)setTimeout(positionDropdown,0)});
  $$('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;state.dropdown=null;if(state.mode==='map')state.formats=['markdown'];render()});
  $('[data-action=open-format]')?.addEventListener('click',()=>{state.formatDrawer=true;state.dropdown=null;render()});
  $('[data-action=close-format]')?.addEventListener('click',()=>{state.formatDrawer=false;render()});
  $$('[data-format]').forEach(b=>b.onclick=()=>{const id=b.dataset.format;if(state.formats.includes(id)){if(state.formats.length>1)state.formats=state.formats.filter(x=>x!==id)}else state.formats.push(id);render()});
  $('[data-action=execute]')?.addEventListener('click',execute);
  $('[data-action=toggle-batch]')?.addEventListener('click',()=>{state.batchOpen=!state.batchOpen;render()});
  $$('.batch-url').forEach(b=>b.oninput=()=>state.batchRows[Number(b.dataset.batchIndex)].url=b.value);
  $('[data-action=start-batch]')?.addEventListener('click',batchScrape);
  $('[data-action=download-batch]')?.addEventListener('click',downloadBatch);
  $$('[data-action=download-md]').forEach(b=>b.onclick=()=>downloadText('reclaire-output.md',currentOutput()));
  $$('[data-action=copy-md], [data-action=copy-output]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(currentOutput());notify('Copied','Output copied to clipboard.')}catch{notify('Copy failed','Clipboard access was unavailable.')}});
  $$('[data-theme-set]').forEach(b=>b.onclick=()=>{setTheme(b.dataset.themeSet);render()});
  $$('[data-side-set]').forEach(b=>b.onclick=()=>{state.sidebarSide=b.dataset.sideSet;localStorage.setItem('reclaire_sidebar_side',state.sidebarSide);state.sidebarOpen=false;render()});
  $('[data-action=grant-demo]')?.addEventListener('click',async()=>{try{const d=await api('/v1/testing/grant',{method:'POST'});state.user.tokens=d.tokens_remaining;await loadAccount();notify('Tokens granted',`${d.tokens_granted} test tokens added.`);render()}catch(e){notify('Grant unavailable',e.message)}});
  $('[data-action=copy-key]')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(state.apiKey);notify('Copied','API key copied.')}catch{notify('Copy failed','Clipboard access was unavailable.')}});
  $('[data-action=save-api-base]')?.addEventListener('click',async()=>{API_BASE=($('#apiBaseInput')?.value||'').trim().replace(/\/+$/,'');localStorage.setItem('reclaire_api_base',API_BASE);notify('Saved','API base updated.');if(state.apiKey)await loadAccount();render()});
  $('[data-action=copy-referral]')?.addEventListener('click',async()=>{try{const v=state.referralId||state.user?.id||'';if(!v)throw Error('Referral ID is unavailable.');await navigator.clipboard.writeText(v);notify('Copied','Referral ID copied to clipboard.')}catch(e){notify('Copy failed',e.message)}});
  $('[data-action=close-survey]')?.addEventListener('click',()=>{state.surveyOpen=false;render()});
  const surveyForm=$('#surveyForm');
  if(surveyForm)surveyForm.onsubmit=async e=>{
    e.preventDefault();
    const fd=new FormData(surveyForm);
    try{
      const answers=String(fd.get('q4_answers')||'').split(',').map(x=>x.trim()).filter(Boolean);
      await api('/v1/survey',{method:'POST',body:JSON.stringify({q1_answer:fd.get('q1_answer'),q2_answer:fd.get('q2_answer'),q3_answer:fd.get('q3_answer'),q4_answers:answers})});
      state.surveyOpen=false;
      notify('Thank you','Your survey response was recorded.');
      render();
    }catch(e){notify('Survey failed',e.message)}
  };
  $('[data-action=delete-account]')?.addEventListener('click',()=>{state.deleteStage=1;render()});
  $$('[data-action=cancel-delete]').forEach(b=>b.onclick=()=>{state.deleteStage=0;render()});
  $('[data-action=confirm-delete]')?.addEventListener('click',()=>{state.deleteStage=2;render()});
  $('#deletePhraseInput')?.addEventListener('input',e=>{const btn=$('#finalDeleteBtn');if(btn)btn.disabled=e.target.value!=='DELETEfromAPP'});
  $('[data-action=final-delete]')?.addEventListener('click',deleteAccount);
  document.addEventListener('click',outside,{once:true})
}
async function deleteAccount(){
  try{
    const btn=$('#finalDeleteBtn');if(btn)btn.disabled=true;
    await api('/auth/me',{method:'DELETE'});
    localStorage.removeItem('reclaire_api_key');
    localStorage.removeItem('reclaire_username');
    localStorage.removeItem('reclaire_referral_id');
    localStorage.removeItem('reclaire_priority_points');
    state.apiKey='';
    state.user=null;
    state.logs=[];
    state.priorityPoints=0;
    state.referralId='';
    state.notifications=[];
    state.unreadNotifications=0;
    saveNotifications();
    state.deleteStage=0;
    state.screen='landing';
    state.page='playground';
    notify('Account deleted','Your ReClaire account has been deleted.');
    render();
  }catch(e){
    notify('Deletion failed',e.message);
    const btn=$('#finalDeleteBtn');if(btn)btn.disabled=false;
  }
}

function positionDropdown(){const t=$('.custom-select'),m=$('#modeDropdown');if(!t||!m)return;const r=t.getBoundingClientRect();m.style.left=Math.min(r.left,innerWidth-m.offsetWidth-10)+'px';m.style.top=Math.min(r.bottom+7,innerHeight-m.offsetHeight-10)+'px'}function outside(e){if(state.dropdown&&!e.target.closest('.custom-select')&&!e.target.closest('#modeDropdown')){state.dropdown=null;render()}}
(async() => {
  setTheme(state.theme);
  
  // Check for OAuth callback first
  await handleAuthCallback();
  
  // If we have an API key, try to load account
  if (state.apiKey) {
    if (await loadAccount()) {
      state.screen = 'app';
    } else {
      localStorage.removeItem('reclaire_api_key');
      state.apiKey = '';
    }
  }
  render();
})();
</script>
</body>
</html>
