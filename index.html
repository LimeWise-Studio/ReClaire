<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <title>ReClaire — Web Intelligence Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f7f7f5;
      --surface: #fff;
      --surface2: #f0f0ed;
      --surface3: #e6e6e1;
      --text: #0b0b0b;
      --text2: #303030;
      --muted: #707070;
      --border: #deded8;
      --border2: #bdbdb5;
      --accent: #111;
      --accentSoft: #ecece8;
      --gold: #8b6a22;
      --goldSoft: #f4ecd7;
      --success: #16703b;
      --danger: #b3261e;
      --shadow: 0 18px 55px rgba(0,0,0,.08);
      --topbar: 66px;
      --sidebar: 270px;
      --radius: 16px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    [data-theme="dark"] {
      --bg: #0b0b0b;
      --surface: #141414;
      --surface2: #1b1b1b;
      --surface3: #242424;
      --text: #fff;
      --text2: #dedede;
      --muted: #9b9b9b;
      --border: #303030;
      --border2: #494949;
      --accent: #EFD09E;
      --accentSoft: rgba(239,208,158,.12);
      --gold: #EFD09E;
      --goldSoft: rgba(239,208,158,.12);
      --success: #68c892;
      --danger: #ff8078;
      --shadow: 0 22px 65px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; }
    html { height: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.55 'Ubuntu', ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    button, input, textarea { font: inherit; }
    button { border: 0; color: inherit; cursor: pointer; }
    a { text-decoration: none; color: inherit; }
    svg { display: block; }
    .hidden { display: none !important; }
    .mono { font-family: var(--mono); }
    .muted { color: var(--muted); }

    .btn {
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-weight: 750;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }
    .btn:hover { transform: translateY(-1px); border-color: var(--border2); }
    .btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    .btn.ghost { background: transparent; }
    .icon-btn {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      display: grid;
      place-items: center;
    }
    .icon-btn:hover { background: var(--surface2); }
    
    .input {
      width: 100%;
      height: 46px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      outline: 0;
      padding: 0 13px;
    }
    .input:focus, .question-input:focus, .url-input:focus, .textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accentSoft);
    }
    .textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      outline: 0;
      padding: 12px 13px;
      resize: vertical;
      min-height: 100px;
    }

    /* Public */
    .public-shell { height: 100dvh; overflow: auto; background: var(--bg); scroll-behavior: smooth; }
    .public-nav {
      height: 72px;
      max-width: 1200px;
      margin: auto;
      padding: 0 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand-word { display: flex; align-items: center; gap: 10px; font-weight: 850; letter-spacing: -.035em; }
    .brand-logo { width: 34px; height: 34px; object-fit: contain; filter: brightness(0); }
    [data-theme="dark"] .brand-logo { filter: brightness(0) invert(1); }
    
    .landing { max-width: 1120px; margin: auto; padding: 80px 25px 100px; }
    .hero { text-align: center; max-width: 850px; margin: auto; }
    .hero-logo { width: 84px; height: 84px; object-fit: contain; margin: 0 auto 28px; filter: brightness(0); }
    [data-theme="dark"] .hero-logo { filter: brightness(0) invert(1); }
    .hero h1 { font: 600 clamp(54px, 8vw, 92px)/.95 Georgia, serif; letter-spacing: -.065em; margin: 0 0 24px; }
    .hero p { max-width: 680px; margin: auto; color: var(--text2); font-size: 18px; }
    .hero-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 30px 0 90px; }
    
    .section { margin-top: 90px; }
    .section-head { display: flex; justify-content: space-between; gap: 20px; align-items: end; margin-bottom: 18px; }
    .section-head h2 { margin: 0; font-size: 25px; letter-spacing: -.04em; }
    .eyebrow { font-size: 10px; font-weight: 850; letter-spacing: .13em; text-transform: uppercase; color: var(--accent); margin-bottom: 7px; }
    
    .feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .feature {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 15px;
      padding: 22px;
      min-height: 175px;
      transition: transform .2s ease, border-color .2s ease;
    }
    .feature:hover { transform: translateY(-3px); border-color: var(--border2); }
    .feature-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--accentSoft);
      color: var(--accent);
      display: grid;
      place-items: center;
    }
    .feature h3 { font-size: 15px; margin: 16px 0 7px; }
    .feature p { margin: 0; color: var(--muted); font-size: 13px; }
    
    .examples { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .example { border: 1px solid var(--border); background: var(--surface); border-radius: 15px; overflow: hidden; }
    .example-head { padding: 14px 16px; border-bottom: 1px solid var(--border); font-weight: 750; }
    .example-code {
      min-height: 125px;
      padding: 17px;
      background: var(--surface2);
      font: 12px/1.65 var(--mono);
      white-space: pre-wrap;
      color: var(--text2);
    }
    
    .public-footer {
      max-width: 1120px;
      margin: auto;
      border-top: 1px solid var(--border);
      padding: 24px 25px 45px;
      color: var(--muted);
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      gap: 15px;
    }

    /* Additional layout components follow structurally identical clear formatting ... */
    
    /* Animations */
    @keyframes panelIn { from { opacity: 0; transform: translateY(-5px) scale(.985); } to { opacity: 1; transform: none; } }
    @keyframes drawerIn { from { opacity: 0; transform: translate(-50%, 14px); } to { opacity: 1; transform: translate(-50%, 0); } }
    @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes typing { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

    /* Media Queries */
    @media(max-width: 1050px) {
      :root { --sidebar: 245px; }
      .feature-grid { grid-template-columns: repeat(2, 1fr); }
      .settings-grid { grid-template-columns: 1fr; }
      .input-row, .input-row.no-format { grid-template-columns: 160px 1fr 160px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
    }
    @media(max-width: 800px) {
      .topbar { padding: 0 9px; }
      .account-name { max-width: 90px; }
      .sidebar {
        position: fixed; top: var(--topbar); bottom: 0; left: 0;
        transform: translateX(-105%); width: min(300px, 88vw); box-shadow: var(--shadow);
      }
      .sidebar.right { left: auto; right: 0; transform: translateX(105%); }
      .sidebar.open { transform: translateX(0); }
      .sidebar-overlay.show { display: block; }
      .input-row, .input-row.no-format { grid-template-columns: 1fr; }
      .execute { width: 100%; }
      .playground { padding: 37px 15px 70px; }
      .main-brand h1 { font-size: 36px; }
      .feature-grid, .examples, .stats, .usage-costs { grid-template-columns: 1fr; }
      .landing { padding-top: 45px; }
      .hero h1 { font-size: 55px; }
    }
    @media(max-width: 520px) {
      .topbar { display: flex; justify-content: space-between; }
      .top-right { gap: 5px; }
      .auth-card { padding: 27px 20px; border-radius: 17px; }
      .social-grid { grid-template-columns: 1fr; }
      .hero h1 { font-size: 49px; }
      .hero-actions .btn { width: 100%; }
      .public-nav { padding: 0 16px; }
      .landing { padding-left: 16px; padding-right: 16px; }
      .format-drawer { bottom: 0; border-radius: 17px 17px 0 0; width: 100%; }
      .batch-row { grid-template-columns: 25px 1fr 30px; }
      .page { padding: 23px 15px 55px; }
      .batch-actions { align-items: stretch; flex-direction: column; }
      .batch-actions .btn { width: 100%; }
    }
  </style>
</head>
<body data-theme="light">
  <div id="app"></div>
  <div id="toastStack" class="toast-stack"></div>

  <script>
    (() => {
      'use strict';
      
      let API_BASE = localStorage.getItem('reclaire_api_base') || 'https://reclaire-api.onrender.com';
      const SUPABASE_URL = 'https://lbraefssokojulyfmmjd.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxicmFlZnNzb2tvanVseWZtbWpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMjQyODksImV4cCI6MjEwMzYwMDI4OX0.e_jmB4jS_-cwKAraZpspPhEW_K4l2mbhhPZAlgN_y1E';
      let supabaseClient = null;
      
      if (typeof supabase !== 'undefined' && SUPABASE_URL && SUPABASE_ANON_KEY) {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
      
      if (supabaseClient) {
        supabaseClient.auth.onAuthStateChange((event, session) => {
          if (session && session.user) {
            state.user = {
              name: session.user.user_metadata.full_name || session.user.email,
              email: session.user.email,
              avatar: session.user.user_metadata.avatar_url
            };
            
            state.screen = 'app';
            state.page = 'playground';
            
            if (window.location.hash.includes('access_token')) {
              window.history.replaceState(null, '', window.location.pathname);
            }
            render();
          }
        });
      }

      const state = {
        screen: 'landing',
        authMode: 'login',
        page: 'playground',
        theme: localStorage.getItem('reclaire_theme') || 'light',
        sidebarSide: localStorage.getItem('reclaire_sidebar_side') || 'left',
        sidebarOpen: false,
        notificationsOpen: false,
        dropdown: null,
        formatDrawer: false,
        batchOpen: false,
        mode: 'scrape',
        formats: ['markdown'],
        question: '',
        url: '',
        user: null,
        apiKey: localStorage.getItem('reclaire_api_key') || '',
        logs: [],
        result: null,
        loading: false,
        batchRows: [],
        batchRunning: false,
        batchId: null,
        animatedTimers: []
      };

      const $ = (s, r = document) => r.querySelector(s);
      const $$ = (s, r = document) => [...r.querySelectorAll(s)];
      
      // Core Utility Functions
      const esc = v => String(v ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
      const logoImg = c => `<img class="${c || ''}" src="reclaire-logo.svg" alt="ReClaire logo" onerror="this.style.visibility='hidden'">`;
      const initials = n => (n || 'User').split(/\s+/).map(x => x[0]).join('').slice(0, 2).toUpperCase();
      
      function renderMd(src = '') {
        let s = esc(src);
        s = s.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>')
             .replace(/^##\s+(.+)$/gm, '<h2>$1</h2>')
             .replace(/^#\s+(.+)$/gm, '<h2>$1</h2>')
             .replace(/^\s*[-*]\s+(.+)$/gm, '<li>$1</li>')
             .replace(/(<li>[\s\S]*?<\/li>)(?!<li>)/g, '$1')
             .replace(/(<li>.*?<\/li>)/gs, '<ul>$1</ul>')
             .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
             .replace(/`([^`]+)`/g, '<code>$1</code>');
             
        return s.split(/\n{2,}/).map(x => x.match(/^<h[23]>/) ? x : `<p>${x.replace(/\n/g, '<br>')}</p>`).join('');
      }
      
      function notify(t, x) {
        const e = document.createElement('div');
        e.className = 'toast';
        e.innerHTML = `<strong>${esc(t)}</strong><span>${esc(x)}</span>`;
        $('#toastStack').appendChild(e);
        setTimeout(() => e.remove(), 4300);
      }
      
      function setTheme(t) {
        state.theme = t;
        document.body.dataset.theme = t;
        localStorage.setItem('reclaire_theme', t);
        $('meta[name=theme-color]').setAttribute('content', t === 'dark' ? '#0b0b0b' : '#f7f7f5');
      }
      
      function headers() {
        return state.apiKey 
          ? { 'X-API-Key': state.apiKey, 'Content-Type': 'application/json' } 
          : { 'Content-Type': 'application/json' };
      }
      
      async function api(path, opt = {}) {
        const r = await fetch(API_BASE + path, { ...opt, headers: { ...headers(), ...(opt.headers || {}) } });
        let d = {};
        try { d = await r.json(); } catch {}
        if (!r.ok) throw Error(d.detail || d.message || `Request failed (${r.status})`);
        return d;
      }
      
      // Main Execution flow for scrape/map/crawl
      async function execute() {
        if (state.loading) return;
        const u = state.url.trim();
        
        if (!u) {
          notify('URL required', 'Enter a valid website URL.');
          return;
        }
        if (state.formats.includes('questions') && state.mode === 'scrape' && !state.question.trim()) {
          notify('Question required', 'Enter a question for the Q&A format.');
          return;
        }
        
        state.loading = true;
        state.result = null;
        render();
        
        try {
          let d;
          if (state.mode === 'scrape') {
            d = await api('/v1/scrape', {
              method: 'POST',
              body: JSON.stringify({ url: u, formats: state.formats, user_question: state.question || null, use_js_fallback: true, only_main_content: true })
            });
          } else if (state.mode === 'map') {
            d = await api('/v1/map', {
              method: 'POST',
              body: JSON.stringify({ url: u, limit: 100, include_subdomains: false })
            });
          } else {
            d = await api('/v1/crawl', {
              method: 'POST',
              body: JSON.stringify({ url: u, limit: 5, scrape_options: { url: u, formats: state.formats, user_question: state.question || null, use_js_fallback: true, only_main_content: true }})
            });
          }
          
          state.result = d;
          await loadAccount();
          notify('Complete', `${d.tokens_deducted || 1} token(s) used.`);
        } catch (e) {
          state.result = { error: e.message };
          notify('Request failed', e.message);
        } finally {
          state.loading = false;
          render();
        }
      }

      // Bootstrap initialization
      (async () => {
        setTheme(state.theme);
        if (state.apiKey) {
          if (await loadAccount()) state.screen = 'app';
          else {
            localStorage.removeItem('reclaire_api_key');
            state.apiKey = '';
          }
        }
        render();
      })();
    })();
  </script>
</body>
</html>
