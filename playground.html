<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Playground</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --text: #12151A;
    --text-muted: #5B6472;
    --text-faint: #9097A1;
    --border: #E2E5EA;
    --accent: #2A4FE0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #FFFFFF;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    padding: 64px 20px;
  }

  .container {
    width: 100%;
    max-width: 480px;
  }

  h1 {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-muted);
    margin: 0 0 32px;
  }

  .panel {
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
  }

  .panel:first-of-type { border-top: 1px solid var(--border); }

  .panel .label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-faint);
    margin-bottom: 4px;
  }

  .panel .value {
    font-size: 15px;
    color: var(--text);
    word-break: break-all;
  }

  .panel .value.mono {
    font-family: ui-monospace, 'SFMono-Regular', 'Roboto Mono', monospace;
    font-size: 14px;
  }

  .panel .value.link {
    color: var(--accent);
  }

  .panel .sub {
    margin-top: 6px;
    font-size: 13px;
    color: var(--text-muted);
  }

  .empty-state {
    display: none;
    text-align: center;
    padding: 60px 20px;
  }

  .empty-state p {
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.6;
    margin: 0 0 16px;
  }

  .empty-state a {
    color: var(--accent);
    font-size: 14px;
    text-decoration: none;
    font-weight: 500;
  }

  .empty-state a:hover { text-decoration: underline; }

  .logout-btn {
    margin-top: 28px;
    padding: 9px 16px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: #FFFFFF;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }

  .logout-btn:hover { color: var(--text); border-color: var(--text-faint); }
</style>
</head>
<body>

<div class="container" id="dataView">
  <h1>Account</h1>

  <div class="panel">
    <div class="label">Email</div>
    <div class="value" id="pEmail">—</div>
  </div>

  <div class="panel">
    <div class="label">Username</div>
    <div class="value" id="pUsername">—</div>
  </div>

  <div class="panel">
    <div class="label">API key</div>
    <div class="value mono" id="pApiKey">—</div>
  </div>

  <div class="panel">
    <div class="label">Referral</div>
    <div class="value mono" id="pReferralCode">—</div>
    <div class="sub link" id="pReferralLink"></div>
  </div>

  <div class="panel">
    <div class="label">Tokens remaining</div>
    <div class="value" id="pTokens">—</div>
  </div>

  <div class="panel">
    <div class="label">User ID</div>
    <div class="value mono" id="pUserId">—</div>
  </div>

  <button class="logout-btn" id="logoutBtn">Log out</button>
</div>

<div class="empty-state" id="emptyState">
  <p>No session found on this device.</p>
  <a href="signup.html">Go to sign up →</a>
</div>

<script>
  // ====== CONFIGURE THESE (must match signup.html) ======
  const SUPABASE_URL = "https://lbraefssokojulyfmmjd.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxicmFlZnNzb2tvanVseWZtbWpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMjQyODksImV4cCI6MjEwMzYwMDI4OX0.e_jmB4jS_-cwKAraZpspPhEW_K4l2mbhhPZAlgN_y1E";
  const SIGNUP_URL = "https://limewise-studio.github.io/ReClaire/signup.html";
  // ========================================================

  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const SESSION_KEY = 'rc_session';

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await sb.auth.signOut();
    const existing = JSON.parse(localStorage.getItem(SESSION_KEY) || '{}');
    if (existing.api_key) {
      localStorage.setItem(SESSION_KEY, JSON.stringify({ api_key: existing.api_key }));
    } else {
      localStorage.removeItem(SESSION_KEY);
    }
    window.location.href = SIGNUP_URL;
  });

  function maskApiKey(key) {
    if (!key) return null;
    if (key.length <= 3) return key;
    return key.slice(0, 3) + '•'.repeat(key.length - 3);
  }

  (function init() {
    const raw = localStorage.getItem(SESSION_KEY);
    let session = null;
    try {
      session = raw ? JSON.parse(raw) : null;
    } catch (e) {
      session = null;
    }

    if (!session || !session.user) {
      document.getElementById('dataView').style.display = 'none';
      document.getElementById('emptyState').style.display = 'block';
      return;
    }

    const user = session.user;

    document.getElementById('pEmail').textContent = user.email || '—';
    document.getElementById('pUsername').textContent = user.username || '—';
    document.getElementById('pUserId').textContent = user.id || '—';

    const maskedKey = maskApiKey(session.api_key);
    document.getElementById('pApiKey').textContent =
      maskedKey || 'Not shown here — only returned once, at creation';

    document.getElementById('pReferralCode').textContent = session.referral_code || '—';
    document.getElementById('pReferralLink').textContent = session.referral_link || '';

    document.getElementById('pTokens').textContent =
      session.tokens_remaining !== undefined && session.tokens_remaining !== null
        ? session.tokens_remaining
        : '—';
  })();
</script>

</body>
</html>
