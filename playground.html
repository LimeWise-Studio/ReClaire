  async function api(path, options = {}) {
    if (!session?.api_key) throw new Error('Your API key is not available in this session. Regenerate it from API keys.');
    const headers = {'Content-Type':'application/json','X-API-Key':session.api_key,...(options.headers||{})};
    const res = await fetch(`${apiBase.replace(/\/$/,'')}${path}`, {...options,headers});
    let data = null;
    try { data = await res.json(); } catch {}
    if (!res.ok) throw new Error(data?.detail || data?.message || `Request failed (${res.status})`);
    return data;
  }

  function renderMarkdownish(text) {
    const source=String(text||'').trim();
    if(!source) return '<div class="output-empty">No response content returned.</div>';
    const lines=source.split(/\r?\n/); let html=''; let listOpen=false;
    const closeList=()=>{if(listOpen){html+='</ul>';listOpen=false}};
    for(const raw of lines){const line=raw.trim(); if(!line){closeList();continue}
      const h=line.replace(/^#{1,3}\s+/,'');
      if(/^#{1,3}\s+/.test(line)){closeList();html+=`<h2>${esc(h)}</h2>`;continue}
      if(/^[-*]\s+/.test(line)){if(!listOpen){html+='<ul>';listOpen=true}html+=`<li>${inlineFormat(line.replace(/^[-*]\s+/,''))}</li>`;continue}
      closeList(); html+=`<p>${inlineFormat(line)}</p>`;
    } closeList(); return html;
  }
  function inlineFormat(s){
    let out=esc(s); out=out.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>'); out=out.replace(/`(.+?)`/g,'<strong>$1</strong>'); return out;
  }

  function filenameFor(format,url){

  }

  async function runCurrent(){
    if(isBusy)return; const mode=document.getElementById('modeSelect').value; const format=document.getElementById('formatSelect').value; const raw=document.getElementById('urlInput').value.trim();
    if(!raw){toast('Enter a URL first.');return}
    isBusy=true; startLoading();
    try{
      let data;
      if(mode==='scrape'){
        const body={url:raw,formats:[format],use_js_fallback:true,only_main_content:true};
        if(format==='questions'){const q=document.getElementById('questionInput')?.value.trim();if(!q)throw new Error('Enter a question for Q&A.');body.user_question=q}
        if(format==='json'){const rawSchema=document.getElementById('schemaInput')?.value.trim();if(!rawSchema)throw new Error('Enter a JSON schema.');try{body.json_schema=JSON.parse(rawSchema)}catch{throw new Error('JSON schema is not valid JSON.')}}
        data=await api('/v1/scrape',{method:'POST',body:JSON.stringify(body)});
      }else if(mode==='map'){
        data=await api('/v1/map',{method:'POST',body:JSON.stringify({url:raw,limit:100,include_subdomains:false})});
      }else{
        data=await api('/v1/crawl',{method:'POST',body:JSON.stringify({url:raw,limit:5,scrape_options:{url:raw,formats:['markdown'],use_js_fallback:true,only_main_content:true}})});
      }
      setTokens(data.tokens_remaining); renderResult(data,mode,format,raw);
      addTask({mode,format:mode==='map'?'links':format,url:raw,timestamp:new Date().toISOString(),data}); renderRecent();

  }

  async function runBatch(){

  function renderResult(data,mode,format,url){
    const out=document.getElementById('output'), actions=document.getElementById('outputActions'); actions.innerHTML='';
    let content='', raw=false, filename=filenameFor(format,url), mime='text/plain';
    if(mode==='map'){content=data.links||[];raw=true;filename=filenameFor('json',url);mime='application/json';}
    else if(mode==='crawl'){content=(data.data||[]).map(r=>`URL: ${r.url}\nStatus: ${r.status}\n${r.markdown||r.error||''}`).join('\n\n');raw=true;filename=filenameFor('markdown',url);}
    else if(format==='summary'){content=data.summary||''}
    else if(format==='questions'){content=data.answer||''}
    else if(format==='json'){content=data.json;raw=true;filename=filenameFor('json',url);mime='application/json'}
    else if(format==='markdown' || format==='html' || format==='raw_html'){
      const backendKey=format==='markdown'?'markdown':format;
      if (data[backendKey] !== undefined && data[backendKey] !== null) content = data[backendKey]; else {content=`The backend completed the scrape, but /v1/scrape currently does not return the ${format} payload.\n\nURL: ${data.url||url}\nTokens deducted: ${data.tokens_deducted ?? '—'}`;raw=true}
    }
    if(typeof content==='object')content=JSON.stringify(content,null,2);
    if(raw) out.innerHTML=`<pre class="raw-output">${esc(content)}</pre>`; else out.innerHTML=`<div class="ai-output">${renderMarkdownish(content)}</div>`;
    const copy=document.createElement('button');copy.className='btn small-btn';copy.innerHTML=icon('copy',14)+'<span>Copy</span>';copy.onclick=()=>copyText(String(typeof content==='object'?JSON.stringify(content,null,2):content),copy);
    actions.appendChild(copy);
    const dl=document.createElement('button');dl.className='btn small-btn';dl.innerHTML=icon('download',14)+'<span>Download</span>';dl.onclick=()=>downloadText(String(content),filename,mime);actions.appendChild(dl);
  }

  function renderCodeExamples(){const key=session.api_key||'YOUR_RECLAIRE_API_KEY';const examples=[['Standard Static Scrape (1 token)',`curl -X POST "${apiBase}/v1/scrape" \\\n  -H "X-API-Key: ${key}" \\\n  -H "Content-Type: application/json" \\\n  -d '{\n    "url": "https://example.com",\n    "formats": ["markdown"]\n  }'`],['Dynamic Scrape with Playwright Fallback (3 tokens)',`curl -X POST "${apiBase}/v1/scrape" \\\n  -H "X-API-Key: ${key}" \\\n  -H "Content-Type: application/json" \\\n  -d '{\n    "url": "https://example.com",\n    "formats": ["markdown"],\n    "use_js_fallback": true\n  }'`],['Scrape with AI Summary (+3 format tokens)',`curl -X POST "${apiBase}/v1/scrape" \\\n  -H "X-API-Key: ${key}" \\\n  -H "Content-Type: application/json" \\\n  -d '{\n    "url": "https://example.com",\n    "formats": ["markdown", "summary"]\n  }'`],['Map Site Links (1 token)',`curl -X POST "${apiBase}/v1/map" \\\n  -H "X-API-Key: ${key}" \\\n  -H "Content-Type: application/json" \\\n  -d '{\n    "url": "https://example.com"\n  }'`],['Crawl Entire Site (1 token per successful page)',`curl -X POST "${apiBase}/v1/crawl" \\\n  -H "X-API-Key: ${key}" \\\n  -H "Content-Type: application/json" \\\n  -d '{\n    "url": "https://example.com",\n    "limit": 5\n  }'`]];document.getElementById('codeExamples').innerHTML=examples.map(([label,code])=>`<div class="code-example"><div class="code-label"><span>${esc(label)}</span><button class="icon-btn" style="width:30px;height:30px" data-copy-code="${encodeURIComponent(code)}">${icon('copy',14)}</button></div><pre>${esc(code)}</pre></div>`).join('');document.querySelectorAll('[data-copy-code]').forEach(b=>b.onclick=()=>copyText(decodeURIComponent(b.dataset.copyCode),b))}
  async function regenerateKey(){if(!confirm('Regenerate your API key? The current key will be revoked.'))return;try{const d=await api('/auth/api-key/regenerate',{method:'POST',body:'{}'});if(d.api_key){session.api_key=d.api_key;session.user=d.user?.username?{...session.user,username:d.user.username}:session.user;session.tokens_remaining=d.tokens_remaining;localStorage.setItem(SESSION_KEY,JSON.stringify(session));toast('New API key created.');renderKeys()}}catch(e){toast(e.message)}}

  function renderSupport(){document.getElementById('main').innerHTML=`<div class="page-head"><h1>Support</h1><p>Send a message to the ReClaire support team.</p></div><section class="panel"><form class="support-form" id="supportForm"><label>Email<input class="field" id="supportEmail" value="${esc(currentUser().email||'')}" readonly></label><label>Subject<input class="field" id="supportSubject" placeholder="How can we help?"></label><label>Message<textarea class="textarea" id="supportMessage" placeholder="Describe the issue or question…"></textarea></label><div class="support-actions"><button class="btn primary" type="submit">Open email</button></div></form><p class="muted" style="font-size:11px;margin:12px 0 0">Support: reclaire.support@gmail.com</p></section>`;document.getElementById('supportForm').onsubmit=e=>{e.preventDefault();const subject=document.getElementById('supportSubject').value.trim();const message=document.getElementById('supportMessage').value.trim();if(!subject||!message){toast('Add a subject and message.');return}window.location.href=`mailto:reclaire.support@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(`From: ${currentUser().email||''}\n\n${message}`)}`}}
  function showPageError(id,msg){const el=document.getElementById(id);if(el)el.textContent=msg}

  async function navigate(view, mode){closeSidebar();currentView=view;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===view && (!mode || b.dataset.mode===mode)));if(view==='playground')renderPlayground(mode||'scrape');else if(view==='activity')await renderActivity();else if(view==='usage')await renderUsage();else if(view==='keys')await renderKeys();else if(view==='support')renderSupport()}

  function setTheme(theme){localStorage.setItem(THEME_KEY,theme);const app=document.getElementById('app');app.dataset.theme=theme;const btn=document.getElementById('themeBtn');if(btn)btn.textContent=theme==='dark'?'Dark':'Light';const side=btn?.parentElement?.querySelector('span');if(side)side.innerHTML=`${theme==='dark'?icon('moon',15):icon('sun',15)}<span>Theme</span>`}
  function setSidebarPosition(pos){localStorage.setItem(SIDEBAR_KEY,pos);document.getElementById('app').dataset.sidebar=pos}

  async function logout(){try{if(session?.api_key)await api('/auth/logout',{method:'POST',body:'{}'})}catch(e){console.warn(e)}try{await sb.auth.signOut()}catch(e){console.warn(e)}localStorage.removeItem(SESSION_KEY);window.location.href=SIGNUP_URL}

  function bindGlobal(){document.getElementById('menuBtn').onclick=openSidebar;document.getElementById('closeSidebar').onclick=closeSidebar;document.getElementById('scrim').onclick=closeSidebar;document.getElementById('logoutBtn').onclick=logout;document.getElementById('themeBtn').onclick=()=>setTheme(getTheme()==='dark'?'light':'dark');document.getElementById('sidebarPosition').onchange=e=>setSidebarPosition(e.target.value);document.querySelectorAll('[data-view]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();navigate(el.dataset.view,el.dataset.mode)}));document.getElementById('sidebar').setAttribute('data-open','false')}

  async function init(){
    if(!session?.user){window.location.href=SIGNUP_URL;return}
    injectStyles();document.body.innerHTML=shell();bindGlobal();setTokens(session.tokens_remaining);await refreshMe();renderPlayground('scrape');
  }

  init();
})();
