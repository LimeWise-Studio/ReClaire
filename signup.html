<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReClaire - Sign In / Survey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #000000;
            --secondary: #EFD09E;
            --bg-color: #F8F9FA;
            --surface: #FFFFFF;
            --text-main: #111111;
            --text-muted: #777777;
            --input-bg: #F4F4F6;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rubik', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Top Progress Bar */
        .progress-container {
            width: 100%;
            height: 6px;
            background-color: #E0E0E0;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
        }

        .progress-bar {
            height: 100%;
            width: 20%;
            background-color: var(--secondary);
            transition: width 0.4s ease;
        }

        /* Layout Container */
        .main-wrapper {
            width: 100%;
            max-width: 440px;
            padding: 2rem 1.5rem;
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
        }

        /* Logo Animation */
        .logo-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 2rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinning-svg {
            width: 100%;
            height: 100%;
            animation: spin 8s linear infinite;
        }

        .logo-text {
            position: absolute;
            font-size: 1.5rem;
            font-weight: 700;
            color: #FFFFFF;
            z-index: 2;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Form Card Styling (Matching 1000256912.jpg) */
        .form-card {
            background: var(--surface);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            width: 100%;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .subtitle a {
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }

        .input-group {
            position: relative;
            margin-bottom: 1rem;
        }

        .input-group input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            border: 2px solid transparent;
            border-radius: var(--border-radius);
            background-color: var(--input-bg);
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--secondary);
            background-color: var(--surface);
        }

        .input-icon-left {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            opacity: 0.5;
        }

        .input-icon-right {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            width: 20px;
            opacity: 0.5;
        }

        .forgot-link {
            display: block;
            text-align: left;
            font-size: 0.85rem;
            color: var(--text-main);
            font-weight: 500;
            text-decoration: none;
            margin-bottom: 2rem;
        }

        .primary-btn {
            width: 100%;
            padding: 1rem;
            background-color: var(--primary);
            color: var(--surface);
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .primary-btn:hover {
            background-color: #222;
        }
        
        .primary-btn:active {
            transform: scale(0.98);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 2rem 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #EAEAEA;
        }

        .divider span {
            padding: 0 1rem;
        }

        /* Social Login */
        .social-text {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-main);
            font-weight: 500;
            margin-bottom: 1.5rem;
        }

        .social-grid {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .social-btn {
            background-color: var(--input-bg);
            border: 2px solid transparent;
            border-radius: var(--border-radius);
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .social-btn:hover {
            background-color: var(--surface);
            border-color: var(--secondary);
        }

        .social-btn img {
            width: 24px;
            height: 24px;
        }

        /* Footer Terms */
        .terms-text {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .terms-text a {
            color: var(--text-main);
            font-weight: 700;
            text-decoration: underline;
            text-decoration-color: var(--secondary);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .form-card {
                box-shadow: none;
                padding: 1.5rem 1rem;
                background: transparent;
            }
            .main-wrapper {
                padding: 1rem;
                margin-top: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Survey Progress Bar -->
    <div class="progress-container">
        <div class="progress-bar" id="survey-progress"></div>
    </div>

    <div class="main-wrapper">
        <!-- Animated Logo -->
        <div class="logo-wrapper">
            <!-- External SVG acting as the spinning ring -->
            <img src="logo-ring.svg" alt="Spinning Ring" class="spinning-svg">
            <span class="logo-text">&lt;/&gt;</span>
        </div>

        <div class="form-card">
            <h1>Sign in</h1>
            <p class="subtitle">New user? <a href="/register">Create an account</a></p>

            <form id="auth-form">
                <div class="input-group">
                    <!-- Basic email envelope SVG -->
                    <svg class="input-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                    <!-- Mapped to backend UserLogin model: username_or_email -->
                    <input type="text" id="username_or_email" placeholder="Email Address" required autocomplete="username">
                </div>

                <div class="input-group">
                    <!-- Basic lock SVG -->
                    <svg class="input-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    <!-- Mapped to backend UserLogin model: password -->
                    <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
                    <!-- Eye toggle -->
                    <svg class="input-icon-right" id="toggle-password" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </div>

                <a href="/forgot" class="forgot-link">Forgot password?</a>

                <button type="submit" class="primary-btn" id="login-btn">Login</button>
            </form>

            <div class="divider">
                <span>or</span>
            </div>

            <p class="social-text">Join With Your Favourite Social Media Account</p>

            <div class="social-grid">
                <!-- Google (Replaced standard SVGs with data uris to ensure they render cleanly without assets) -->
                <button class="social-btn" type="button">
                    <img src="data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3e%3cpath fill='%23EA4335' d='M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z'/%3e%3cpath fill='%234285F4' d='M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z'/%3e%3cpath fill='%23FBBC05' d='M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z'/%3e%3cpath fill='%2334A853' d='M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z'/%3e%3c/svg%3e" alt="Google">
                </button>
                <!-- GitHub -->
                <button class="social-btn" type="button">
                    <img src="data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3e%3cpath d='M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z'/%3e%3c/svg%3e" alt="GitHub">
                </button>
            </div>

            <p class="terms-text">By signing in with an account, you agree to ReClaire's <br><a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</p>
        </div>
    </div>

    <script>
        // Password Visibility Toggle
        const togglePassword = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            // Toggle opacity to indicate state change visually
            togglePassword.style.opacity = type === 'password' ? '0.5' : '1';
        });

        // Form Submission hooked to the provided FastAPI Backend
        const authForm = document.getElementById('auth-form');
        const submitBtn = document.getElementById('login-btn');
        const progressBar = document.getElementById('survey-progress');

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const usernameOrEmail = document.getElementById('username_or_email').value;
            const password = document.getElementById('password').value;
            
            submitBtn.textContent = "Authenticating...";
            submitBtn.disabled = true;

            try {
                // Fetching against the /auth/login backend route provided in context
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username_or_email: usernameOrEmail,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Success! Store token and advance survey progress
                    localStorage.setItem('reClaire_token', data.access_token);
                    
                    // Animate progress bar to the next stage of the survey (e.g., 40%)
                    progressBar.style.width = '40%';
                    submitBtn.textContent = "Success! Loading next step...";
                    
                    // Delay for visual feedback before redirecting to the next survey component
                    setTimeout(() => {
                        window.location.href = "/survey/step-2"; // Replace with actual route
                    }, 800);
                } else {
                    // Handle FastAPI HTTPException detail
                    alert(data.detail || "Login failed. Please check your credentials.");
                    submitBtn.textContent = "Login";
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error("Network Error:", error);
                alert("Failed to connect to ReClaire.");
                submitBtn.textContent = "Login";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
